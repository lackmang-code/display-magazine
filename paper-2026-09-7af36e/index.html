.b-portrait{width:88px}

/* ══ 제목형 사진 페이지 (헤더 고정 + 아래 사진 가득) ══ */
.photo-fill{flex:1;min-height:0;position:relative;overflow:hidden;background:#222;border-radius:6px;display:flex}

/* ══ 전체 페이지 사진 (표준 5:7) ══ */
.full-photo{flex:1;min-height:0;position:relative;overflow:hidden;background:#222;display:flex}

/* 제자리 확대(인플레이스 줌) — 페이지 액자 안에서 확대, 팝업 없음 */

/* ══ 배출인력소개 — 그리드 인덱스 & 클릭 오버레이 ══ */
.grad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}

.grad-home-btn{position:absolute;top:10px;right:10px;z-index:2;background:#111;color:#fff;border:none;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}

.feat-title{font-size:1.7rem;line-height:1.25;letter-spacing:-.5px;margin:2px 0 8px}

.term .tv{flex:1;color:#444}

.closebox .cq-c .g{color:#fff;font-weight:700}

.cta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.cta-btn{display:inline-block;background:#ffd700;color:#1a1a1a;font-size:12px;font-weight:800;letter-spacing:.2px;padding:8px 14px;border-radius:6px;text-decoration:none}

.reveal{opacity:1;transform:none}

  .cta-btn{animation:ctaGlow 2.2s ease-in-out infinite}

}
</style>

<script>
/* ════════════════ 콘텐츠 데이터 (빌드 시 주입) ════════════════ */
const META = {"title_full": "미리보기"};
const PAPERS = [];
const CONFS = [];
const PATENTS = [];
const INTROS = [];
const TOC = [];

const FEATURED_PAPER = {"title": "순수 청색의 마지막 퍼즐, 고분자 그물로 풀다", "subtitle": "고분자 네트워크 하나로 페로브스카이트 블루 LED의 네 가지 고질병을 한꺼번에 해결한 성균관대 연구", "label": "이달의 논문", "paper_info": {"title": "Polymer Network Modified Perovskite for High-Performance Pure Blue Light-Emitting Diodes", "authors": "Zhongkai Yu, Jiawei Hong, Jiaxin Song 외, 이보람*(교신·성균관대 첨단디스플레이공학과)", "journal": "Advanced Functional Materials (Wiley-VCH), 2026 · DOI 10.1002/adfm.74731", "url": "https://doi.org/10.1002/adfm.74731"}, "pages": ["<div class=\"meta-box\"><div><span class=\"mk\">논문</span><a href=\"https://doi.org/10.1002/adfm.74731\" target=\"_blank\" rel=\"noopener\" style=\"color:#1a56a0;text-decoration:underline\"><em>Polymer Network Modified Perovskite for High-Performance Pure Blue Light-Emitting Diodes</em></a></div><div><span class=\"mk\">저자</span>Zhongkai Yu, Jiawei Hong, Jiaxin Song 외, 이보람*(교신·성균관대 첨단디스플레이공학과)</div><div><span class=\"mk\">게재</span>Advanced Functional Materials (Wiley-VCH), 2026 · DOI 10.1002/adfm.74731</div></div>\n\n<div class=\"dt\" style=\"margin-top:14px\"></div>\n\n스마트폰 화면이든 거실의 TV든, 우리가 보는 모든 색은 빨강·초록·파랑 세 가지 빛의 조합으로 만들어진다. 이 중 빨강과 초록 페로브스카이트 LED는 이미 상용화 문턱까지 왔지만, 파랑만은 유독 제자리걸음이었다. 성균관대학교 이보람 교수 연구팀은 고분자 그물 하나로 이 청색의 고질병을 한꺼번에 풀어냈다. Advanced Functional Materials에 게재된 이 연구로, 페로브스카이트 완전색 디스플레이 상용화의 마지막 퍼즐이 맞춰졌다.\n\n<h3 class=\"feat-h\">왜 유독 청색만 어려운가</h3>\n\n빨강·초록 페로브스카이트는 이미 상당한 효율을 확보했지만, 파랑은 사정이 다르다. 순수한 청색을 내려면 밴드갭이 넓은 페로브스카이트가 필요한데, 이 조성은 유독 결함에 취약하다. 결정을 이루는 염소(Cl) 이온이 빠져나간 자리, 즉 염소 공공이 쉽게 생겨 빛 대신 열로 에너지를 흘려보낸다. 필름을 만드는 과정에서도 결정이 고르게 자라지 못해 표면 곳곳에 미세한 구멍이 뚫리고, 서로 다른 물질이 맞닿는 계면에는 격자 크기 차이로 인한 변형이 쌓인다. 소자에 전압을 걸면 할라이드 이온들이 자리를 이탈해 이리저리 떠돌아다니며 스펙트럼마저 흔들어 놓는다. 네 가지 문제가 서로 얽혀 있어, 하나를 고치면 다른 하나가 불거지는 식이었다.", "<h3 class=\"feat-h\">고분자 그물 하나로 네 가지를 동시에</h3>\n\n연구팀이 택한 해법은 재료를 하나 더 얹는 대신, 얇은 고분자 그물로 페로브스카이트 표면 전체를 감싸는 것이었다. 동일한 단위체(4-비닐페놀)가 사슬처럼 반복 연결된 고분자, 줄여서 PVPh라 부르는 이 물질은 표면과 두 지점에서 동시에 결합한다. 이 이중 결합이 할라이드가 빠져나가는 데 필요한 에너지를 4.387에서 4.776 eV로 끌어올려, 애초에 공공이 생기기 어렵게 만든다(DFT 계산으로 확인).\n\n각도를 바꾼 X선 회절 결과, 처리 전 소자는 보는 각도에 따라 피크 위치가 흔들렸지만 고분자 그물을 두른 소자는 어느 각도에서나 피크가 그대로였다. 딱딱한 페로브스카이트와 말랑한 소재 사이에 쌓이던 압축 응력을 그물이 완충재처럼 흡수했다는 뜻이다.\n\n<div class=\"figbox\" style=\"max-width:365px; height:357px; margin:0 auto;\"><img src=\"assets/Fig4abc_GIXRD_mechanism.png\" alt=\"\"></div><div class=\"cap\">논문 Figure 4: (a)대조군·(b)PVPh 처리 페로브스카이트 막의 GIXRD 패턴, (c)PVPh 격자 변형 완화 모식도. (b)는 각도가 바뀌어도 피크 이동이 거의 없어 격자 변형이 해소됐음을 보여준다 (출처: Yu et al., Adv. Funct. Mater. 2026, CC BY)</div>", "<div class=\"figbox\" style=\"height:260px\"><img src=\"assets/Fig3_SEM_AFM_morphology.png\" alt=\"\"></div><div class=\"cap\" style=\"margin-bottom:14px\">논문 Figure 3: 대조군(위)·PVPh 처리(아래) 페로브스카이트 막의 SEM(좌)·AFM(가운데·우) 이미지. PVPh 처리 시 더 조밀하고 균일한 결정립이 형성된다 (출처: Yu et al., Adv. Funct. Mater. 2026, CC BY)</div>\n\n효과는 눈으로도 확인됐다. 현미경으로 들여다본 막 표면은 자갈밭처럼 거칠던 것(8.94nm)이 고분자 그물을 두른 뒤 매끈한 대리석 바닥에 가깝게(5.99nm) 바뀌었다. 왼쪽 위(대조군)는 알갱이가 뒤섞여 들쭉날쭉하지만, 왼쪽 아래(PVPh 처리)는 알갱이 크기가 고르게 정돈돼 있다. 결정립이 고르면 전하가 새는 통로도 그만큼 줄어든다.\n\n마지막 문제는 이온의 방랑벽이었다. 순수 청색을 내려면 서로 다른 할라이드 이온을 섞어야 하는데, 전압이 걸리면 이온들이 전기장을 따라 제멋대로 움직이다 뭉쳐버린다(상 분리, Phase Separation). 뭉친 이온은 발광 파장을 붉은 쪽으로 늘어뜨려 색을 흐트러뜨린다. PVPh 그물망은 이온이 도망갈 통로 자체를 가둬 상 분리를 막는다. 소자를 오래 켜둔 채 관찰한 결과, 그물 없는 소자는 빛이 붉은 쪽으로 밀렸지만(적색 편이), 그물을 두른 소자는 467nm 그대로였다.\n\n네 가지 문제(결함, 거친 표면, 계면 긴장, 이온 이동)를 각각 다른 재료로 처방하는 대신, 고분자 하나가 표면에 앉는 방식만으로 네 개의 문제를 동시에 겨냥한 셈이다. 연구팀은 이 메커니즘을 DFT 계산으로 결함 형성 에너지를, GIXRD로 격자 변형 완화를, 실제 소자의 발광 안정성 측정으로 이온 억제 효과를 각각 따로 검증했다.", "<h3 class=\"feat-h\">무엇을 이뤘나</h3>\n\n결과는 수치로 뚜렷했다. 최적화된 소자는 외부양자효율(EQE) 9.82%를 기록했는데, 이는 3차원 구조 기반 순수 블루 페로브스카이트 LED로는 지금까지 보고된 것 중 가장 높은 값이다. 최대 휘도는 1544 cd/m²에 달했고, 발광 파장은 순수 블루에 해당하는 467nm를 유지했다. 이런 향상의 뿌리는 더 근본적인 수치에서도 드러난다. 흡수한 빛이 다시 빛으로 되돌아오는 비율(PLQY)은 26.6%에서 43.9%로, 빛이 잦아드는 데 걸리는 시간(PL 수명)은 3.52ns에서 12.52ns로 늘었다. 결함에 붙잡혀 열로 새던 에너지가 그만큼 줄었다는 뜻이다. 이 개선이 특히 의미 있는 건 소자 구조 때문이다. 절연성 리간드 때문에 전하 수송이 막히기 쉬운 2D 구조나 퀀텀닷 방식과 달리, 3D 페로브스카이트는 원래도 전하가 잘 흐른다. 걸림돌은 결함뿐이었다. 이번 연구는 그 구조적 장점은 그대로 두고 결함만 콕 집어 해결해, 고효율과 고휘도를 동시에 잡았다. 무엇보다 이 성능이 복잡한 신물질 합성이 아니라, 기존 용액 공정에 고분자 한 종류를 더하는 손쉬운 방식으로 달성됐다는 점이 중요하다.\n\n<div class=\"sum-cards\"><div class=\"sum-card\" style=\"background:#fef3f0;border:1px solid #fdd9ce\"><div class=\"sum-num\" style=\"color:#111\">9.82%</div><div class=\"sum-lbl\" style=\"color:#aaa\">외부양자효율(EQE) · 3D 순수블루 PeLED 역대 최고</div></div><div class=\"sum-card\" style=\"background:#e8f0fb;border:1px solid #b3ccf0\"><div class=\"sum-num\" style=\"color:#111\">1544 cd/m²</div><div class=\"sum-lbl\" style=\"color:#aaa\">최대 휘도</div></div><div class=\"sum-card\" style=\"background:#e6f4ea;border:1px solid #a8d8b8\"><div class=\"sum-num\" style=\"color:#111\">467 nm</div><div class=\"sum-lbl\" style=\"color:#aaa\">발광 파장 (순수 블루)</div></div></div>\n\n<h3 class=\"feat-h\">왜 중요한가</h3>\n\n완전색 디스플레이를 상용화하려면 빨강·초록·파랑 세 색 모두 안정적인 발광원이 필요하다. 이번 연구는 그중 가장 늦었던 파랑의 효율과 안정성을 동시에 끌어올려, 페로브스카이트 기반 풀컬러 디스플레이 상용화에 필요한 마지막 퍼즐 조각을 채웠다. 결함, 거친 표면, 계면 긴장, 이온 이동이라는 서로 다른 네 가지 약점을 재료 하나로 한꺼번에 잡았다는 점에서, 이번 성과는 실험실 한 편의 결과를 넘어 앞으로 나올 초고화질·저비용 디스플레이 시장의 방향을 가늠하는 이정표이기도 하다. 접근 방식 자체도 특정 신물질 합성이 아니라 범용 고분자를 활용한 표면 처리라서, 다른 조성의 광대역갭 페로브스카이트에도 적용을 확장할 수 있는 여지가 크다. 우리가 마주할 다음 세대 화면 속 청색이 더 깊고 오래갈 때, 그 뒤에는 이 가느다란 고분자 그물이 있을지 모른다.", "<h3 class=\"feat-h\">한눈 요약</h3>\n\n<table class=\"recap\"><tr><td class=\"rk\">한 줄 요약</td><td>PVPh 고분자 네트워크 하나로 결함·거친 표면·계면 긴장·이온 이동, 페로브스카이트 블루 LED의 4가지 고질병을 동시에 억제해 순수 블루 EQE 9.82%로 역대 최고 기록을 세웠다</td></tr><tr><td class=\"rk\">핵심 성과</td><td>EQE 9.82% · 최대 휘도 1544 cd/m² · 발광파장 467nm (3D 순수블루 PeLED 최고 기록)</td></tr><tr><td class=\"rk\">강점</td><td>신물질 합성 없이 기존 용액공정에 고분자 처리만 추가, 확장성 높음</td></tr><tr><td class=\"rk\">게재</td><td>Advanced Functional Materials (Wiley-VCH), 2026</td></tr></table>\n\n<h3 class=\"feat-h\" style=\"margin-top:14px\">핵심 용어</h3>\n\n<div class=\"term\"><span class=\"tk\" style=\"width:111px\">페로브스카이트 LED(PeLED)</span><span class=\"tv\">페로브스카이트 결정 소재를 발광층으로 쓰는 발광다이오드. 좁은 발광선폭과 높은 색순도로 차세대 디스플레이 소재로 주목받지만, 파랑은 유독 결함에 취약해 상용화가 늦었다.</span></div>\n\n<div class=\"term\"><span class=\"tk\" style=\"width:111px\">할라이드 공공(Halide Vacancy)</span><span class=\"tv\">결정 격자에서 염소·브로민·아이오딘 같은 할라이드 이온이 빠져나간 빈자리. 빛 대신 열로 에너지를 새게 하는 결함 트랩으로 작용한다.</span></div>\n\n<div class=\"term\"><span class=\"tk\" style=\"width:111px\">계면격자변형(Interfacial Lattice Strain)</span><span class=\"tv\" style=\"text-align:left\">맞닿은 두 물질의 격자 간격이 달라 경계면에 누적되는 뒤틀림. 결함을 유발하고 소자 수명을 갉아먹는다. GIXRD 측정 결과 PVPh 처리 소자는 이 변형이 해소된 것으로 확인됐다.</span></div>\n\n<div class=\"closebox reveal\"><div class=\"cq-c\">이 연구는 성균관대학교 첨단디스플레이공학과 <span class=\"g\">이보람 교수</span> 연구팀이 수행한 결과입니다.</div><div class=\"cq-h\">첨단디스플레이공학과가 함께 연구할 대학원생을 기다립니다.</div><div class=\"cta-row\"><a class=\"cta-btn\" href=\"https://ded.skku.edu/ded/grad_intro.do\" target=\"_blank\" rel=\"noopener\">첨단디스플레이공학과<br>대학원 둘러보기 →</a><a class=\"cta-qr\" href=\"https://ded.skku.edu/ded/grad_intro.do\" target=\"_blank\" rel=\"noopener\" title=\"홈페이지 QR\"><img src=\"assets/qr.png\" alt=\"QR\"></a></div></div>"], "body": "<div class=\"meta-box\"><div><span class=\"mk\">논문</span><a href=\"https://doi.org/10.1002/adfm.74731\" target=\"_blank\" rel=\"noopener\" style=\"color:#1a56a0;text-decoration:underline\"><em>Polymer Network Modified Perovskite for High-Performance Pure Blue Light-Emitting Diodes</em></a></div><div><span class=\"mk\">저자</span>Zhongkai Yu, Jiawei Hong, Jiaxin Song 외, 이보람*(교신·성균관대 첨단디스플레이공학과)</div><div><span class=\"mk\">게재</span>Advanced Functional Materials (Wiley-VCH), 2026 · DOI 10.1002/adfm.74731</div></div>\n\n<div class=\"dt\" style=\"margin-top:14px\"></div>\n\n스마트폰 화면이든 거실의 TV든, 우리가 보는 모든 색은 빨강·초록·파랑 세 가지 빛의 조합으로 만들어진다. 이 중 빨강과 초록 페로브스카이트 LED는 이미 상용화 문턱까지 왔지만, 파랑만은 유독 제자리걸음이었다. 성균관대학교 이보람 교수 연구팀은 고분자 그물 하나로 이 청색의 고질병을 한꺼번에 풀어냈다. Advanced Functional Materials에 게재된 이 연구로, 페로브스카이트 완전색 디스플레이 상용화의 마지막 퍼즐이 맞춰졌다.\n\n<h3 class=\"feat-h\">왜 유독 청색만 어려운가</h3>\n\n빨강·초록 페로브스카이트는 이미 상당한 효율을 확보했지만, 파랑은 사정이 다르다. 순수한 청색을 내려면 밴드갭이 넓은 페로브스카이트가 필요한데, 이 조성은 유독 결함에 취약하다. 결정을 이루는 염소(Cl) 이온이 빠져나간 자리, 즉 염소 공공이 쉽게 생겨 빛 대신 열로 에너지를 흘려보낸다. 필름을 만드는 과정에서도 결정이 고르게 자라지 못해 표면 곳곳에 미세한 구멍이 뚫리고, 서로 다른 물질이 맞닿는 계면에는 격자 크기 차이로 인한 변형이 쌓인다. 소자에 전압을 걸면 할라이드 이온들이 자리를 이탈해 이리저리 떠돌아다니며 스펙트럼마저 흔들어 놓는다. 네 가지 문제가 서로 얽혀 있어, 하나를 고치면 다른 하나가 불거지는 식이었다.\n\n<!-- page -->\n\n<h3 class=\"feat-h\">고분자 그물 하나로 네 가지를 동시에</h3>\n\n연구팀이 택한 해법은 재료를 하나 더 얹는 대신, 얇은 고분자 그물로 페로브스카이트 표면 전체를 감싸는 것이었다. 동일한 단위체(4-비닐페놀)가 사슬처럼 반복 연결된 고분자, 줄여서 PVPh라 부르는 이 물질은 표면과 두 지점에서 동시에 결합한다. 이 이중 결합이 할라이드가 빠져나가는 데 필요한 에너지를 4.387에서 4.776 eV로 끌어올려, 애초에 공공이 생기기 어렵게 만든다(DFT 계산으로 확인).\n\n각도를 바꾼 X선 회절 결과, 처리 전 소자는 보는 각도에 따라 피크 위치가 흔들렸지만 고분자 그물을 두른 소자는 어느 각도에서나 피크가 그대로였다. 딱딱한 페로브스카이트와 말랑한 소재 사이에 쌓이던 압축 응력을 그물이 완충재처럼 흡수했다는 뜻이다.\n\n<div class=\"figbox\" style=\"max-width:365px; height:357px; margin:0 auto;\"><img src=\"assets/Fig4abc_GIXRD_mechanism.png\" alt=\"\"></div><div class=\"cap\">논문 Figure 4: (a)대조군·(b)PVPh 처리 페로브스카이트 막의 GIXRD 패턴, (c)PVPh 격자 변형 완화 모식도. (b)는 각도가 바뀌어도 피크 이동이 거의 없어 격자 변형이 해소됐음을 보여준다 (출처: Yu et al., Adv. Funct. Mater. 2026, CC BY)</div>\n\n<!-- page -->\n\n<div class=\"figbox\" style=\"height:260px\"><img src=\"assets/Fig3_SEM_AFM_morphology.png\" alt=\"\"></div><div class=\"cap\" style=\"margin-bottom:14px\">논문 Figure 3: 대조군(위)·PVPh 처리(아래) 페로브스카이트 막의 SEM(좌)·AFM(가운데·우) 이미지. PVPh 처리 시 더 조밀하고 균일한 결정립이 형성된다 (출처: Yu et al., Adv. Funct. Mater. 2026, CC BY)</div>\n\n효과는 눈으로도 확인됐다. 현미경으로 들여다본 막 표면은 자갈밭처럼 거칠던 것(8.94nm)이 고분자 그물을 두른 뒤 매끈한 대리석 바닥에 가깝게(5.99nm) 바뀌었다. 왼쪽 위(대조군)는 알갱이가 뒤섞여 들쭉날쭉하지만, 왼쪽 아래(PVPh 처리)는 알갱이 크기가 고르게 정돈돼 있다. 결정립이 고르면 전하가 새는 통로도 그만큼 줄어든다.\n\n마지막 문제는 이온의 방랑벽이었다. 순수 청색을 내려면 서로 다른 할라이드 이온을 섞어야 하는데, 전압이 걸리면 이온들이 전기장을 따라 제멋대로 움직이다 뭉쳐버린다(상 분리, Phase Separation). 뭉친 이온은 발광 파장을 붉은 쪽으로 늘어뜨려 색을 흐트러뜨린다. PVPh 그물망은 이온이 도망갈 통로 자체를 가둬 상 분리를 막는다. 소자를 오래 켜둔 채 관찰한 결과, 그물 없는 소자는 빛이 붉은 쪽으로 밀렸지만(적색 편이), 그물을 두른 소자는 467nm 그대로였다.\n\n네 가지 문제(결함, 거친 표면, 계면 긴장, 이온 이동)를 각각 다른 재료로 처방하는 대신, 고분자 하나가 표면에 앉는 방식만으로 네 개의 문제를 동시에 겨냥한 셈이다. 연구팀은 이 메커니즘을 DFT 계산으로 결함 형성 에너지를, GIXRD로 격자 변형 완화를, 실제 소자의 발광 안정성 측정으로 이온 억제 효과를 각각 따로 검증했다.\n\n<!-- page -->\n\n<h3 class=\"feat-h\">무엇을 이뤘나</h3>\n\n결과는 수치로 뚜렷했다. 최적화된 소자는 외부양자효율(EQE) 9.82%를 기록했는데, 이는 3차원 구조 기반 순수 블루 페로브스카이트 LED로는 지금까지 보고된 것 중 가장 높은 값이다. 최대 휘도는 1544 cd/m²에 달했고, 발광 파장은 순수 블루에 해당하는 467nm를 유지했다. 이런 향상의 뿌리는 더 근본적인 수치에서도 드러난다. 흡수한 빛이 다시 빛으로 되돌아오는 비율(PLQY)은 26.6%에서 43.9%로, 빛이 잦아드는 데 걸리는 시간(PL 수명)은 3.52ns에서 12.52ns로 늘었다. 결함에 붙잡혀 열로 새던 에너지가 그만큼 줄었다는 뜻이다. 이 개선이 특히 의미 있는 건 소자 구조 때문이다. 절연성 리간드 때문에 전하 수송이 막히기 쉬운 2D 구조나 퀀텀닷 방식과 달리, 3D 페로브스카이트는 원래도 전하가 잘 흐른다. 걸림돌은 결함뿐이었다. 이번 연구는 그 구조적 장점은 그대로 두고 결함만 콕 집어 해결해, 고효율과 고휘도를 동시에 잡았다. 무엇보다 이 성능이 복잡한 신물질 합성이 아니라, 기존 용액 공정에 고분자 한 종류를 더하는 손쉬운 방식으로 달성됐다는 점이 중요하다.\n\n<div class=\"sum-cards\"><div class=\"sum-card\" style=\"background:#fef3f0;border:1px solid #fdd9ce\"><div class=\"sum-num\" style=\"color:#111\">9.82%</div><div class=\"sum-lbl\" style=\"color:#aaa\">외부양자효율(EQE) · 3D 순수블루 PeLED 역대 최고</div></div><div class=\"sum-card\" style=\"background:#e8f0fb;border:1px solid #b3ccf0\"><div class=\"sum-num\" style=\"color:#111\">1544 cd/m²</div><div class=\"sum-lbl\" style=\"color:#aaa\">최대 휘도</div></div><div class=\"sum-card\" style=\"background:#e6f4ea;border:1px solid #a8d8b8\"><div class=\"sum-num\" style=\"color:#111\">467 nm</div><div class=\"sum-lbl\" style=\"color:#aaa\">발광 파장 (순수 블루)</div></div></div>\n\n<h3 class=\"feat-h\">왜 중요한가</h3>\n\n완전색 디스플레이를 상용화하려면 빨강·초록·파랑 세 색 모두 안정적인 발광원이 필요하다. 이번 연구는 그중 가장 늦었던 파랑의 효율과 안정성을 동시에 끌어올려, 페로브스카이트 기반 풀컬러 디스플레이 상용화에 필요한 마지막 퍼즐 조각을 채웠다. 결함, 거친 표면, 계면 긴장, 이온 이동이라는 서로 다른 네 가지 약점을 재료 하나로 한꺼번에 잡았다는 점에서, 이번 성과는 실험실 한 편의 결과를 넘어 앞으로 나올 초고화질·저비용 디스플레이 시장의 방향을 가늠하는 이정표이기도 하다. 접근 방식 자체도 특정 신물질 합성이 아니라 범용 고분자를 활용한 표면 처리라서, 다른 조성의 광대역갭 페로브스카이트에도 적용을 확장할 수 있는 여지가 크다. 우리가 마주할 다음 세대 화면 속 청색이 더 깊고 오래갈 때, 그 뒤에는 이 가느다란 고분자 그물이 있을지 모른다.\n\n<!-- page -->\n\n<h3 class=\"feat-h\">한눈 요약</h3>\n\n<table class=\"recap\"><tr><td class=\"rk\">한 줄 요약</td><td>PVPh 고분자 네트워크 하나로 결함·거친 표면·계면 긴장·이온 이동, 페로브스카이트 블루 LED의 4가지 고질병을 동시에 억제해 순수 블루 EQE 9.82%로 역대 최고 기록을 세웠다</td></tr><tr><td class=\"rk\">핵심 성과</td><td>EQE 9.82% · 최대 휘도 1544 cd/m² · 발광파장 467nm (3D 순수블루 PeLED 최고 기록)</td></tr><tr><td class=\"rk\">강점</td><td>신물질 합성 없이 기존 용액공정에 고분자 처리만 추가, 확장성 높음</td></tr><tr><td class=\"rk\">게재</td><td>Advanced Functional Materials (Wiley-VCH), 2026</td></tr></table>\n\n<h3 class=\"feat-h\" style=\"margin-top:14px\">핵심 용어</h3>\n\n<div class=\"term\"><span class=\"tk\" style=\"width:111px\">페로브스카이트 LED(PeLED)</span><span class=\"tv\">페로브스카이트 결정 소재를 발광층으로 쓰는 발광다이오드. 좁은 발광선폭과 높은 색순도로 차세대 디스플레이 소재로 주목받지만, 파랑은 유독 결함에 취약해 상용화가 늦었다.</span></div>\n\n<div class=\"term\"><span class=\"tk\" style=\"width:111px\">할라이드 공공(Halide Vacancy)</span><span class=\"tv\">결정 격자에서 염소·브로민·아이오딘 같은 할라이드 이온이 빠져나간 빈자리. 빛 대신 열로 에너지를 새게 하는 결함 트랩으로 작용한다.</span></div>\n\n<div class=\"term\"><span class=\"tk\" style=\"width:111px\">계면격자변형(Interfacial Lattice Strain)</span><span class=\"tv\" style=\"text-align:left\">맞닿은 두 물질의 격자 간격이 달라 경계면에 누적되는 뒤틀림. 결함을 유발하고 소자 수명을 갉아먹는다. GIXRD 측정 결과 PVPh 처리 소자는 이 변형이 해소된 것으로 확인됐다.</span></div>\n\n<div class=\"closebox reveal\"><div class=\"cq-c\">이 연구는 성균관대학교 첨단디스플레이공학과 <span class=\"g\">이보람 교수</span> 연구팀이 수행한 결과입니다.</div><div class=\"cq-h\">첨단디스플레이공학과가 함께 연구할 대학원생을 기다립니다.</div><div class=\"cta-row\"><a class=\"cta-btn\" href=\"https://ded.skku.edu/ded/grad_intro.do\" target=\"_blank\" rel=\"noopener\">첨단디스플레이공학과<br>대학원 둘러보기 →</a><a class=\"cta-qr\" href=\"https://ded.skku.edu/ded/grad_intro.do\" target=\"_blank\" rel=\"noopener\" title=\"홈페이지 QR\"><img src=\"assets/qr.png\" alt=\"QR\"></a></div></div>"};

function buildAccHTML(grouped,isConf){
  let html='';
  Object.keys(grouped).sort().forEach(key=>{
    const items=grouped[key];
    const id='ac'+Math.random().toString(36).slice(2,8);
    html+=`<div><div class="acc-hdr" onclick="toggleAcc('${id}')">
      <span>${key}</span>
      <span style="display:flex;align-items:center;gap:8px">
        <span style="font-size:14px;font-weight:700;color:#111">${items.length}건</span>
        <span id="arr_${id}" style="font-size:10px;color:#aaa;transition:transform .2s">▼</span>
      </span>
    </div><div class="acc-body" id="${id}">`;
    items.forEach(item=>{
      const meta=isConf?`발표자: ${item.presenter} · ${item.conf} · ${item.date}`:`${item.journal} · ${item.issue} · ${item.date}`;
      const badge=isConf
        ?`<span style="font-size:8px;padding:1px 5px;background:#e6f4ea;color:#1a7a3a;border-radius:3px;border:1px solid #a8d8b8;flex-shrink:0;margin-top:2px">발표</span>`
        :`<span style="font-size:8px;padding:1px 5px;background:#e8f0fb;color:#1a56a0;border-radius:3px;border:1px solid #b3ccf0;flex-shrink:0;margin-top:2px">SCIE</span>`;
      const titleEl=isConf
        ?`<span style="font-size:10px;font-weight:600;color:#333;line-height:1.4;word-break:break-word">${item.title}</span>`
        :`<a href="https://scholar.google.com/scholar?q=${encodeURIComponent(item.title)}" target="_blank" style="font-size:10px;font-weight:600;color:#1a56a0;text-decoration:none;line-height:1.4;word-break:break-word">${item.title}</a>`;
      html+=`<div class="acc-row"><div style="display:flex;gap:4px;align-items:flex-start;margin-bottom:2px">${badge}${titleEl}</div><div style="font-size:9px;color:#888;padding-left:25px;line-height:1.4">${meta}</div></div>`;
    });
    html+=`</div></div>`;
  });
  return html;
}

function mdToParas(md){
  return md.split(/\n\s*\n/).map(p=>{
    const t=p.trim();
    if(!t) return '';
    const html=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
    return /^</.test(t) ? html : `<p>${html}</p>`;
  }).join('');
}

function autoPaginateCoverStory(){
  const rawBody=(COVER_STORY.body||'').replace(/<!--\s*page\s*-->/g,'\n\n').trim();
  if(!rawBody) return;
  const spreadW=Math.min(document.documentElement.clientWidth-20,1100);
  const pageW=Math.floor(spreadW/2);
  const probe=document.createElement('div');
  probe.className='bp';
  probe.style.cssText=`position:fixed;left:-9999px;top:0;width:${pageW}px;height:770px;overflow:hidden;visibility:hidden;pointer-events:none`;
  document.body.appendChild(probe);
  const paras=rawBody.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
  const result=[];
  let cur=[];
  let isFirst=true;
  function fill(arr){
    const txt=`<div class="body-txt cs-body">${mdToParas(arr.join('\n\n'))}</div>`;
    if(isFirst){
      const ser=COVER_STORY.series?`<span style="font-size:12px;font-weight:700;color:#B08A2E;white-space:nowrap;flex-shrink:0">${COVER_STORY.series}</span>`:'';
      const img=COVER_STORY.image?`<div class="figbox" style="width:55%;aspect-ratio:16/9;flex-shrink:0;border-radius:7px"></div>`:'';
      const fz=COVER_STORY.image?'1.5rem':'1.25rem';
      probe.innerHTML=`<div class="db"></div><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px"><span class="label" style="margin-bottom:0">${COVER_STORY.label||'광각 노트'}</span>${ser}</div><div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:10px"><h2 style="font-size:${fz};line-height:1.3;flex:1;min-width:0">${COVER_STORY.title}</h2>${img}</div><div class="dt"></div>${txt}`;
    } else {
      probe.innerHTML=`<div class="db"></div><span class="label">${COVER_STORY.label||'광각 노트'}</span>${txt}`;
    }
  }
  for(const para of paras){
    const test=[...cur,para];
    fill(test);
    if(probe.scrollHeight>probe.clientHeight+1 && cur.length>0){
      result.push(cur.join('\n\n'));
      cur=[para];
      isFirst=false;
    } else {
      cur=test;
    }
  }
  if(cur.length>0) result.push(cur.join('\n\n'));
  document.body.removeChild(probe);
  COVER_STORY.pages=result.map((body,i)=>({id:'cs'+(i+1),body}));
}

function autoPaginateIntros(){
  const profIntros=INTROS.slice(2);
  if(!profIntros.length) return;
  const spreadW=Math.min(document.documentElement.clientWidth-20,1100);
  const pageW=Math.floor(spreadW/2);
  const result=[];
  for(const intro of profIntros){
    const rawBody=(intro.body_md||'').trim();
    if(!rawBody){result.push(intro);continue;}
    const paras=rawBody.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
    const probe=document.createElement('div');
    probe.className='bp';
    probe.style.cssText=`position:fixed;left:-9999px;top:0;width:${pageW}px;height:770px;overflow:hidden;visibility:hidden;pointer-events:none`;
    document.body.appendChild(probe);
    const portraitPH=intro.portrait?`<div style="width:107px;height:133px;flex-shrink:0;background:#eee;border-radius:6px"></div>`:'';
    const featurePH=intro.feature_image?`<div style="height:240px;flex:none;margin-bottom:14px;background:#eee;border-radius:6px"></div>`:'';
    const inlinePH=intro.inline_image?`<div style="float:right;width:120px;height:150px;margin:0 0 8px 14px;background:#eee;border-radius:6px"></div>`:'';
    const titleHtml=intro.title?`<h2 style="font-size:1.45rem;margin-bottom:6px;color:#111;font-weight:800;letter-spacing:-0.5px;word-break:keep-all;line-height:1.3">${intro.title}</h2>`:'';
    const subtitleHtml=intro.subtitle?`<div class="dt" style="margin:8px 0"></div><p style="font-size:13.5px;font-style:italic;color:#555;line-height:1.7;word-break:keep-all">${intro.subtitle}</p>`:'';
    const headerPH=(intro.portrait||intro.title||intro.subtitle)?`<div style="display:flex;gap:18px;align-items:flex-start;margin-bottom:16px">${portraitPH}<div class="note" style="flex:1">${titleHtml}${subtitleHtml}</div></div>`:'';
    const signerHtml=intro.signer?`<div class="dt"></div><div style="text-align:right;font-size:13.5px;color:#777;font-weight:600">${intro.signer}</div>`:'';
    let cur=[],isFirst=true;
    const pageTexts=[];
    // 실렌더링 기반 오버플로 체크
    const checkFits=(arr)=>{
      const bodyTxt=`<div class="body-txt" style="overflow:hidden">${inlinePH}${mdToParas(arr.join('\n\n'))}</div>`;
      probe.innerHTML=isFirst
        ?`<div class="db"></div><span class="label">${intro.label}</span>${headerPH}${featurePH}<div class="dt"></div>${bodyTxt}${signerHtml}`
        :`<div class="db"></div><span class="label">${intro.label}</span><div class="dt"></div>${bodyTxt}`;
      return probe.scrollHeight<=probe.clientHeight+1;
    };
    // 문장 단위 분할 (2단계): 문단이 길어 빈 공간이 생길 때 문장으로 쪼개 현재 페이지를 채움
    const toSents=(t)=>t.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean);
    for(const para of paras){
      if(checkFits([...cur,para])){
        cur=[...cur,para];
      } else {
        // 문단 전체가 오버플로 → 문장 단위로 현재 페이지 최대한 채우기
        const sents=toSents(para);
        let fittingSents=[],remainSents=[...sents];
        if(sents.length>1){
          for(let i=0;i<sents.length;i++){
            if(!checkFits([...cur,sents.slice(0,i+1).join(' ')])) break;
            fittingSents=sents.slice(0,i+1);
            remainSents=sents.slice(i+1);
          }
        }
        if(fittingSents.length>0&&remainSents.length>0){
          // 일부 문장이 들어감 → 현재 페이지 마감, 나머지는 다음 페이지 첫 문단
          pageTexts.push({body:[...cur,fittingSents.join(' ')].join('\n\n'),isFirst});
          cur=[remainSents.join(' ')];isFirst=false;
        } else {
          // 분리 불가(단일 문장이거나 아무것도 안 들어감) → 현재 페이지 마감, 문단 전체 다음 페이지
          if(cur.length>0){pageTexts.push({body:cur.join('\n\n'),isFirst});isFirst=false;}
          cur=[para];
        }
      }
    }
    if(cur.length>0) pageTexts.push({body:cur.join('\n\n'),isFirst});
    document.body.removeChild(probe);
    pageTexts.forEach(({body,isFirst:isF},i)=>{
      if(isF){
        result.push({...intro,body_md:body});
      } else {
        result.push({id:`${intro.id||'prof'}-p${i+1}`,label:intro.label||'',title:'',portrait:'',feature_image:'',inline_image:'',subtitle:'',signer:'',body_md:body});
      }
    });
  }
  INTROS.splice(2,INTROS.length-2,...result);
}

function openGrad(idx){
  const g = GRADUATES[idx];
  if (!g) return;
  document.getElementById('gradOverlayBody').innerHTML = bGradPage(g, 0);
  const ov = document.getElementById('gradOverlay');
  // 실제 책 페이지(page-left/right)와 동일한 폭·높이로 맞춤 — 스크롤 없이 한 화면에 보이도록
  const pageEl = document.querySelector('.page-left, .page-right');
  const box = ov.querySelector('.grad-overlay-page');
  if (pageEl && box) {
    const r = pageEl.getBoundingClientRect();
    box.style.width = r.width + 'px';
    box.style.height = r.height + 'px';
  }
  ov.classList.add('open');
  tintColumns(ov);
}
function closeGrad(){
  document.getElementById('gradOverlay').classList.remove('open');
}

  if (!AI_TECH || !AI_TECH.page_groups) return '';

  const tableRows = (S.admission?.rows||[]).map(r=>
    `<tr>
      <td style="${td}">${r.year}</td><td style="${td}">${r.semester}</td>
      <td style="${td}">${r.applied}</td><td style="${td}">${r.admitted}</td><td style="${td}">${r.enrolled}</td>
      <td style="${td};background:#fff8f0;font-weight:600">${r.benefited??''}</td>

  const tot = S.admission?.total||{};
  const notes = (S.admission?.notes||[]).map(n=>`<div style="font-size:9.5px;color:#aaa;line-height:1.5;margin-top:2px">${n}</div>`).join('');
  
  const outputRows = (S.output?.rows||[]).map(r=>
    `<tr>
      <td style="${td}">${r.year}</td>
      <td style="${td}">${r.out_target}</td><td style="${td}">${r.out_actual}</td>
      <td style="${td}">${r.job_target}</td><td style="${td}">${r.job_actual}</td>

  const typeStyle = {'취업':'background:#e6f4ea;color:#1a7a4a;border:1px solid #a8d8b8','진학':'background:#f0f4ff;color:#1A56A0;border:1px solid #c5d7f7','구직':'background:#f5f5f5;color:#888;border:1px solid #ddd'};
  const tags = (S.employment?.items||[]).map(e=>{
    const ts = typeStyle[e.type]||typeStyle['구직'];
    return `<div style="${ts};display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;white-space:nowrap">
      <span style="font-weight:700">${e.name}</span><span style="opacity:0.55;font-size:9.5px">${e.degree}</span><span style="opacity:0.35">·</span><span>${e.result}</span>
    </div>`;}).join('');

  return `<div class="bp" style="position:relative;overflow:hidden">
    <div class="db"></div><span class="label">학과 현황</span>
    <h2 style="font-size:1.45rem;margin:4px 0 6px;color:#111;font-weight:800;letter-spacing:-0.5px;word-break:keep-all">학기별 모집 · 취업 현황</h2>

        <div style="font-size:10.5px;font-weight:700;color:#555;letter-spacing:0.5px;margin-bottom:6px">가. 학기별 신입생 모집 현황</div>
        <table style="width:100%;border-collapse:collapse;font-size:11px">
          <thead><tr style="background:#f7f4ef">${['연도','학기','지원','합격','등록','수혜'].map(h=>`<th style="${td};font-weight:700;color:#555;background:#f7f4ef">${h}</th>`).join('')}</tr></thead>
          <tbody>
            ${tableRows}

              <td colspan="2" style="${td};font-weight:700;color:#d93025">누적</td>

              <td style="${td};font-weight:700">${tot.admitted||''}</td>

          </tbody>
        </table>
        ${S.admission?.total_note?`<div style="font-size:9.5px;color:#aaa;line-height:1.5;margin-top:2px">※ 누적 수혜 ${tot.benefited}명 = ${S.admission.total_note}</div>`:''}
        ${notes}
      </div>
      
      <!-- 나. 배출 현황 (우측 열) -->
      <div style="flex:0.9;min-width:0">
        <div style="font-size:10.5px;font-weight:700;color:#555;letter-spacing:0.5px;margin-bottom:6px">나. 배출 현황</div>
        <table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:4px">
          <thead>
            <tr style="background:#f7f4ef">
              <th style="${td};font-weight:700;color:#555;background:#f7f4ef" rowspan="2">구분</th>
              <th style="${td};font-weight:700;color:#555;background:#f7f4ef" colspan="2">배출인원</th>
              <th style="${td};font-weight:700;color:#555;background:#f7f4ef" colspan="2">취업인원</th>
            </tr>
            <tr style="background:#f7f4ef">
              <th style="${td};font-size:9.5px;color:#666;background:#f7f4ef">목표</th>
              <th style="${td};font-size:9.5px;color:#666;background:#f7f4ef">실적</th>
              <th style="${td};font-size:9.5px;color:#666;background:#f7f4ef">목표</th>
              <th style="${td};font-size:9.5px;color:#666;background:#f7f4ef">실적</th>
            </tr>
          </thead>
          <tbody>
            ${outputRows}
          </tbody>
        </table>
        <div style="font-size:9px;color:#aaa;line-height:1.45">* 2025년 배출 실적은 2024년 전과한 학생 중 졸업인원 발생 수치임</div>
      </div>
    </div>

    <div style="font-size:10.5px;font-weight:700;color:#555;letter-spacing:0.5px;margin-bottom:7px">다. 취업현황 (2026년 1분기)</div>
    <div style="display:flex;flex-wrap:wrap;gap:5px">${tags}</div>
    <div class="bpg ${pgCls}">${String(pageNum).padStart(2,'0')}</div>
  </div>`;
}

// 학과 제공 예정 — 빈자리(placeholder) 페이지
// 학과행사 — 몇 페이지로 나눌지는 EVENTS.page_groups(칼럼 작업 단계에서 이미 결정)를 그대로 따른다.
// 넘치면 글자 줄여서 욱여넣지 말고, 칼럼 쪽에서 페이지를 늘려서 해결한다.
function bEventsPage(pageNum, groupIdx){
  if(!EVENTS || !EVENTS.page_groups) return bPlaceholder('학과 주요 행사','학과 주요 행사',pageNum);
  const group = EVENTS.page_groups[groupIdx];
  if (!group) return '';
  const pgCls = pageNum % 2 === 0 ? 'bpg-l' : 'bpg-r';
  const sectionsHtml = group.map(idx => (EVENTS.sections||[])[idx]).filter(Boolean).map(sec=>{
    // 두 섹션 모두 동일한 상하 여백(9px)으로 통일 — 행이 많은 3분기는 line-height·마진을 살짝 줄여 공간 확보
    const padV = 9;
    const td  = `padding:${padV}px 6px;border:1px solid #e0d8cc;line-height:1.3;vertical-align:top;font-size:12px;text-align:left`;
    const th  = `padding:${padV}px 6px;border:1px solid #e0d8cc;font-weight:700;color:#555;background:#f7f4ef;text-align:center;font-size:12px`;
    const rows = sec.rows.map(r=>`<tr>
      <td style="${td};text-align:center;white-space:nowrap">${r.date}</td>
      <td style="${td};font-weight:600;word-break:keep-all">${r.event}</td>
      <td style="${td}">${r.place}</td>
      <td style="${td}">${r.desc}</td>
    </tr>`).join('');
    const noteHtml = sec.note ? `<div style="font-size:13px;color:#666;margin:6px 2px 0;line-height:1.5">${sec.note}</div>` : '';
    return `<div style="font-size:1.1rem;font-weight:700;color:#555;letter-spacing:0.5px;margin:8px 0 4px">${sec.title}</div>
    <table style="width:100%;border-collapse:collapse;table-layout:fixed">
      <colgroup><col style="width:15%"><col style="width:20%"><col style="width:15%"><col style="width:40%"></colgroup><thead><tr><th style="${th}">일자</th><th style="${th}">행사명</th><th style="${th}">장소</th><th style="${th}">주요 내용</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>${noteHtml}`;
  }).join('');
  const headerHtml = groupIdx === 0 ? `<h2 style="font-size:1.45rem;margin:4px 0 6px;color:#111;font-weight:800;letter-spacing:-0.5px;word-break:keep-all">학과 주요 행사</h2><div class="dt"></div>` : '';
  return `<div class="bp" style="position:relative;overflow:hidden">
    <div class="db"></div><span class="label">학과 주요 행사</span>
    ${headerHtml}
    ${sectionsHtml}
    <div class="bpg ${pgCls}">${String(pageNum).padStart(2,'0')}</div>
  </div>`;
}

    {n:6,title:'산학프로젝트 지원',desc:'최대 <strong>1.5천만원/인</strong> 규모 각 프로젝트 비용 지원',small:'※ 일반 연구과제 규정에 준하여 지원'}

    </div>`).join('');
  return `<div class="bp" style="display:flex;flex-direction:column;position:relative">

// 이 매거진 제작 후기 — 판권면 성격의 고정 페이지 (달마다 바뀌지 않음)
function bColophon(pageNum){
  const pgCls = pageNum % 2 === 0 ? 'bpg-l' : 'bpg-r';

    ['에디터 에이전트', "저 세 칼럼은 내가 취재하듯 문장을 처음부터 써내려가고, 교수님 소개·학과행사처럼 학과에서 원고를 주는 칼럼은 그 문장을 '첨디공 광각노트' 톤에 맞게 다듬는다. 백과사전식으로 정의부터 늘어놓는 문장은 어느 쪽이든 되돌려보낸다."],

    ['개발자 에이전트', "칼럼이 AI 자동화든 학과 자료 기반이든, PC 펼침·모바일·인덱스·인쇄용·간이 프린트용·인쇄소 제출본까지 여섯 가지 출력을 같은 자료로 한 번에 조판한다. 배출인력소개나 논문·학회·특허 실적처럼 양이 많은 자료를 가장 보기 좋은 포맷으로 새로 짜는 것도, 서버를 세우고 버전을 관리하는 것도 다 내 몫이다."]
  ];
  const agentCardsHtml = agentCards.map((a,i)=>`
    <div style="background:#f7f5f1;border:1px solid #e8e4de;border-radius:8px;padding:5px 9px;margin-bottom:4px">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:2px">
        <div style="width:20px;height:20px;border-radius:50%;background:#111;color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;flex-shrink:0">${i+1}</div>
        <span style="font-size:14.5px;font-weight:800;color:#111">${a[0]}</span>
      </div>
      <p style="font-size:12.5px;line-height:1.45;color:#3a3a3a;word-break:keep-all;text-align:justify;margin:0">${a[1]}</p>
    </div>`).join('');
  return `<div class="bp" style="padding-bottom:20px">
    <div class="db"></div><span class="label">만드는 사람들</span>
    <h2 style="font-size:1.45rem;font-weight:800;letter-spacing:-0.5px;color:#111;line-height:1.3;word-break:keep-all;margin-top:10px">'첨디공 ON'은 어떻게 만들어지는가?</h2>
    <div class="dt" style="margin-top:6px"></div>
    <div class="figbox zoomable" style="width:100%;border-radius:8px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.15);margin:5px 0 4px">
      <video autoplay muted loop playsinline poster="${ASSETS}ai_pipeline_diagram.png" alt="자료분석·에디터·디자이너·개발자 에이전트가 순서대로 작업하는 모습" style="width:100%;height:150px;object-fit:cover;display:block"><source src="${ASSETS}ai_pipeline_video.mp4" type="video/mp4"></video>

      </a>
    </div>
    <div class="bpg ${pgCls}">${String(pageNum).padStart(2,'0')}</div>
  </div>`;
}

const bBuilders={cf:bCoverFront,cb:bCoverBack,
  status:bStatus, admission:(p)=>bAdmission(p),
  p03:bP03,p04:bP04,p05:bP05,p06:bP06,p07:bP07,p08:bP08,

} else if (EVENTS) {

}
// ⚠️ autoPaginateIntros() 호출 비활성화 (2026-07-06, 대표 지시) — 방문자 브라우저에서 실시간으로
// 페이지를 재계산하는 방식이라, 웹폰트(Pretendard) 로딩 완료 전에 측정이 실행되면 분할 기준이
// 어긋나 페이지가 깨지는 문제가 반복됐다. 정확한 분할은 대표 승인을 거쳐 issues/<월>/intros.json에
// lab-xxx-1, lab-xxx-2 처럼 고정 조각으로 미리 나눠 넣는 방식으로 확정한다 (창간호 방식과 동일).

{

const flatPages = ['fp1', 'fp2', 'fp3', 'fp4', 'fp5'];
// ═══════════ spreads 구성 ═══════════
const spreads=[];
for(let i=0;i<flatPages.length;i+=2){

  const ln=String(i+2).padStart(2,'0'),rn=String(i+3).padStart(2,'0');
  spreads.push({label:`pp. ${ln}–${rn}`,left:lk,right:rk});
}


/* ══ 칼럼별 시각 구분 — 라벨·상단바 칼럼 고유색 틴팅 ══ */
const COL_ACCENT=[['廣角','#B08A2E'],['광각','#B08A2E'],['이달의 논문','#C0392B'],['Display Tech','#1A56A0'],['연구실','#1A7A4A'],['인사말','#2C3E70'],['축사','#2C3E70'],['1분기','#5B6770'],['학과 현황','#5B6770'],['학과 주요 행사','#5B6770']];
const EDGE_COLS=['廣角','광각','이달의 논문','Display Tech','연구실'];  // 엣지 인덱스 적용 칼럼(인사말·축사·실적·현황/행사 제외)
function accentFor(t){if(!t)return null;for(const[k,c]of COL_ACCENT){if(t.indexOf(k)>=0)return c;}return null;}
function isEdgeCol(t){if(!t)return false;for(const k of EDGE_COLS){if(t.indexOf(k)>=0)return true;}return false;}
function tintColumns(root){
  root.querySelectorAll('.db').forEach(db=>{
    let accent=null,matched='',sib=db.nextElementSibling,hops=0;
    while(sib&&hops<3&&!accent){const t=(sib.textContent||'').trim();if(t.length<60){accent=accentFor(t);if(accent)matched=t;}sib=sib.nextElementSibling;hops++;}
    if(!accent)return;
    db.style.background=accent;
    const page=db.parentElement;if(!page)return;
    page.querySelectorAll('.label').forEach(l=>l.style.color=accent);
    page.querySelectorAll('span,div').forEach(s=>{if(s.style&&/rgb\(217,\s*48,\s*37\)/.test(s.style.color))s.style.color=accent;});
    page.querySelectorAll('.bpg').forEach(b=>{b.style.background=accent;});
    if(isEdgeCol(matched)){
      const box=db.closest('.page-left, .page-right');
      if(box&&!box.querySelector('.edge-idx')){
        const side=box.classList.contains('page-right')?'right':'left';
        const bar=document.createElement('div');bar.className='edge-idx';
        bar.style.cssText='position:absolute;top:0;'+side+':0;width:7px;height:72px;background:'+accent+';z-index:4;border-radius:0 0 3px 3px';
        box.appendChild(bar);
      }
    }
  });
}

let cur=0;
const spreadEl=document.getElementById('spread');
// webp 로드 실패 시 원본으로 자동 폴백 (1회만 등록 — capture 단계라 버블링 안 되는 error 이벤트도 잡힘)
spreadEl.addEventListener('error', e=>{
  const t=e.target;
  if(t.tagName==='IMG' && t.dataset.fallback && t.src.indexOf('.webp')>-1){
    t.src=t.dataset.fallback;
  }
}, true);
const dotsEl=document.getElementById('book-dots');
spreads.forEach((_,i)=>{
  const d=document.createElement('button');
  d.className='book-dot'+(i===0?' active':'');
  d.onclick=()=>jump(i);
  dotsEl.appendChild(d);
});

function safeBuild(key, pageNum){
  try { return bBuilders[key](pageNum); }
  catch(e){ console.error('[페이지 렌더 실패]', key, e); return bPlaceholder(key, '이 페이지를 표시하는 중 오류가 발생했습니다', pageNum); }
}
function renderSpread(i){
  const s=spreads[i];let html='';
  if(s.left===null) html=`<div class="page-placeholder"></div><div class="spine"></div>${safeBuild(s.right,1)}`;
  else if(s.right===null) html=`${safeBuild(s.left,2 * i)}<div class="spine"></div><div class="page-placeholder-r"></div>`;
  else html=`<div class="page-left">${safeBuild(s.left,2 * i)}</div><div class="spine"></div><div class="page-right">${safeBuild(s.right,2 * i + 1)}</div>`;
  // 웹용 webp 우선 로드 — HTML 문자열 단계에서 src를 webp로 바꾸고, 원본 경로는 data-fallback에 보존해
  // 브라우저가 처음부터 webp 하나만 요청하게 함(원본+webp 이중 요청 방지). webp 없으면 error 이벤트로 원본 폴백.
  html = html.replace(/(<img[^>]*\ssrc=")([^"]+?)\.(png|jpe?g)(")/gi,
    (m, pre, path, ext, post) => `${pre}${path}.webp${post} data-fallback="${path}.${ext}"`);
  spreadEl.innerHTML=html;
  tintColumns(spreadEl);
  spreadEl.querySelectorAll('.reveal').forEach(e=>requestAnimationFrame(()=>requestAnimationFrame(()=>e.classList.add('in'))));
  spreadEl.querySelectorAll('.zoomable').forEach(attachInplaceZoom);
  document.getElementById('book-spread-info').textContent=s.label;
  document.getElementById('b-btn-prev').disabled=i===0;
  document.getElementById('b-btn-next').disabled=i===spreads.length-1;
  document.getElementById('s-btn-prev').disabled=i===0;
  document.getElementById('s-btn-next').disabled=i===spreads.length-1;
  document.querySelectorAll('.book-dot').forEach((d,idx)=>d.classList.toggle('active',idx===i));
}
function jump(i){cur=i;renderSpread(i);}
function bookGo(d){jump(Math.min(Math.max(cur+d,0),spreads.length-1));}

function toggleFS(){
  const b=document.getElementById('btn-fs');
  if(!document.fullscreenElement&&!document.webkitFullscreenElement){
    const el=document.documentElement;
    if(el.requestFullscreen)el.requestFullscreen();
    else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
    b.textContent='종료';
  }else{
    if(document.exitFullscreen)document.exitFullscreen();
    else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
    b.textContent='전체화면';
  }
}
document.addEventListener('fullscreenchange',()=>{const b=document.getElementById('btn-fs');if(b)b.textContent=document.fullscreenElement?'종료':'전체화면';});
document.addEventListener('webkitfullscreenchange',()=>{const b=document.getElementById('btn-fs');if(b)b.textContent=document.webkitFullscreenElement?'종료':'전체화면';});

function toggleAcc(id){
  const b=document.getElementById(id),arr=document.getElementById('arr_'+id);
  if(!b)return;

  if(arr)arr.style.transform=open?'rotate(180deg)':'';

  if(hdr)hdr.style.borderRadius=open?'7px 7px 0 0':'7px';
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') bookGo(1);
  else if(e.key==='ArrowLeft') bookGo(-1);
});

/* ══ 제자리 확대(인플레이스 줌) — 팝업 없이 페이지 액자 안에서 확대 ══ */
function attachInplaceZoom(box){
  const img=box.querySelector('img'); if(!img) return;
  let scale=1, tx=0, ty=0, panning=false, sx=0, sy=0;
  const MAX=5;
  function clamp(){ const W=box.clientWidth,H=box.clientHeight;
    tx=Math.min(0,Math.max(-(scale-1)*W,tx)); ty=Math.min(0,Math.max(-(scale-1)*H,ty)); }
  function apply(){ clamp(); img.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
    box.classList.toggle('zoomed',scale>1.01); }
  function zoomAt(px,py,ns){ ns=Math.max(1,Math.min(ns,MAX));
    tx=px-(px-tx)*(ns/scale); ty=py-(py-ty)*(ns/scale); scale=ns; img.style.transition='none'; apply(); }
  function reset(){ img.style.transition='transform .2s ease-out'; scale=1; tx=0; ty=0; apply(); }
  // 데스크탑: 휠 줌 · 드래그 이동 · 더블클릭 토글
  box.addEventListener('wheel',e=>{ e.preventDefault(); const r=box.getBoundingClientRect();
    zoomAt(e.clientX-r.left,e.clientY-r.top,scale*(e.deltaY<0?1.2:0.83)); },{passive:false});
  box.addEventListener('mousedown',e=>{ if(scale<=1)return; panning=true; img.style.transition='none';
    sx=e.clientX-tx; sy=e.clientY-ty; e.preventDefault(); });
  window.addEventListener('mousemove',e=>{ if(!panning)return; tx=e.clientX-sx; ty=e.clientY-sy; apply(); });
  window.addEventListener('mouseup',()=>{ panning=false; });
  box.addEventListener('dblclick',e=>{ const r=box.getBoundingClientRect();
    if(scale>1) reset(); else zoomAt(e.clientX-r.left,e.clientY-r.top,2.4); });
  // 터치(터치스크린 노트북 등): 핀치 줌 · 1손가락 이동(확대 상태) · 더블탭
  let pinchD=0,pStart=1,pcx=0,pcy=0,lastT=null,lastTap=0;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  box.addEventListener('touchstart',e=>{
    if(e.touches.length===2){ const r=box.getBoundingClientRect(); pinchD=dist(e.touches); pStart=scale;
      pcx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left; pcy=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top; }
    else if(e.touches.length===1){ const now=Date.now();
      if(now-lastTap<300){ const r=box.getBoundingClientRect();
        if(scale>1) reset(); else zoomAt(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top,2.4); } lastTap=now;
      if(scale>1) lastT={x:e.touches[0].clientX-tx,y:e.touches[0].clientY-ty}; }
  },{passive:false});
  box.addEventListener('touchmove',e=>{
    if(e.touches.length===2){ e.preventDefault(); zoomAt(pcx,pcy,pStart*(dist(e.touches)/pinchD)); }
    else if(e.touches.length===1&&scale>1&&lastT){ e.preventDefault();
      tx=e.touches[0].clientX-lastT.x; ty=e.touches[0].clientY-lastT.y; apply(); }
  },{passive:false});
}

renderSpread(0);
</script>

  function embedImgs(){
    document.querySelectorAll('#spread img').forEach(function(im){
      var src = im.getAttribute('src') || '';
      for (var k in IMG) { if (src.indexOf(k) >= 0) { im.src = IMG[k]; } }
    });
  }
  embedImgs();
  var mo = new MutationObserver(embedImgs);
  var spread = document.getElementById('spread');
  if (spread) mo.observe(spread, {childList: true, subtree: true});

  // 별도 배너 줄을 추가하지 않고, 기존 네비바(이전 / 점·페이지표시 / 전체화면 / 다음) 안에
  // "검토용" 배지를 끼워 넣는다 — 레이아웃 높이가 늘지 않아 화면 잘림 걱정이 없다.
  var nav = document.querySelector('.book-nav');
  if (nav) {
    var badge = document.createElement('div');
    badge.style.cssText = 'display:flex;align-items:center;gap:6px;white-space:nowrap;'+
      'font-family:Pretendard,\'Apple SD Gothic Neo\',sans-serif';
    badge.innerHTML = '<span style="background:#C0392B;color:#fff;font-size:10px;font-weight:800;'+
      'letter-spacing:.5px;padding:3px 8px;border-radius:4px">검토용</span>'+
      '<b style="font-size:12px;color:#3a3228;white-space:nowrap">이보람 교수 컨펌</b>';
    var prevBtn = document.getElementById('b-btn-prev');
    if (prevBtn && prevBtn.nextSibling) nav.insertBefore(badge, prevBtn.nextSibling);
    else nav.appendChild(badge);
  }
})();
</script>
