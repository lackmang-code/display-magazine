<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성균관대학교 첨단디스플레이공학과 월간 Letter 2호</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;900&family=Cinzel:wght@700;900&family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;color:#1a1a1a;-webkit-font-smoothing:antialiased;overflow:hidden;height:100dvh;display:flex;flex-direction:column;background:#c8bfb0}
h1,h2,h3{font-weight:700;color:#000}
.serif{font-family:'Noto Serif KR',serif}

.db{height:4px;background:#111;margin-bottom:10px}
.dt{height:1px;background:#e0e0e0;margin:12px 0}
.label{font-size:11px;font-weight:700;color:#d93025;letter-spacing:2px;text-transform:uppercase;display:block;margin-bottom:10px}
.body-txt{font-size:13px;line-height:1.8;color:#333;word-break:keep-all;text-align:justify}
.body-txt p{margin-bottom:12px}
.body-txt p:last-child{margin-bottom:0}
.cs-body{line-height:1.62}
.cs-body p{margin-bottom:9px}
.note{padding-left:12px;border-left:3px solid #111}
.note h3{font-size:1rem;margin-bottom:6px;color:#333}
.img-portrait{aspect-ratio:3/4;object-fit:cover;border-radius:4px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.acc-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;background:#f7f5f1;border-radius:7px;cursor:pointer;user-select:none;border:1px solid #e8e4de;margin-bottom:12px}
.acc-wide .acc-hdr{padding:12px 14px;margin-bottom:18px}
.acc-hdr:hover{background:#f0ece4}
.acc-hdr span:first-child{font-size:14px;font-weight:700;color:#111}
.acc-body{display:none;border:1px solid #e8e4de;border-top:none;border-radius:0 0 7px 7px;overflow:hidden;margin-bottom:12px}
.acc-body.open{display:block}
.acc-row{padding:7px 11px;border-bottom:1px solid #f5f3ef;background:#fff}
.acc-row:last-child{border-bottom:none}
.sum-cards{display:flex;gap:6px;margin-bottom:12px}
.sum-card{flex:1;border-radius:7px;padding:9px;text-align:center}
.sum-num{font-size:18px;font-weight:700}
.sum-lbl{font-size:10px;margin-top:2px}
.pat-card{background:#f7f5f1;border:1px solid #e8e4de;border-radius:8px;padding:16px 18px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pat-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;margin-right:4px;margin-bottom:5px}
.bpg{position:absolute;bottom:12px;width:26px;height:26px;border-radius:50%;background:#111;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.bpg-l{left:14px}
.bpg-r{right:14px}

.book-nav{display:flex;width:100%;max-width:1100px;align-self:center;align-items:center;justify-content:space-between;padding:8px 4px;gap:10px;flex-shrink:0}
.book-nav button{background:#3a3228;border:none;border-radius:6px;padding:7px 18px;font-size:13px;color:#f5f0e8;cursor:pointer;font-family:inherit;transition:background .2s}
.book-nav button:hover{background:#5a4e43}
.book-nav button:disabled{opacity:.3;cursor:default}
.book-spread-info{font-size:12px;color:#4a3f35;min-width:120px;text-align:center;font-weight:600}
.book-dot-nav{display:flex;gap:7px;align-items:center}
.book-dot{width:8px;height:8px;border-radius:50%;background:#9a8e80;border:none;padding:0;cursor:pointer;transition:all .2s}
.book-dot.active{background:#3a3228;transform:scale(1.3)}
.book-wrap{width:100%;max-width:1100px;align-self:center;flex:1;display:flex;align-items:center;padding:0 10px 10px}
.book-side-nav{position:fixed;top:0;bottom:0;display:flex;align-items:center;z-index:100;pointer-events:none}
.book-side-nav.left{left:0;right:calc(50% + 550px + 10px);justify-content:flex-end;padding-right:14px}
.book-side-nav.right{left:calc(50% + 550px + 10px);right:0;justify-content:flex-start;padding-left:14px}
.book-side-btn{pointer-events:auto;width:44px;height:44px;border-radius:50%;background:rgba(58,50,40,.75);border:none;color:#f5f0e8;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .15s;backdrop-filter:blur(4px)}
.book-side-btn:hover{background:rgba(58,50,40,.95);transform:scale(1.08)}
.book-side-btn:disabled{opacity:.25;cursor:default;transform:none}
@media(max-width:1220px){.book-side-nav{display:none}}
.spread{display:flex;align-items:stretch;width:100%;height:770px;filter:drop-shadow(0 12px 40px rgba(0,0,0,.45)) drop-shadow(0 4px 12px rgba(0,0,0,.25))}
.page-left{flex:1;background:#fdf9f3;overflow:hidden;position:relative;border-radius:4px 0 0 4px;box-shadow:inset -10px 0 20px rgba(0,0,0,.08),2px 0 6px rgba(0,0,0,.12);display:flex;flex-direction:column}
.page-right{flex:1;background:#fdf9f3;overflow:hidden;position:relative;border-radius:0 4px 4px 0;box-shadow:inset 10px 0 20px rgba(0,0,0,.08),-2px 0 6px rgba(0,0,0,.12);display:flex;flex-direction:column}
.page-placeholder{flex:1;background:#b8af9f;border-radius:4px 0 0 4px;box-shadow:inset -8px 0 16px rgba(0,0,0,.06)}
.page-placeholder-r{flex:1;background:#b8af9f;border-radius:0 4px 4px 0;box-shadow:inset 8px 0 16px rgba(0,0,0,.06)}
.cover-front{flex:1;border-radius:0 4px 4px 0;background:linear-gradient(135deg,#000 0%,#1a1a1a 100%);display:flex;flex-direction:column;padding:0;position:relative;overflow:hidden}
.cover-back{flex:1;border-radius:4px 0 0 4px;background:linear-gradient(135deg,#000 0%,#1a1a1a 100%);display:flex;flex-direction:column;padding:0;position:relative;overflow:hidden}
.cover-inner{flex:1;padding:24px 44px 48px;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
/* 제호 첨디공 ON (토글 라벨형) */
.mh-pub{font-size:11px;letter-spacing:1px;color:#bdb3a0}
.mh-title{display:flex;align-items:center;justify-content:center;gap:9px;font-weight:900;font-size:1.9rem;letter-spacing:1px;color:#fff;margin:7px 0 7px}
.mh-desc{font-size:9px;letter-spacing:4px;color:#ffd700;text-transform:uppercase;font-weight:700}
.tog-on, .tog-on * {box-shadow:none!important;text-shadow:none!important}
.tog-on{display:inline-flex;align-items:center;gap:4px;background:#ffd700;border-radius:12px;padding:2px 3px 2px 8px;vertical-align:middle;margin-bottom:7px}
.tog-on .t{color:#111;font-weight:900;font-size:.55em;letter-spacing:1.2px;font-family:'Pretendard',sans-serif}
.tog-on .knob{width:0.5em;height:0.5em;border-radius:50%;background:#111}
/* V2 액자 이미지 (구버전 — 호환용 유지) */
.cv-frame{flex:1;min-height:0;margin:4px 0;border:1.5px solid rgba(255,215,0,.5);border-radius:3px;overflow:hidden;position:relative}
.cv-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* ══ 풀블리드 표지 (A안: 제호 상단 + 커버라인 하단) ══ */
.cv-full{padding:0; font-family:'Outfit',sans-serif; background:#000; position:relative; overflow:hidden}
.cv-hero{position:absolute;right:0;top:4%;width:78%;height:92%;object-fit:contain;object-position:right center;display:block;z-index:0;background:transparent}
.cv-grad-left{position:absolute;left:0;top:0;bottom:0;width:65%;z-index:1;background:linear-gradient(90deg, rgba(0,0,0,0.96) 0%, rgba(0,0,0,0.85) 45%, rgba(0,0,0,0.4) 75%, transparent 100%);pointer-events:none}
.cv-top-left{position:absolute;left:40px;top:42px;text-align:left;z-index:2}
.cv-top-right{position:absolute;right:40px;top:42px;text-align:right;z-index:2}
.cv-top-right .cv-reg-num{font-size:10px;color:#888;letter-spacing:0.5px;margin-bottom:6px;text-shadow:0 1px 2px rgba(0,0,0,0.5)}
.cv-top-info{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.cv-top-info .badge{background:#ffd700;color:#000;padding:3px 10px;border-radius:2px;font-size:10.5px;font-weight:800}
.cv-top-info .date{color:#cfc7ba;font-size:11.5px;letter-spacing:.5px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.cv-left-content{position:absolute;left:40px;top:90px;bottom:120px;width:48%;z-index:2;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start}
.cv-mh-left{text-align:left;width:100%}
.cv-mh-left .mh-title-left{text-shadow:0 3px 16px rgba(0,0,0,0.95);font-size:3.4rem;font-weight:900;letter-spacing:3px;color:#fff;margin:0 0 6px;display:flex;align-items:flex-end;gap:12px;white-space:nowrap}
.cv-mh-left .mh-title-left span{text-shadow:0 3px 16px rgba(0,0,0,0.95)}
.cv-mh-left .mh-desc-left{font-size:11px;letter-spacing:8px;color:#ffd700;text-transform:uppercase;font-weight:700;opacity:0.95;text-shadow:0 1px 4px rgba(0,0,0,.8);margin-top:2px}
.cv-articles{display:flex;flex-direction:column;gap:11px;width:100%;margin-top:24px;margin-bottom:0}
.cv-article-item{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.cv-art-label{font-size:11px;font-weight:700;color:#ffd700;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;text-shadow:0 1px 2px rgba(0,0,0,0.5)}
.cv-art-title{font-size:16px;font-weight:800;color:#fff;line-height:1.4;word-break:keep-all;text-shadow:0 2px 5px rgba(0,0,0,0.95);font-family:'Pretendard',sans-serif}
.cv-art-divider{height:1px;width:100%;background:linear-gradient(90deg, rgba(255, 215, 0, 0.3), transparent);margin:2px 0}
.cv-bottom-bar{position:absolute;left:40px;right:40px;bottom:42px;display:flex;align-items:flex-end;justify-content:space-between;z-index:2}
.cv-pub-block{text-align:left}
.cv-pub-block .pub-kr{font-family:'Pretendard',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;color:#bdb3a0;text-shadow:0 1px 4px rgba(0,0,0,.9);margin-bottom:3px}
.cv-pub-block .pub-en{font-family:'Outfit',sans-serif;font-size:8px;font-weight:400;letter-spacing:1px;color:rgba(255,215,0,0.75);text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.8);line-height:1.3}
.cv-qr-box{background:#fff;padding:4px;border-radius:4px;box-shadow:0 4px 10px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;transition:transform 0.2s}
.cv-qr-box:hover{transform:scale(1.05)}
.cv-qr-box img{width:42px;height:42px;display:block}
.spine{width:0;flex-shrink:0}
.bp{padding:24px 44px 48px;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}
.bp::-webkit-scrollbar{display:none}
.b-portrait{width:88px}

/* ══ 제목형 사진 페이지 (헤더 고정 + 아래 사진 가득) ══ */
.photo-fill{flex:1;min-height:0;position:relative;overflow:hidden;background:#222;border-radius:6px;display:flex}
.photo-fill img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:0 0}
.photo-fill.fit-contain{background:#f7f5f0}
.photo-fill.fit-contain img{object-fit:contain}
/* ══ 전체 페이지 사진 (표준 5:7) ══ */
.full-photo{flex:1;min-height:0;position:relative;overflow:hidden;background:#222;display:flex}
.full-photo img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:0 0}
.full-photo.fit-contain{background:#fdf9f3}
.full-photo.fit-contain img{object-fit:contain}
.fp-cap{position:absolute;left:0;right:0;bottom:0;padding:16px 18px 14px;background:linear-gradient(transparent,rgba(0,0,0,.62));color:#fff;font-size:12px;letter-spacing:.2px;line-height:1.5;word-break:keep-all;z-index:2}
/* 제자리 확대(인플레이스 줌) — 페이지 액자 안에서 확대, 팝업 없음 */
.zoomable{cursor:zoom-in}
.zoomable.zoomed{cursor:move}
.zoom-hint{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.4);color:#fff;font-size:10px;padding:3px 8px;border-radius:20px;pointer-events:none;z-index:2;opacity:.85;transition:opacity .3s}
.zoomable.zoomed .zoom-hint{opacity:0}

/* ══ 배출인력소개 — 그리드 인덱스 & 클릭 오버레이 ══ */
.grad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.grad-grid-item{border:1px solid #e0d8cc;background:#fff;border-radius:8px;padding:15px 12px;cursor:pointer;text-align:center;transition:box-shadow .2s,transform .2s}
.grad-grid-item:hover{box-shadow:0 4px 14px rgba(0,0,0,.12);transform:translateY(-2px)}
.grad-grid-item img{width:74px;height:92px;object-fit:cover;border-radius:6px;margin:0 auto 9px;display:block;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.grad-grid-name{font-size:14px;font-weight:700;color:#111}
.grad-grid-sub{font-size:10.5px;color:#888;margin-top:3px;word-break:keep-all;line-height:1.4}
.grad-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;align-items:center;justify-content:center;padding:24px}
.grad-overlay.open{display:flex}
.grad-overlay-page{position:relative;width:420px;max-width:100%;height:770px;max-height:90vh;background:#fdf9f3;border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.4);overflow:hidden;display:flex;flex-direction:column}
.grad-home-btn{position:absolute;top:10px;right:10px;z-index:2;background:#111;color:#fff;border:none;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.grad-home-btn:hover{background:#d93025}
.grad-overlay-page .bpg{display:none}
#gradOverlayBody{flex:1;min-height:0;display:flex;flex-direction:column}

/* ── 이달의 논문 피처 전용(추가) ── */
.feat-title{font-size:1.7rem;line-height:1.25;letter-spacing:-.5px;margin:2px 0 8px}
.feat-sub{font-size:.95rem;color:#555;font-weight:500;line-height:1.5;word-break:keep-all;margin-bottom:14px}
.feat-h{font-size:1.15rem;color:#111;margin:4px 0 10px}
.meta-box{border:1px solid #e3ddd2;border-radius:8px;background:#faf7f1;padding:11px 13px;font-size:14px;line-height:1.65;color:#333;word-break:keep-all}
.meta-box>div{padding:3px 0}
.meta-box>div+div{border-top:1px solid #ece7dd}
.meta-box .mk{display:inline-block;min-width:34px;font-weight:700;color:#d93025;margin-right:6px}
.meta-box em{font-style:italic;color:#222}
.steps{display:flex;flex-direction:column;gap:7px;margin:6px 0 12px}
.step{display:flex;gap:9px;align-items:flex-start;background:#fff;border:1px solid #e8e4de;border-radius:8px;padding:9px 11px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.step .sn{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#111;color:#ffd700;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step .stx{font-size:12px;line-height:1.55;color:#333;word-break:keep-all}
.step .stx b{color:#111}
.figbox{position:relative;width:100%;background:#fff;border:1px solid #ece7dd;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.figbox img{width:100%;height:100%;object-fit:contain;display:block;transform-origin:0 0}
.cap{font-size:10.5px;color:#888;line-height:1.5;font-style:italic;margin:6px 2px 0;word-break:keep-all}
.term{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid #ece8e0;font-size:12px;line-height:1.55;word-break:keep-all}
.term:last-child{border-bottom:none}
.term .tk{flex-shrink:0;width:74px;font-weight:700;color:#111}
.term .tv{flex:1;color:#444}
.recap{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px}
.recap td{border:1px solid #e8e2d6;padding:8px 10px;vertical-align:top;word-break:keep-all;line-height:1.5}
.recap td.rk{background:#faf7f1;font-weight:700;color:#d93025;width:88px;white-space:nowrap}
.closebox{background:linear-gradient(135deg,#000,#1a1a1a);border-radius:9px;padding:16px 18px;color:#fff;margin-top:4px}
.closebox .cq-k{font-size:11px;font-style:italic;color:#bdb3a0;line-height:1.5;margin-bottom:9px}
.closebox .cq-c{font-size:11px;color:#cbb86a;line-height:1.55;word-break:keep-all}
.closebox .cq-c .g{color:#fff;font-weight:700}
.closebox .cq-h{font-size:14px;font-weight:800;color:#ffd700;line-height:1.45;margin-top:10px;word-break:keep-all}
.cta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.cta-btn{display:inline-block;background:#ffd700;color:#1a1a1a;font-size:12px;font-weight:800;letter-spacing:.2px;padding:8px 14px;border-radius:6px;text-decoration:none}
.cta-qr{flex-shrink:0;line-height:0}
.cta-qr img{width:48px;height:48px;background:#fff;padding:3px;border-radius:4px;display:block}
.reveal{opacity:1;transform:none}
@media screen{
  .cta-btn{animation:ctaGlow 2.2s ease-in-out infinite}
  @keyframes ctaGlow{0%,100%{box-shadow:0 0 4px rgba(255,215,0,.25)}50%{box-shadow:0 0 16px 2px rgba(255,215,0,.6)}}
  .reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
  .reveal.in{opacity:1;transform:none}
}
</style>
</head>
<body>

<nav class="book-nav">
  <button id="b-btn-prev" onclick="bookGo(-1)" disabled>← 이전</button>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
    <div class="book-dot-nav" id="book-dots"></div>
    <span class="book-spread-info" id="book-spread-info"></span>
  </div>
  <button onclick="toggleFS()" id="btn-fs">전체화면</button>
  <button id="b-btn-next" onclick="bookGo(1)">다음 →</button>
</nav>
<div class="book-side-nav left"><button class="book-side-btn" id="s-btn-prev" onclick="bookGo(-1)" disabled>&#8249;</button></div>
<div class="book-side-nav right"><button class="book-side-btn" id="s-btn-next" onclick="bookGo(1)">&#8250;</button></div>
<div class="book-wrap"><div class="spread" id="spread"></div></div>

<div class="grad-overlay" id="gradOverlay" onclick="if(event.target===this)closeGrad()">
  <div class="grad-overlay-page">
    <button class="grad-home-btn" onclick="closeGrad()">🏠 홈</button>
    <div id="gradOverlayBody"></div>
  </div>
</div>

const INTROS = [{"id": "lab-jeon-1", "label": "연구실 소개", "title": "전종욱 교수 연구실<br>Device Research Laboratory (DRL)", "portrait": "prof_jeon.png", "feature_image": "prof_jeon_team.jpg", "feature_image_height": 260, "subtitle": "Device Research Laboratory (DRL)", "signer": "", "body_md": "2023년 성균관대학교 전자전기공학부에 부임한 전종욱 교수의 Device Research Laboratory(DRL)는 차세대 반도체·디스플레이 소자와 회로·설계 기술을 연결하는 Design-Technology Co-Optimization(DTCO) 연구를 수행하고 있다. 소자(Device), 공정(Process), 설계(Design), 회로(Circuit)를 하나의 플랫폼으로 통합하여 미래 반도체·디스플레이 기술을 예측하고 최적화하며, Path-finding PDK, AI 기반 설계 자동화, 차세대 로직·메모리·디스플레이 소자 개발을 핵심 연구 분야로 삼고 있다.\n\n첫 번째 연구 분야는 'DTCO 및 Path-finding PDK'이다."}, {"id": "lab-jeon-1-p2", "label": "연구실 소개", "title": "", "portrait": "", "feature_image": "", "subtitle": "", "signer": "", "body_md": "반도체와 디스플레이 소자가 지속적으로 미세화되면서 공정과 설계를 독립적으로 최적화하는 기존 접근만으로는 성능 향상에 한계가 있다.\n\n이에 DRL은 TCAD 기반 소자 시뮬레이션부터 Compact Model, Layout, LVS/PEX, Standard Cell 및 PDK 개발까지 연결되는 통합 설계 환경을 구축하고 있다. 특히 다양한 소자 구조와 공정 옵션을 회로 수준에서 평가할 수 있는 Path-finding PDK를 개발하여 차세대 기술의 성능과 설계 가능성을 조기에 검증하고 있다.\n\n두 번째 연구 분야는 Gate-All-Around(GAA)와 Complementary FET(CFET)를 중심으로 한 '차세대 로직 소자 구조'이다. DRL은 Middle-of-Line(MOL), Via 구조, Backside Power Delivery Network(BSPDN) 등 새로운 공정 기술이 소자와 회로 성능에 미치는 영향을 분석하고, 실제 공정 및 설계 환경에서 구현 가능한 구조를 제안하고 있다. 최근에는 CFET용 Line-type Tall Via, Via 구조를 최적화한 CFET SRAM, 전력 공급 구조에 따른 CFET 열 성능 분석 등을 통해 차세대 로직 소자의 성능과 제조 가능성을 함께 향상시키는 연구를 수행하였다(Semiconductor Science and Technology, 2026; IEEE Transactions on Electron Devices, 2026; Journal of Applied Physics, 2025).\n\n세 번째 연구 분야는 '차세대 디스플레이용 TFT 및 구동회로'이다. DRL은 IGZO 기반 DRAM 및 디스플레이 TFT 구조, 유기 디스플레이의 신뢰성 향상, 고집적 디스플레이용 반도체 소자 설계 등을 연구하고 있다. 대표적으로 IGZO 기반 2T0C DRAM의 성능을 향상시키기 위한 GAA 구조를 제안하였으며(Journal of Computational Electronics, 2025), H₂ 플라스마 처리 SiNₓ 공정을 통해 유기 디스플레이의 lateral leakage를 억제하는 기술을 개발하였다(IEEE Electron Device Letters, 2026). 이와 함께 수직 적층 IGZO–Si Hybrid 4T0C DRAM 등 차세대 메모리 구조에 관한 연구도 진행하고 있다.\n\n네 번째 연구 분야는 'AI 기반 설계 자동화'이다. 반도체와 디스플레이 기술의 설계 변수 및 공정 조건이 복잡해짐에 따라 AI를 활용한 설계 자동화의 중요성이 커지고 있다."}, {"id": "lab-jeon-1-p2-p2", "label": "연구실 소개", "title": "", "portrait": "", "feature_image": "", "bottom_image": "prof_jeon_lobby.jpg", "bottom_image2": "prof_jeon_dining.jpg", "bottom_image_height": 150, "subtitle": "", "signer": "", "body_md": "DRL은 소자 물리(Device Physics)와 machine learning을 결합하여 Compact Model 생성, Parameter Extraction 및 Parasitic RC Extraction을 자동화하고 있다.\n\n대표적으로 machine learning 기반 Compact Model Binning Parameter Extraction 방법론(Advanced Intelligent Systems, 2025)과 강유전체 소자 모델링을 위한 Physics-guided AI Framework(Scientific Reports, 2026)를 제안하였다.\n\n전종욱 교수는 삼성전자 반도체연구소에서 Logic, Memory, Sensor 분야의 Early-stage PDK 개발과 DTCO 기반 차세대 반도체 기술 개발을 수행했으며, HCI, BTI, TDDB, Radiation 등 반도체 신뢰성 분석 솔루션 개발에도 참여하였다. 이러한 산업체 경험은 현재 DRL의 PDK, DTCO, 소자·회로 통합 시뮬레이션 및 설계 자동화 연구의 기반이 되고 있다.\n\nDRL의 학생들은 TCAD 시뮬레이션, Compact Model 개발, PDK 구축, Layout 및 회로 설계, AI 기반 최적화에 이르는 반도체·디스플레이 기술 개발의 전 과정을 경험한다. 이를 통해 공정, 소자, 배선, 회로 및 시스템을 연결하고, 미래 반도체와 첨단디스플레이 산업에서 요구되는 실무형 연구 역량을 갖추고 있다."}];

const COVER_STORY = {"title": "OLED 패널에서 IR(940nm)의 영향", "image": "", "label": "첨디공의 廣角노트", "series": "📖 연재테마 ② · 투과(透過) 관점 시리즈", "pages": ["전화가 걸려 오고, 화면에 귀를 대는 순간 화면이 꺼진다. 이 익숙한 동작의 배후에는 OLED 패널 아래 숨은, 손톱보다도 작은 칩 하나가 있다. 지난 호에서 다룬 ALS(주변광 센서)의 옆자리, Behind-OLED 5인방(조도·근접·리시버·카메라·지문) 중 두 번째 주인공, 근접 센서(Proximity Sensor)다.\n\n<h3 style=\"font-size:1.1rem; color:#1A2A4A; margin-top:14px; margin-bottom:10px; border-bottom:2px solid #B08A2E; padding-bottom:3px; font-weight:700; margin-top:2px;\">1. 근접 센서란 무엇인가?</h3>\n\n이 칩의 임무는 단순하다. 지금 이 순간, 화면 앞에 뭔가 가까이 있는가. 그런데 그 답을 알아내는 방식이 ALS와는 정반대다. ALS는 밖에서 들어오는 빛을 가만히 받으면 그만이었다. 근접 센서는 스스로 빛을 쏘고, 그 빛이 되돌아오는지를 직접 확인해야 한다. 그것도 사람 눈에는 보이지 않는 근적외선, 파장 940nm로.\n\n왜 굳이 안 보이는 빛을 따로 쏠까. 가시광은 이미 주변 조명·햇빛으로 가득 차 있어서, 센서가 쏜 빛과 원래 있던 빛을 구별할 수가 없다. 반면 940nm 근적외선은 자연광에 거의 섞이지 않는 '깨끗한' 대역이라, 지금 돌아온 빛이 방금 내가 쏜 그 빛인지를 명확히 구분할 수 있다. ALS가 '이미 있는 빛을 기다리는' 수동적 감지였다면, 근접 센서는 '빛을 직접 만들어 쏘고 되받는' 능동적 감지다.\n\n<div class=\"figbox zoomable\" style=\"max-width:420px; margin:10px auto 2px;\"><img src=\"assets/그림2_TCS3720_다이사진.png\" alt=\"ams TCS3720 실제 다이 사진 — ALS와 Proximity 영역 통합\" style=\"width:100%;height:auto;display:block\"><div class=\"zoom-hint\">🔍 휠·더블클릭 확대</div></div>\n\n<p class=\"cap\" style=\"text-align:center;\">▲ 실제 3-in-1 통합 센서 다이(ams TCS3720, 3.34×1.36×0.6mm OLGA 패키지)</p>\n\n이 능동 감지 방식 덕분에 통화 중 자동 화면 소등은 물론, 커버 케이스가 덮였는지, 주머니 속에 들어갔는지까지 판단할 수 있다. 문제는 이 '쏘고 받는' 방식이 OLED 패널에게는 완전히 새로운 숙제를 던진다는 점이다.", "<h3 style=\"font-size:1.1rem; color:#1A2A4A; margin-top:8px; margin-bottom:10px; border-bottom:2px solid #B08A2E; padding-bottom:3px; font-weight:700;\">2. 근접 센서는 OLED와 어떻게 연동되는가?</h3>\n\nALS와 근접 센서는 OLED에게 전혀 다른 걸 요구한다. ALS는 수신부 하나로 충분했고 OLED가 지킬 파장도 가시광 하나였다. 근접 센서는 패널 배면에 940nm 고강도 광원까지 새로 들어선다. 받는 것에 더해 쏘는 것까지 감당해야 하니 파장도 IR로 옮겨가고, 이 '광원의 등장' 하나가 세 가지 숙제를 만들어낸다.\n\n① 신호가 왕복하며 급격히 약해진다. IR은 패널을 두 번 통과한다 — 나갈 때 한 번, 반사돼 돌아올 때 한 번. 패널의 IR 투과율을 T라 하면 최종 신호는 T²에 비례해 줄어들어, ALS 때보다 자릿수가 다르게 약해진다. 손실의 대부분은 금속 음극층에서 발생하며, 편광판은 오히려 IR을 잘 통과시켜 주범이 아니다.\n\n② 광원이 생기자 TFT가 새로운 방식으로 위협받는다. LTPS·Oxide TFT는 원래 빛에 반응하는 성질이 있어서, OLED 패널은 설계 단계부터 정면에서 들어오는 외부광을 막는 차광구조(BSM, Bottom Shield Metal)를 갖추고 있다. 정면광을 막도록 설계된 기존 구조로는 이 새 노출 경로를 못 막아, T1 하부에 금속 차광층(BML, Bottom Metal Layer)을 별도로 추가해야 한다.\n\n<div class=\"figbox zoomable\" style=\"max-width:307px; margin:10px auto 2px;\"><img src=\"assets/그림3_LTPO_BML단면도.png\" alt=\"LTPO 백플레인 단면도 — LTPS와 Oxide TFT가 공존하는 하이브리드 구조, BML 위치 표시\" style=\"width:100%;height:auto;display:block\"><div class=\"zoom-hint\">🔍 휠·더블클릭 확대</div></div>\n\n<p class=\"cap\" style=\"text-align:center;\">▲ BML은 스택 맨 아래 Barrier층에, LTPS(우) 하부에만 선택적으로 형성된다</p>", "ams의 TCS3720은 ALS Engine과 Proximity Engine을 한 다이에 통합한 3-in-1 센서다. LEDA·LEDK0·LEDK1 핀이 IR LED를 구동하고, 반사파는 Prox ADC를 거쳐 디지털 신호로 바뀐다. 핵심은 VSYNC 핀 — 디스플레이 프레임 신호를 받아 블랭킹 구간에만 맞춰 IR을 쏘고 받는다. 지난 호의 ALS가 블랭킹 구간에 맞춰 '받았다'면, 근접 센서는 같은 구간에 맞춰 '쏘는' 셈이다. 이 통합·동기화 설계로 이전 세대 대비 감도 5배, SNR 3배가 향상됐다.\n\n<div class=\"figbox zoomable\" style=\"max-width:480px; margin:10px auto 2px;\"><img src=\"assets/그림1_TCS3720_블록도.png\" alt=\"ams TCS3720 블록도 — ALS Engine, Proximity Engine, Digital Core 구조\" style=\"width:100%;height:auto;display:block\"><div class=\"zoom-hint\">🔍 휠·더블클릭 확대</div></div>\n\n<p class=\"cap\" style=\"text-align:center;\">▲ TCS3720 블록도 — 근접(적색)·조도(청색)·디지털 코어(회색)가 한 칩에 통합된다</p>\n\n③ 유효 신호와 잡음이 뒤섞인다. 쓸모 있는 신호는 물체에 반사돼 돌아오는 빛뿐인데, 광원 빛의 일부는 물체까지 가지도 않고 패널 내부에서 산란·반사되다 곧바로 수신부로 샌다. 이 직접 결합광은 반사파와 구별이 안 되는 순수한 잡음이다. 그래서 발광부와 수신부 사이에 광학 배리어를 세우거나 충분히 떨어뜨려 배치해 이 경로 자체를 차단한다. TCS3720 후속 제품군도 발광부와 수신부를 패키지 중심에서 떨어뜨려 배치하고, 별도의 크로스토크 상쇄 회로까지 얹는다.\n\n정리하면 OLED는 근접 센서 하나를 품기 위해 네 겹의 숙제를 동시에 풀어야 한다. IR을 잘 통과시키는 투과 설계, T1을 지키는 BML 차광, 그 차광을 뚫는 BPDL·BM 이중광학 소재, 그리고 광원과 수신부를 갈라놓는 격리 설계. ALS가 '얼마나 잘 받을까'의 문제였다면, 근접 센서는 '어떻게 쏘고, 지키고, 뚫고, 가를까'까지 풀어야 하는 문제다.", "<h3 style=\"font-size:1.1rem; color:#1A2A4A; margin-top:12px; margin-bottom:10px; border-bottom:2px solid #B08A2E; padding-bottom:3px; font-weight:700;\">3. 또 다른 근접 센서의 이슈들</h3>\n\n화소를 구획하는 BPDL·BM(차광막)에 IR만 통과시키는 별도의 길을 마련해야 한다. 이 문제는 어떻게 해결하면 좋을까?\n\n<h4 style=\"font-size:1rem; color:#B08A2E; margin:8px 0 6px; font-weight:700;\">➀ IR에서는 투명하면서 가시광은 차단하는 BPDL과 BM 재료</h4>\n\nBPDL(Black Photo-definable Layer)과 BM(Black Matrix)은 원래 화소 사이로 새는 빛을 막아 명암비를 높이는 차광막이다. 가시광에는 완전히 불투명해야 제 역할을 하는 소재인데, 근접 센서 시대엔 여기에 모순된 요구가 하나 더 얹힌다 — 같은 소재가 940nm 근적외선만은 통과시켜야 한다는 것이다. 사람 눈에는 새까맣게 보이면서 IR 파장 창에서는 투명한, 이중적인 광학 특성이 필요한 셈이다. 안료·염료의 조성을 IR 대역에서만 흡수율이 낮아지도록 정밀하게 설계해야 하고, 여기에 두께와 패터닝 조건까지 맞아야 비로소 원하는 특성이 나온다. 명암비를 희생하지 않으면서 근접 센서가 쓸 만큼의 IR 투과 통로를 확보하는 일 — 지금 업계가 풀어야 할 새로운 소재 과제다.\n\n<h4 style=\"font-size:1rem; color:#B08A2E; margin:14px 0 6px; font-weight:700;\">➁ 근접 센서 기능도 패널에 내장할 수는 없을까?</h4>\n\n별도 칩을 화면 밑에 숨기느라 고생하느니, 패널이 스스로 반사파를 감지하면 어떨까? OPD(유기 포토다이오드)는 근적외선에도 반응할 수 있다. 여기에 발광까지 겸하는 자발광-수광 통합 소자가 더해진다면, 화소 자체가 발광부와 수신부를 겸하는 구조도 가능하다. 아직 걸음마 단계지만, 디스플레이 회사가 타사와 차별화할 수 있는 훌륭한 연구 테마다.\n\n<div class=\"closebox reveal\"><div style=\"font-size:13px;color:#ddd5c4;line-height:1.7;word-break:keep-all\">성균관대 첨단디스플레이공학과는 다양한 각도에서 이러한 이슈들을 함께 고민하고 독창적인 솔루션을 함께 개발할 좋은 파트너입니다.<br><span style=\"color:#ffd700;font-weight:800\">첨디공의 문은 언제나 열려 있습니다.</span></div><div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px\"><a href=\"mailto:nackmann@skku.edu\" style=\"display:inline-block;background:#ffd700;color:#1a1a1a;font-size:12px;font-weight:800;padding:9px 16px;border-radius:6px;text-decoration:none;white-space:nowrap;animation:ctaGlow 2.2s ease-in-out infinite\">산학협력 · 공동연구 문의 (✉ nackmann@skku.edu)</a><a href=\"mailto:nackmann@skku.edu\" style=\"flex-shrink:0;text-align:center;text-decoration:none\"><img src=\"assets/contact_qr.png\" alt=\"문의 QR\" style=\"width:52px;height:52px;background:#fff;padding:4px;border-radius:5px;display:block\"><div style=\"font-size:8px;color:#cfc7ba;margin-top:3px;white-space:nowrap\">스캔하면 메일 문의</div></a></div></div>"], "body": "전화가 걸려 오고, 화면에 귀를 대는 순간 화면이 꺼진다. 이 익숙한 동작의 배후에는 OLED 패널 아래 숨은, 손톱보다도 작은 칩 하나가 있다. 지난 호에서 다룬 ALS(주변광 센서)의 옆자리, Behind-OLED 5인방(조도·근접·리시버·카메라·지문) 중 두 번째 주인공, 근접 센서(Proximity Sensor)다.\n\n<h3 style=\"font-size:1.1rem; color:#1A2A4A; margin-top:14px; margin-bottom:10px; border-bottom:2px solid #B08A2E; padding-bottom:3px; font-weight:700; margin-top:2px;\">1. 근접 센서란 무엇인가?</h3>\n\n이 칩의 임무는 단순하다. 지금 이 순간, 화면 앞에 뭔가 가까이 있는가. 그런데 그 답을 알아내는 방식이 ALS와는 정반대다. ALS는 밖에서 들어오는 빛을 가만히 받으면 그만이었다. 근접 센서는 스스로 빛을 쏘고, 그 빛이 되돌아오는지를 직접 확인해야 한다. 그것도 사람 눈에는 보이지 않는 근적외선, 파장 940nm로.\n\n왜 굳이 안 보이는 빛을 따로 쏠까. 가시광은 이미 주변 조명·햇빛으로 가득 차 있어서, 센서가 쏜 빛과 원래 있던 빛을 구별할 수가 없다. 반면 940nm 근적외선은 자연광에 거의 섞이지 않는 '깨끗한' 대역이라, 지금 돌아온 빛이 방금 내가 쏜 그 빛인지를 명확히 구분할 수 있다. ALS가 '이미 있는 빛을 기다리는' 수동적 감지였다면, 근접 센서는 '빛을 직접 만들어 쏘고 되받는' 능동적 감지다.\n\n<div class=\"figbox zoomable\" style=\"max-width:420px; margin:10px auto 2px;\"><img src=\"assets/그림2_TCS3720_다이사진.png\" alt=\"ams TCS3720 실제 다이 사진 — ALS와 Proximity 영역 통합\" style=\"width:100%;height:auto;display:block\"><div class=\"zoom-hint\">🔍 휠·더블클릭 확대</div></div>\n\n<p class=\"cap\" style=\"text-align:center;\">▲ 실제 3-in-1 통합 센서 다이(ams TCS3720, 3.34×1.36×0.6mm OLGA 패키지)</p>\n\n이 능동 감지 방식 덕분에 통화 중 자동 화면 소등은 물론, 커버 케이스가 덮였는지, 주머니 속에 들어갔는지까지 판단할 수 있다. 문제는 이 '쏘고 받는' 방식이 OLED 패널에게는 완전히 새로운 숙제를 던진다는 점이다.\n\n<!-- page -->\n\n<h3 style=\"font-size:1.1rem; color:#1A2A4A; margin-top:8px; margin-bottom:10px; border-bottom:2px solid #B08A2E; padding-bottom:3px; font-weight:700;\">2. 근접 센서는 OLED와 어떻게 연동되는가?</h3>\n\nALS와 근접 센서는 OLED에게 전혀 다른 걸 요구한다. ALS는 수신부 하나로 충분했고 OLED가 지킬 파장도 가시광 하나였다. 근접 센서는 패널 배면에 940nm 고강도 광원까지 새로 들어선다. 받는 것에 더해 쏘는 것까지 감당해야 하니 파장도 IR로 옮겨가고, 이 '광원의 등장' 하나가 세 가지 숙제를 만들어낸다.\n\n① 신호가 왕복하며 급격히 약해진다. IR은 패널을 두 번 통과한다 — 나갈 때 한 번, 반사돼 돌아올 때 한 번. 패널의 IR 투과율을 T라 하면 최종 신호는 T²에 비례해 줄어들어, ALS 때보다 자릿수가 다르게 약해진다. 손실의 대부분은 금속 음극층에서 발생하며, 편광판은 오히려 IR을 잘 통과시켜 주범이 아니다.\n\n② 광원이 생기자 TFT가 새로운 방식으로 위협받는다. LTPS·Oxide TFT는 원래 빛에 반응하는 성질이 있어서, OLED 패널은 설계 단계부터 정면에서 들어오는 외부광을 막는 차광구조(BSM, Bottom Shield Metal)를 갖추고 있다. 정면광을 막도록 설계된 기존 구조로는 이 새 노출 경로를 못 막아, T1 하부에 금속 차광층(BML, Bottom Metal Layer)을 별도로 추가해야 한다.\n\n<div class=\"figbox zoomable\" style=\"max-width:307px; margin:10px auto 2px;\"><img src=\"assets/그림3_LTPO_BML단면도.png\" alt=\"LTPO 백플레인 단면도 — LTPS와 Oxide TFT가 공존하는 하이브리드 구조, BML 위치 표시\" style=\"width:100%;height:auto;display:block\"><div class=\"zoom-hint\">🔍 휠·더블클릭 확대</div></div>\n\n<p class=\"cap\" style=\"text-align:center;\">▲ BML은 스택 맨 아래 Barrier층에, LTPS(우) 하부에만 선택적으로 형성된다</p>\n\n<!-- page -->\n\nams의 TCS3720은 ALS Engine과 Proximity Engine을 한 다이에 통합한 3-in-1 센서다. LEDA·LEDK0·LEDK1 핀이 IR LED를 구동하고, 반사파는 Prox ADC를 거쳐 디지털 신호로 바뀐다. 핵심은 VSYNC 핀 — 디스플레이 프레임 신호를 받아 블랭킹 구간에만 맞춰 IR을 쏘고 받는다. 지난 호의 ALS가 블랭킹 구간에 맞춰 '받았다'면, 근접 센서는 같은 구간에 맞춰 '쏘는' 셈이다. 이 통합·동기화 설계로 이전 세대 대비 감도 5배, SNR 3배가 향상됐다.\n\n<div class=\"figbox zoomable\" style=\"max-width:480px; margin:10px auto 2px;\"><img src=\"assets/그림1_TCS3720_블록도.png\" alt=\"ams TCS3720 블록도 — ALS Engine, Proximity Engine, Digital Core 구조\" style=\"width:100%;height:auto;display:block\"><div class=\"zoom-hint\">🔍 휠·더블클릭 확대</div></div>\n\n<p class=\"cap\" style=\"text-align:center;\">▲ TCS3720 블록도 — 근접(적색)·조도(청색)·디지털 코어(회색)가 한 칩에 통합된다</p>\n\n③ 유효 신호와 잡음이 뒤섞인다. 쓸모 있는 신호는 물체에 반사돼 돌아오는 빛뿐인데, 광원 빛의 일부는 물체까지 가지도 않고 패널 내부에서 산란·반사되다 곧바로 수신부로 샌다. 이 직접 결합광은 반사파와 구별이 안 되는 순수한 잡음이다. 그래서 발광부와 수신부 사이에 광학 배리어를 세우거나 충분히 떨어뜨려 배치해 이 경로 자체를 차단한다. TCS3720 후속 제품군도 발광부와 수신부를 패키지 중심에서 떨어뜨려 배치하고, 별도의 크로스토크 상쇄 회로까지 얹는다.\n\n정리하면 OLED는 근접 센서 하나를 품기 위해 네 겹의 숙제를 동시에 풀어야 한다. IR을 잘 통과시키는 투과 설계, T1을 지키는 BML 차광, 그 차광을 뚫는 BPDL·BM 이중광학 소재, 그리고 광원과 수신부를 갈라놓는 격리 설계. ALS가 '얼마나 잘 받을까'의 문제였다면, 근접 센서는 '어떻게 쏘고, 지키고, 뚫고, 가를까'까지 풀어야 하는 문제다.\n\n<!-- page -->\n\n<h3 style=\"font-size:1.1rem; color:#1A2A4A; margin-top:12px; margin-bottom:10px; border-bottom:2px solid #B08A2E; padding-bottom:3px; font-weight:700;\">3. 또 다른 근접 센서의 이슈들</h3>\n\n화소를 구획하는 BPDL·BM(차광막)에 IR만 통과시키는 별도의 길을 마련해야 한다. 이 문제는 어떻게 해결하면 좋을까?\n\n<h4 style=\"font-size:1rem; color:#B08A2E; margin:8px 0 6px; font-weight:700;\">➀ IR에서는 투명하면서 가시광은 차단하는 BPDL과 BM 재료</h4>\n\nBPDL(Black Photo-definable Layer)과 BM(Black Matrix)은 원래 화소 사이로 새는 빛을 막아 명암비를 높이는 차광막이다. 가시광에는 완전히 불투명해야 제 역할을 하는 소재인데, 근접 센서 시대엔 여기에 모순된 요구가 하나 더 얹힌다 — 같은 소재가 940nm 근적외선만은 통과시켜야 한다는 것이다. 사람 눈에는 새까맣게 보이면서 IR 파장 창에서는 투명한, 이중적인 광학 특성이 필요한 셈이다. 안료·염료의 조성을 IR 대역에서만 흡수율이 낮아지도록 정밀하게 설계해야 하고, 여기에 두께와 패터닝 조건까지 맞아야 비로소 원하는 특성이 나온다. 명암비를 희생하지 않으면서 근접 센서가 쓸 만큼의 IR 투과 통로를 확보하는 일 — 지금 업계가 풀어야 할 새로운 소재 과제다.\n\n<h4 style=\"font-size:1rem; color:#B08A2E; margin:14px 0 6px; font-weight:700;\">➁ 근접 센서 기능도 패널에 내장할 수는 없을까?</h4>\n\n별도 칩을 화면 밑에 숨기느라 고생하느니, 패널이 스스로 반사파를 감지하면 어떨까? OPD(유기 포토다이오드)는 근적외선에도 반응할 수 있다. 여기에 발광까지 겸하는 자발광-수광 통합 소자가 더해진다면, 화소 자체가 발광부와 수신부를 겸하는 구조도 가능하다. 아직 걸음마 단계지만, 디스플레이 회사가 타사와 차별화할 수 있는 훌륭한 연구 테마다.\n\n<div class=\"closebox reveal\"><div style=\"font-size:13px;color:#ddd5c4;line-height:1.7;word-break:keep-all\">성균관대 첨단디스플레이공학과는 다양한 각도에서 이러한 이슈들을 함께 고민하고 독창적인 솔루션을 함께 개발할 좋은 파트너입니다.<br><span style=\"color:#ffd700;font-weight:800\">첨디공의 문은 언제나 열려 있습니다.</span></div><div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px\"><a href=\"mailto:nackmann@skku.edu\" style=\"display:inline-block;background:#ffd700;color:#1a1a1a;font-size:12px;font-weight:800;padding:9px 16px;border-radius:6px;text-decoration:none;white-space:nowrap;animation:ctaGlow 2.2s ease-in-out infinite\">산학협력 · 공동연구 문의 (✉ nackmann@skku.edu)</a><a href=\"mailto:nackmann@skku.edu\" style=\"flex-shrink:0;text-align:center;text-decoration:none\"><img src=\"assets/contact_qr.png\" alt=\"문의 QR\" style=\"width:52px;height:52px;background:#fff;padding:4px;border-radius:5px;display:block\"><div style=\"font-size:8px;color:#cfc7ba;margin-top:3px;white-space:nowrap\">스캔하면 메일 문의</div></a></div></div>"};

const FEATURED_PAPER = {"title": "어둠에 갇힌 양자점의 빛을 깨우다", "subtitle": "결정 격자를 살짝 비틀어 양자점의 '발광 금지'를 해제한 성균관대 연구", "paper_info": {"title": "Tailoring light emission in colloidal nanocrystals through lattice distortion engineering", "authors": "Jeong Woo Park†, Sejong Min†, Jong Ah Chae†, Jonathan C. Lemus† 외, 박지상*(교신·성균관대 SAINT), 배완기*(교신·성균관대 첨단디스플레이공학과)", "journal": "Nature Communications (Springer Nature), 2026 · DOI 10.1038/s41467-026-73031-1", "url": "https://doi.org/10.1038/s41467-026-73031-1"}, "intro_text": "스마트폰과 TV 화면을 밝히는 양자점(Quantum Dot). 수 나노미터짜리 이 반도체 결정은 크기만 바꾸면 색을 자유자재로 조절할 수 있어 차세대 디스플레이의 핵심 소재로 꼽힌다. 그런데 이 작은 입자에는 해결하기 힘든 난제가 있는데, 빛을 내야 할 에너지가 '어둠 속에 갇혀' 방출을 거부하는 현상이다. 성균관대학교 배완기 교수 연구팀은 결정 격자를 정밀하게 비틀어 이 금지를 해제하는 데 성공했다. Nature Communications에 게재된 이 연구는 디스플레이와 양자 기술 양쪽 모두에 새로운 문을 열었다.", "challenge_title": "빛이 빠져 나오기 힘든 현상 — 'Radiative Bottleneck'", "challenge_text": "양자점 세계에서는 오랜 시간 풀지 못한 미스터리가 있었다. 특정한 조건, 특히 온도가 매우 낮아지면 양자점은 마치 전원이 꺼진 듯 갑자기 빛을 내지 못하는 상태가 된다. 이는 에너지가 가장 낮은 바닥 상태가 빛을 낼 수 없는 '암상태(Dark State)'로 존재하기 때문이다. 과학자들은 이를 '방사 병목 현상(Radiative Bottleneck)'이라 부른다. 마치 수많은 빛의 입자들이 좁은 방 안에 갇혀, 단 하나뿐인 좁은 출구 앞에 길게 줄을 서서 빠져나가지 못하고 있는 이미지와 같다. 빛이 밖으로 나오지 못해 응답 속도가 느려지고 효율이 떨어지는 이 현상은 현대 나노 기술이 반드시 넘어야 할 장벽이었다.", "steps_title": "발상의 전환 — 격자를 '살짝 비틀다'", "steps_intro": "기존에는 이 암상태 문제를 해결하기 위해 입자의 모양을 억지로 길쭉한 막대나 판 모양으로 비틀어 대칭성을 깨뜨려야만 했다. 하지만 이번 연구진은 입자의 구형(Spherical) 모양은 그대로 유지하면서, 내부의 미세한 '격자 변형(Lattice Distortion)'만으로 빛의 서열을 뒤바꾸는 마법을 부렸다. 높은 대칭성을 가진 아연 결합(Zinc Blende, ZB) 구조의 양자점에서 내부 격자만 뒤틀어 물리 특성을 재설계하는 것은 이론적으로 매우 까다로운 작업이다. 연구팀은 정교한 공정으로 코어 내부에 '삼각 변형(Trigonal distortion)'을 유도했고, 마침내 에너지가 가장 낮은 곳에 빛을 내는 '명상태(Bright State)'를 배치하는 '암-명 역전(Dark-Bright Inversion)'을 성공시켰다. 특히 이번 성과는 극저온 환경에서도 이 역전 현상이 완벽하게 유지됨을 최초로 증명했다는 점에서 학술적 가치가 매우 높다.\n\n연구팀이 선택한 핵심 공정은 CdSe 양자점 코어 위에 ZnSe 껍질을 유사형태(Pseudomorphic) 방식으로 성장시키는 것이었다. CdSe와 ZnSe는 격자 간격이 서로 달라, 껍질이 자라면서 코어를 사방에서 조이는 변형력이 자연스럽게 발생한다. 이 압력이 코어 내부의 결정 격자를 아주 미세하게 비틀어, 원래 90°였던 격자 각도를 87.4°로 틀어 놓는다. 왼쪽 그림의 전자 회절 패턴은 바로 이 87.4°를 직접 측정한 물리적 증거이며, 오른쪽 그림은 ZnSe 껍질 성장 전후 결정 구조가 어떻게 바뀌는지를 한눈에 보여 준다.", "steps": [], "fig1": {"image": "panels/Fig1h_diffraction.png", "caption": "격자 각도 90°→87.4° 실측. 삼각 변형의 물리 증거."}, "fig_bands": {"image": "Fig2_bandstructure_clean.png", "caption": "삼각 변형 전후 밴드 구조 변화. 변형 전(왼쪽)에는 HH·LH 밴드가 겹쳐 어두운 상태가 에너지 최저점을 차지한다. 삼각 변형을 가하면(오른쪽) HH-LH 간격(E_g,HH-LH)이 벌어지며 밝은 LH 상태가 최저점으로 내려온다 — 암-명 역전의 밴드 수준 증거.", "viz_text": "위 그래프가 이 과정의 물리적 증거다. 변형이 없는 일반 ZB 양자점에서는 무거운 정공(HH)과 가벼운 정공(LH) 밴드가 겹쳐 어두운 상태가 에너지 최저점을 차지한다. 삼각 변형을 가하면 HH-LH 간격이 벌어지며 밝은 LH 상태가 최저점으로 내려온다. 이것이 암-명 역전의 물리적 본질이다."}, "results_title": "무엇을 이뤘나", "results_text": "결과는 뚜렷했다. 일반 CdSe 양자점은 4K(−269°C)에서 발광 수명이 수백 ns 이상으로 늘어난다. 반면 격자 변형된 양자점은 4K에서도 약 6 ns라는 초고속 발광 수명을 유지했다. 암-명 역전 덕분에 저온에서도 밝은 상태가 에너지를 독점하기 때문이다. 단일 양자점 수준의 스펙트럼 선폭은 약 22 meV로, 실온 열에너지(kT ≈ 26 meV)보다 좁은 '서브-열 선폭'에 도달했다. 다차원 결맞음 분광법(MDCS)으로 측정한 결맞음 시간(T₂)은 124 fs로, 기준 샘플을 크게 웃돌았다. 발광 양자 수율은 껍질이 두꺼워져도 근단일(near-unity) 수준을 유지했다.", "summary_cards": [{"value": "~6 ns", "label": "4K 발광 수명 (기존 대비 100배↑)"}, {"value": "~22 meV", "label": "단일 QD 선폭 (서브-열)"}, {"value": "124 fs", "label": "결맞음 시간 T₂"}], "fig2": {"image": "panels/Fig4a_PL_spectrum.png", "caption": "단일 QD 발광 스펙트럼. 선폭 ~22 meV (서브-열)."}, "fig3": {"image": "Fig5_MDCS_clean.png", "caption": "다차원 결맞음 분광(MDCS) 측정 결과. 격자 변형 양자점의 결맞음 시간 T₂ = 124 fs로, 기준 샘플(T₂ < 48 fs) 대비 2.5배 이상 향상됐다."}, "meaning_title": "왜 중요한가", "meaning_text": "디스플레이·LED 분야에서는 발광 속도와 양자 수율이 함께 높아지면 소자 효율과 밝기가 개선된다. 특히 이 방법론은 CdSe 외에 InP, ZnSe 같은 비카드뮴 친환경 양자점으로 확장할 수 있어, 규제를 앞둔 QLED 업계에 대안을 제시한다. 양자 기술 분야에서는 빠른 발광 속도와 긴 결맞음 시간이 단일 광자 소스에 필수적인 조건이다. '격자 변형 공학'이 차세대 양자 광자 소자의 새로운 설계 원리로 부상할 가능성을 보여준다.", "recap_table": {"한 줄 요약": "ZnSe 껍질의 격자 변형으로 양자점 '암-명 역전' 달성 → 극저온에서도 초고속 발광", "핵심 성과": "4K 발광 수명 ~6 ns (기존 대비 100배↑) · 선폭 ~22 meV · T₂ = 124 fs", "강점": "친환경 비카드뮴 양자점으로 확장 가능, 디스플레이·양자 기술 동시 적용", "게재": "Nature Communications (Springer Nature), 2026"}, "terms": [{"key": "방사 병목 현상(Radiative Bottleneck)", "val": "일반 양자점에서 에너지 최저점이 빛을 낼 수 없는 '어두운 상태(Dark State)'여서 발광이 억제되는 현상. 이 연구는 격자 변형으로 밝은 상태를 최저점으로 끌어내려 이 병목을 해소했다."}, {"key": "암-명 역전(Dark-Bright Inversion)", "val": "격자 변형으로 밝은 상태를 에너지 최저점으로 내리는 것. 이 연구의 핵심 기전."}, {"key": "결맞음 시간(T₂)", "val": "양자 상태가 외부 교란 없이 유지되는 시간. 양자 컴퓨터·통신에서 '정보 보존 능력'을 나타내는 핵심 지표."}], "closing_quote": "", "closing_author": "성균관대 첨단디스플레이공학과 배완기 교수", "closing_text": "이 연구는 성균관대학교 첨단디스플레이공학과 배완기 교수 연구팀이 브라질 캄피나스 주립대(UNICAMP), 미국 로스앨러모스 국립연구소(LANL) 등과 함께 이룬 국제 공동 성과다.", "closing_sub": "첨단디스플레이공학과가 함께 연구할 대학원생을 기다립니다.", "cta": {"text": "첨단디스플레이공학과 대학원 둘러보기 →", "url": "https://ded.skku.edu/ded/grad_intro.do"}, "fig1b": {"image": "panels/Fig1i_ZB_vs_broken.png", "caption": "ZnSe 껍질 성장 후 대칭이 깨진 구조. 암-명 역전의 핵심."}, "fig2b": {"image": "panels/Fig5d_T2_decay.png", "caption": "결맞음 시간 T₂=124 fs (기준 대비 2.5배↑)."}};
const AI_TECH = {"label": "AI가 주목한 Display Tech", "title": "디스플레이, 로봇의 얼굴이 되다\n— AI가 주목한 표정 표현 기술 7선", "subtitle": "서보모터·실리콘 피부의 한계에서, 디스플레이가 답이 되기까지", "intro": "로봇이 감정을 갖는다면, 어떤 얼굴로 표현할까? 소셜 로봇·휴머노이드가 상용화 국면에 접어들면서 ‘표정 표현 기술’은 인간-로봇 상호작용(HRI)의 핵심 과제로 떠올랐다. 기계 공학자들은 수십 개의 액추에이터로, 소재 과학자들은 인공 피부로 이 난제에 도전해 왔다. 그러나 두 접근 모두 넘기 어려운 벽에 부딪혔다. 제미나이·클로드·챗GPT 3대 AI가 협의하여, 그 한계와 디스플레이 기반 대안 기술 7선을 선정했다.", "items": [{"num": "01", "title": "기계식 근육의 도전 — 서보모터·케이블 구동 표정 로봇", "text": "Ameca(Engineered Arts)는 얼굴에만 27개 액추에이터를 탑재해 눈썹 하나씩 독립 제어가 가능하다. Gen3(ICRA 2025)에서는 미세표정 제어와 응답 지연 개선까지 이뤘고, 실시간 AI 대화와 연동해 맥락에 맞는 표정을 자동 생성한다. 그러나 물리적 구조가 갖는 근본 한계는 여전하다.", "ai_view": "서보모터 방식은 ‘근육을 모방’하는 데 가장 충실하지만, 수십 개 모터의 협조 동작에는 필연적으로 시간 지연이 생긴다. 인간은 0.1초 만에 표정이 바뀌지만 기계 관절은 그 속도를 따라가기 어렵다. 반복 작동에 따른 기계 마모와 유지보수 비용은 상용화의 현실적 걸림돌이다.", "image": "ai_tech/img1_ameca.jpg"}, {"num": "02", "title": "인공 피부의 유혹 — 실리콘·Frubber 기반 표정 시스템", "text": "AheadForm(2025)은 합성 피부 + 브러시리스 마이크로 모터로 30가지 감정을 구현하고 839ms 전에 미소를 예측한다. Hanson Robotics Sophia는 Frubber(flesh rubber) 피부에 33 DoF 액추에이터로 인간 근육 운동을 정밀 재현했다. 2016년 공개된 Sophia는 50가지 이상의 표정을 구사하며, 2017년에는 사우디아라비아로부터 로봇 최초로 시민권을 받아 화제를 모으기도 했다.", "ai_view": "1970년 모리 마사히로 박사가 제시한 언캐니 밸리 이론은 반세기 뒤에도 로봇 표정 연구의 핵심 난제로 남아 있다. 인간 유사도가 높아질수록 호감도는 오히려 급락한다. 기계식 구동과 실리콘 피부 모두 이 구간에 갇혀 있다.", "layout": "side", "image": "ai_tech/img2_aheadform.jpg"}, {"type": "issue", "tag": "공통 이슈", "title": "언캐니 밸리 — 두 기술이 함께 부딪힌 한계", "image": "ai_tech/img3_uncanny_valley.webp"}, {"num": "03", "title": "디스플레이의 첫 번째 답 — Furhat 백프로젝션 기술", "text": "Furhat(스웨덴)는 투명 마스크에 Unity 엔진으로 렌더링한 얼굴을 후면 투사(back-projection)한다. 액추에이터 0개로 성별·인종·나이·표정을 소프트웨어만으로 즉시 전환하며, 88개 RGB LED로 감정별 조명 효과도 추가할 수 있다.", "ai_view": "Furhat는 ‘기계식 근육 없이도 표정이 가능하다’는 개념을 최초로 증명한 선구자다. 그러나 투영 방식은 마스크 형상에 종속되고, 시야각이 좁으며, 밝은 환경에서 가시성이 떨어진다. 진정한 솔루션은 마스크 자체가 디스플레이가 되는 것이다. 스웨덴 왕립공과대학(KTH) 연구에서 출발한 Furhat Robotics는 교육·리셉션 응대 등 상업 현장에 실제 배치되며 투영형 로봇 얼굴의 상용 가능성을 입증했다.", "layout": "side", "image_max_height": 270, "image": "ai_tech/img5_furhat_face.jpg", "compare_title": "이미 실전 배치 중 — Furhat의 활용 현장", "compare_text": "Furhat는 스웨덴·영국·유럽·일본·중동의 대학·기업에서 실제 운용 중이다. 교육 현장의 언어·면접 훈련, 의료 현장의 자폐 치료·정신건강 평가에 쓰인다.", "compare_caption": "출처: Furhat Robotics 공식 홈페이지·Wikipedia"}, {"num": "04", "title": "눈이 말한다 — OLED 탑재 휴머노이드 상용화 가속", "text": "中 AGiBot 지위안(智元) 로봇은 OLED 디스플레이 눈을 탑재한 휴머노이드를 공장에서 대량 운용 중이다. 컬러 OLED로 눈빛·감정 상태를 표현하는 방식이 업계 표준으로 자리 잡고 있다. Anki Vector·Cozmo의 OLED 눈 방식이 산업용 휴머노이드로 확장된 형태다.", "ai_view": "눈은 얼굴에서 가장 먼저 읽히는 감정 신호다. OLED 눈은 액추에이터 없이도 눈빛만으로 친근감을 전달하며, 내구성·비용·속도 모든 면에서 기계식 구동보다 우월하다.", "layout": "side", "image": "ai_tech/img6_robot_oled_eyes.jpg"}, {"num": "05", "title": "로봇 얼굴이 된 OLED — LG Display Tandem P-OLED", "text": "LG Display는 SID Display Week 2026에서 곡면 Tandem P-OLED를 탑재한 로봇 헤드를 최초 공개했다. 폴리이미드 기판으로 로봇 얼굴 곡면에 밀착되며, 1,000 nits 밝기·15,000시간 이상 수명·-30℃~85℃ 동작 범위를 달성했다.", "ai_view": "Tandem P-OLED가 로봇 얼굴에 탑재된 것은 단순한 부품 교체가 아니다. 픽셀 하나하나가 독립 발광하므로 표정 세밀도가 이론상 무제한이고, 소프트웨어 업데이트만으로 새로운 감정 세트를 추가할 수 있다. Tandem 구조는 발광층을 두 겹 쌓아 밝기와 수명을 동시에 끌어올리는 방식으로, 스마트폰·차량용 디스플레이에서 검증된 기술이 로봇 얼굴로 확장된 사례다.", "image": "ai_tech/img4_lg_oled_robot.jpg", "compare_title": "경쟁 동향 — 삼성디스플레이도 뛰어들었다", "compare_text": "삼성디스플레이도 CES 2026에서 13.4인치 원형 OLED를 얼굴로 탑재한 'AI OLED Bot'을 공개하며 맞불을 놓았다. 두 회사가 같은 응용처를 겨냥한다는 것은 '로봇 얼굴'이 콘셉트를 넘어 사업 기회로 인식되고 있다는 신호다.", "compare_image": "ai_tech/img6_samsung_oled_bot.jpg", "compare_caption": "삼성디스플레이 'AI OLED Bot' — CES 2026 공개"}, {"num": "06", "title": "표정은 소프트웨어다 — AI 실시간 렌더링 + DDI 통합", "text": "VividFace(2026)는 0.05초 내에 인간 표정을 로봇에 실시간 재현한다. ExFace(2025)는 확산 트랜스포머(Diffusion Transformer) 기반으로 60fps 자연스러운 표정 제어를 달성했다. 감정 인식 AI → 표정 생성 모델 → DDI 실시간 제어로 이어지는 엔드투엔드 파이프라인이 완성 단계다.", "ai_view": "인간이 웃으면 로봇이 0.05초 내에 같은 웃음을 짓는다. 이것은 재생(playback)이 아니라 감응(resonance)이며, 로봇은 진정한 의미의 얼굴을 갖게 된다.", "image": "ai_tech/img7_vividface_pipeline.png", "image_max_height": 420, "compare_title": "아직은 학계 연구 단계 — 상용 제품은 그다음이다", "compare_text": "앞서 소개한 LG·삼성의 OLED 패널이 이미 로봇 헤드에 실장된 '하드웨어'라면, VividFace·ExFace는 아직 특정 로봇·기업명이 붙지 않은 '소프트웨어 알고리즘' 연구 성과다. VividFace는 X2CNet++라는 표정 전이 모델로 사람의 표정을 로봇 얼굴 모터 값으로 실시간 변환하는 비동기 파이프라인을 제안했고(Li 외, 2026), ExFace는 확산 트랜스포머로 사람 얼굴의 블렌드셰이프를 로봇 구동값에 정밀 매핑하는 방식을 검증했다(2025). 두 논문 모두 특정 로봇 하드웨어를 명시하지 않은 범용 알고리즘이라는 점에서, 패널 회사들의 완제품 공개보다 한 단계 앞선 '기초 기술' 국면에 있다.", "compare_caption": "VividFace: arXiv 2602.07506 · ExFace: arXiv 2504.14477"}, {"num": "07", "title": "삼성디스플레이 스트레처블 디스플레이", "proposal_title": "AI의 제안 — 스트레처블 로봇 얼굴", "proposal_text": "이 원리를 로봇 얼굴에 그대로 옮기면 어떨까? 표정에 맞춰 화면 속 그림이 아니라 패널 자체가 코 부위만 실제로 솟아오르는 것이다. 왼쪽은 평면 상태, 오른쪽은 코가 입체적으로 융기한 상태를 상상해 AI로 그린 개념 일러스트로, 실제 출시된 제품은 아니다.", "image2": "ai_tech/img7b_nose_concept.png", "mechanism_text": "그 안쪽 구조를 도식화하면 이렇다. 평면 디스플레이는 픽셀층이 고정된 평판이라 굴곡을 '그림'으로만 흉내 낼 수 있는 반면, 액추에이티드 3D 디스플레이는 스트레처블 OLED 레이어 바로 아래 액추에이터(구동 소자)들을 심어, 코에 해당하는 위치만 Z축으로 밀어 올린다. 화면이 그리는 깊이가 아니라 실제로 만져지는 굴곡, 즉 물리적 표면 지형(physical surface topography)을 만드는 것이 핵심이다.", "mechanism_image": "ai_tech/img7c_actuation_mechanism.png", "mechanism_caption": "* AI로 생성한 개념 다이어그램이며, 실제 제품 구조가 아닙니다.", "closing_text": "훨씬 미세한 픽셀 피치와 내구성이 관건이다. 화면이 표정을 '그리는' 시대에서 얼굴이 표정을 '짓는' 시대로 넘어가는 다음 단계인 셈이다."}], "hero_image": "ai_tech/img4_lg_oled_robot.jpg", "page_groups": [[0], [1, 2], [3, 4], [5], [6], [7]]};

const GRADUATES = [{"label": "배출인력 소개", "portrait": "graduates/kim_th.jpg", "title": "김태현", "subtitle": "졸업예정 · QLED 표면·계면 제어 연구", "advisor": "송장근 교수", "lab_url": "https://swb.skku.edu/display/index.do", "body_md": "QLED 성능을 좌우하는 핵심은 '표면·계면 제어'라는 확신으로 재료 분석부터 소자 성능 향상까지 연구를 이어왔다. ZnMgO 전자수송층에 극성 용매를 처리해 표면 결함을 줄이는 패시베이션 조건을 탐색했고, 용매 선택과 처리 조건에 따라 표면 화학과 소자 특성이 동시에 달라지는 지점에 주목했다. CdSe 양자점에서는 리간드 교환으로 전하 주입을 방해하는 유기물을 줄여 계면 트랩을 최소화했고, 양자점·전하수송층 계면에서의 전하 이동과 발광 효율을 함께 개선하는 것을 목표로 삼았다. 양자점 합성부터 박막 형성, 소자 제작·평가까지 전 과정을 직접 다루며 재료와 공정, 소자를 함께 이해하는 역량을 키웠다.", "education": [{"level": "고등학교", "school": "분당대진고", "period": "2013~2016", "major": "이과"}, {"level": "대학교", "school": "경희대학교", "period": "2017~2023", "major": "정보전자신소재공학과"}, {"level": "대학원(석)", "school": "성균관대학교", "period": "2024.09~2026.08", "major": "첨단디스플레이공학"}], "achievements": ["2025 SID 포스터 발표", "2025 IMID 포스터 발표"], "interests": ["Quantum Dot LED", "Quantum Dot Synthesis"], "certs": ["OPIc IH"]}, {"label": "배출인력 소개", "portrait": "graduates/park_sa.png", "title": "박설아", "subtitle": "졸업예정 · 산화물 TFT 신뢰성", "advisor": "김용상 교수", "lab_url": "https://swb.skku.edu/NEMS/index.do", "body_md": "김용상 교수님 연구실에서 산화물(IGZO) 기반 박막 트랜지스터(TFT) 연구를 수행해왔다. 용액 공정으로 IGZO TFT를 제작할 때 Precursor 변경을 통한 Fluorine 도핑으로 이동도를 높이는 연구와, Sputtering 기반 IGZO TFT의 Passivation 공정에 쓰이는 가교제를 active layer에 단독 적용했을 때의 소자 특성 변화를 다뤘고, 이 연구로 IMID 학회에서 Best Poster Award를 수상했다. RF Magnetron Sputtering과 용액 공정을 비롯한 박막 증착·포토리소그래피·식각·전기적 특성 평가 등 공정을 직접 수행하고 팀원들과 함께 최적화 과정을 진행했으며, SEM·XPS·XRD·AFM으로 소자 구조와 화학적 변화를 해석하며 소자 특성 분석과 데이터 처리 역량을 키웠다. 주어진 연구에 끈기 있게 몰입해 결과를 논리적으로 해석하고 발전 방향을 제시하는 자세로, 산화물 반도체와 차세대 디스플레이 소자 개발 분야의 전문 연구자로 성장하는 것이 목표다.", "education": [{"level": "대학교", "school": "인하대학교", "period": "2019.03~2024.02", "major": "화학공학과"}, {"level": "대학원(석)", "school": "성균관대학교", "period": "2024.09~2026.08", "major": "첨단디스플레이공학"}], "achievements": ["Improvement of Mobility and Stability of Solution-Processed IGZO TFTs by Using Fluoride Precursor — IMiD 2025, Best Poste function buildAccHTML(grouped,isConf){
  let html='';
  Object.keys(grouped).sort().forEach(key=>{
    const items=grouped[key];
    const id='ac'+Math.random().toString(36).slice(2,8);
    html+=`<div><div class="acc-hdr" onclick="toggleAcc('${id}')">
      <span>${key}</span>
      <span style="display:flex;align-items:center;gap:8px">
        <span style="font-size:14px;font-weight:700;color:#111">${items.length}건</span>
        <span id="arr_${id}" style="font-size:10px;color:#aaa;transition:transform .2s">▼</span>
      </span>
    </div><div class="acc-body" id="${id}">`;
    items.forEach(item=>{
      const meta=isConf?`발표자: ${item.presenter} · ${item.conf} · ${item.date}`:`${item.journal} · ${item.issue} · ${item.date}`;
      const badge=isConf
        ?`<span style="font-size:8px;padding:1px 5px;background:#e6f4ea;color:#1a7a3a;border-radius:3px;border:1px solid #a8d8b8;flex-shrink:0;margin-top:2px">발표</span>`
        :`<span style="font-size:8px;padding:1px 5px;background:#e8f0fb;color:#1a56a0;border-radius:3px;border:1px solid #b3ccf0;flex-shrink:0;margin-top:2px">SCIE</span>`;
      const titleEl=isConf
        ?`<span style="font-size:10px;font-weight:600;color:#333;line-height:1.4;word-break:break-word">${item.title}</span>`
        :`<a href="https://scholar.google.com/scholar?q=${encodeURIComponent(item.title)}" target="_blank" style="font-size:10px;font-weight:600;color:#1a56a0;text-decoration:none;line-height:1.4;word-break:break-word">${item.title}</a>`;
      html+=`<div class="acc-row"><div style="display:flex;gap:4px;align-items:flex-start;margin-bottom:2px">${badge}${titleEl}</div><div style="font-size:9px;color:#888;padding-left:25px;line-height:1.4">${meta}</div></div>`;
    });
    html+=`</div></div>`;
  });
  return html;
}

function mdToParas(md){
  return md.split(/\n\s*\n/).map(p=>{
    const t=p.trim();
    if(!t) return '';
    const html=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
    return /^</.test(t) ? html : `<p>${html}</p>`;
  }).join('');
}

function autoPaginateCoverStory(){
  const rawBody=(COVER_STORY.body||'').replace(/<!--\s*page\s*-->/g,'\n\n').trim();
  if(!rawBody) return;
  const spreadW=Math.min(document.documentElement.clientWidth-20,1100);
  const pageW=Math.floor(spreadW/2);
  const probe=document.createElement('div');
  probe.className='bp';
  probe.style.cssText=`position:fixed;left:-9999px;top:0;width:${pageW}px;height:770px;overflow:hidden;visibility:hidden;pointer-events:none`;
  document.body.appendChild(probe);
  const paras=rawBody.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
  const result=[];
  let cur=[];
  let isFirst=true;
  function fill(arr){
    const txt=`<div class="body-txt cs-body">${mdToParas(arr.join('\n\n'))}</div>`;
    if(isFirst){
      const ser=COVER_STORY.series?`<span style="font-size:12px;font-weight:700;color:#B08A2E;white-space:nowrap;flex-shrink:0">${COVER_STORY.series}</span>`:'';
      const img=COVER_STORY.image?`<div class="figbox" style="width:55%;aspect-ratio:16/9;flex-shrink:0;border-radius:7px"></div>`:'';
      const fz=COVER_STORY.image?'1.5rem':'1.25rem';
      probe.innerHTML=`<div class="db"></div><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px"><span class="label" style="margin-bottom:0">${COVER_STORY.label||'광각 노트'}</span>${ser}</div><div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:10px"><h2 style="font-size:${fz};line-height:1.3;flex:1;min-width:0">${COVER_STORY.title}</h2>${img}</div><div class="dt"></div>${txt}`;
    } else {
      probe.innerHTML=`<div class="db"></div><span class="label">${COVER_STORY.label||'광각 노트'}</span>${txt}`;
    }
  }
  for(const para of paras){
    const test=[...cur,para];
    fill(test);
    if(probe.scrollHeight>probe.clientHeight+1 && cur.length>0){
      result.push(cur.join('\n\n'));
      cur=[para];
      isFirst=false;
    } else {
      cur=test;
    }
  }
  if(cur.length>0) result.push(cur.join('\n\n'));
  document.body.removeChild(probe);
  COVER_STORY.pages=result.map((body,i)=>({id:'cs'+(i+1),body}));
}

    const featurePH=intro.feature_image?`<div style="height:240px;flex:none;margin-bottom:14px;background:#eee;border-radius:6px"></div>`:'';
    const inlinePH=intro.inline_image?`<div style="float:right;width:120px;height:150px;margin:0 0 8px 14px;background:#eee;border-radius:6px"></div>`:'';
    const titleHtml=intro.title?`<h2 style="font-size:1.45rem;margin-bottom:6px;color:#111;font-weight:800;letter-spacing:-0.5px;word-break:keep-all;line-height:1.3">${intro.title}</h2>`:'';
    const subtitleHtml=intro.subtitle?`<div class="dt" style="margin:8px 0"></div><p style="font-size:13.5px;font-style:italic;color:#555;line-height:1.7;word-break:keep-all">${intro.subtitle}</p>`:'';
    const headerPH=(intro.portrait||intro.title||intro.subtitle)?`<div style="display:flex;gap:18px;align-items:flex-start;margin-bottom:16px">${portraitPH}<div class="note" style="flex:1">${titleHtml}${subtitleHtml}</div></div>`:'';
    const signerHtml=intro.signer?`<div class="dt"></div><div style="text-align:right;font-size:13.5px;color:#777;font-weight:600">${intro.signer}</div>`:'';
    let cur=[],isFirst=true;
    const pageTexts=[];
    // 실렌더링 기반 오버플로 체크
    const checkFits=(arr)=>{
      const bodyTxt=`<div class="body-txt" style="overflow:hidden">${inlinePH}${mdToParas(arr.join('\n\n'))}</div>`;
      probe.innerHTML=isFirst
        ?`<div class="db"></div><span class="label">${intro.label}</span>${headerPH}${featurePH}<div class="dt"></div>${bodyTxt}${signerHtml}`
        :`<div class="db"></div><span class="label">${intro.label}</span><div class="dt"></div>${bodyTxt}`;
      return probe.scrollHeight<=probe.clientHeight+1;
    };
    // 문장 단위 분할 (2단계): 문단이 길어 빈 공간이 생길 때 문장으로 쪼개 현재 페이지를 채움
    const toSents=(t)=>t.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean);
    for(const para of paras){
      if(checkFits([...cur,para])){
        cur=[...cur,para];
      } else {
        // 문단 전체가 오버플로 → 문장 단위로 현재 페이지 최대한 채우기
        const sents=toSents(para);
        let fittingSents=[],remainSents=[...sents];
        if(sents.length>1){
          for(let i=0;i<sents.length;i++){
            if(!checkFits([...cur,sents.slice(0,i+1).join(' ')])) break;
            fittingSents=sents.slice(0,i+1);
            remainSents=sents.slice(i+1);
          }
        }
        if(fittingSents.length>0&&remainSents.length>0){
          // 일부 문장이 들어감 → 현재 페이지 마감, 나머지는 다음 페이지 첫 문단
          pageTexts.push({body:[...cur,fittingSents.join(' ')].join('\n\n'),isFirst});
          cur=[remainSents.join(' ')];isFirst=false;
        } else {
          // 분리 불가(단일 문장이거나 아무것도 안 들어감) → 현재 페이지 마감, 문단 전체 다음 페이지
          if(cur.length>0){pageTexts.push({body:cur.join('\n\n'),isFirst});isFirst=false;}
          cur=[para];
        }
      }
    }
    if(cur.length>0) pageTexts.push({body:cur.join('\n\n'),isFirst});
    document.body.removeChild(probe);
    pageTexts.forEach(({body,isFirst:isF},i)=>{
      if(isF){
        result.push({...intro,body_md:body});
      } else {
        result.push({id:`${intro.id||'prof'}-p${i+1}`,label:intro.label||'',title:'',portrait:'',feature_image:'',inline_image:'',subtitle:'',signer:'',body_md:body});
      }
    });
  }
  INTROS.splice(2,INTROS.length-2,...result);
}

function bGradIndex(pageNum){
  const pgCls = pageNum % 2 === 0 ? 'bpg-l' : 'bpg-r';
  const items = GRADUATES.map((g, i) => `
    <div class="grad-grid-item" onclick="openGrad(${i})">

    </div>`).join('');
  return `<div class="bp">

  </div>`;

function openGrad(idx){
  const g = GRADUATES[idx];
  if (!g) return;
  document.getElementById('gradOverlayBody').innerHTML = bGradPage(g, 0);
  const ov = document.getElementById('gradOverlay');
  // 실제 책 페이지(page-left/right)와 동일한 폭·높이로 맞춤 — 스크롤 없이 한 화면에 보이도록
  const pageEl = document.querySelector('.page-left, .page-right');
  const box = ov.querySelector('.grad-overlay-page');
  if (pageEl && box) {
    const r = pageEl.getBoundingClientRect();
    box.style.width = r.width + 'px';
    box.style.height = r.height + 'px';
  }
  ov.classList.add('open');
  tintColumns(ov);
}
function closeGrad(){
  document.getElementById('gradOverlay').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeGrad(); });

function bAiItem(item, opts) {

  let imgHtml = '';

     const defImgMaxH = item.image_max_height || 200;
     imgHtml = `<div style="width:100%;display:flex;justify-content:center;margin-bottom:6px;"><div class="figbox zoomable" style="display:inline-block;width:auto;max-width:100%;background:#fff;border-radius:4px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1);line-height:0;"><img src="${ASSETS}${item.image}" style="width:auto;height:auto;max-width:100%;max-height:${defImgMaxH}px;display:block;"><div class="zoom-hint" style="font-size:9px;padding:2px 6px;">🔍 확대</div></div></div>`;
  }
  const proposalHtml = opts.noProposal ? '' : buildProposalHtml(item);
  const textHtml = item.text ? `<p style="font-size:13px;line-height:1.8;margin-bottom:6px;color:#444;word-break:keep-all">${item.text}</p>` : '';
  const aiViewHtml = item.ai_view ? `
    <div style="border-left:3px solid #d93025;background:#fdf9f9;padding:4px 8px;border-radius:0 4px 4px 0;margin-top:1px">
      <p style="font-size:13px;line-height:1.8;color:#222;margin:0;word-break:keep-all"><span style="font-weight:700;color:#d93025;letter-spacing:0.5px">AI의 시선 · </span>${item.ai_view}</p>

    mainHtml = `<div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:6px;">${sideImgHtml}<div style="flex:1;min-width:0;">${textHtml}</div></div>${aiViewHtml}`;
  } else {
    mainHtml = `${imgHtml}${textHtml}${aiViewHtml}`;
  }

  return `
    <div style="margin-bottom:5px;">
      <h3 style="font-size:1.05rem;color:#111;margin-bottom:3px;display:flex;align-items:flex-start;">
        <span style="display:inline-block;background:#333;color:#fff;border-radius:50%;width:16px;height:16px;text-align:center;line-height:16px;font-size:9.5px;margin-right:6px;flex-shrink:0;margin-top:1px">${item.num}</span>
        <span style="word-break:keep-all;line-height:1.2;font-weight:700">${item.title}</span>
      </h3>
      ${mainHtml}

// AI주목 DisplayTech — 페이지당 항목 배정은 ai_tech.json의 page_groups(칼럼 작업 단계에서
// 이미 결정)를 그대로 따른다. 몇 번째 페이지에 몇 개 항목을 넣을지는 여기서 다시 판단하지 않는다.
function bAiPage(pageNum, groupIdx) {
  if (!AI_TECH || !AI_TECH.page_groups) return '';
  const group = AI_TECH.page_groups[groupIdx];
  if (!group) return '';
  const pgCls = pageNum % 2 === 0 ? 'bpg-l' : 'bpg-r';
  const headerHtml = groupIdx === 0 ? `
    <h2 style="font-size:1.45rem;line-height:1.2;margin:10px 0 6px;letter-spacing:-0.5px;word-break:keep-all;font-weight:800;color:#111">${AI_TECH.title.replace(/\n/g,'<br>')}</h2>
    <p style="font-size:12px;color:#555;font-weight:600;margin-bottom:10px;line-height:1.4">${AI_TECH.subtitle}</p>
    <div class="dt" style="margin-top:10px;margin-bottom:10px"></div>
    <div class="body-txt" style="margin-bottom:12px">
      <p style="font-weight:600;font-size:13px;line-height:1.8;word-break:keep-all">${AI_TECH.intro}</p>
    </div>` : '';
  const itemsHtml = group.map((idx, i) => {
    const item = AI_TECH.items[idx];
    if (!item) return '';
    const html = item.type === 'issue' ? bAiIssue(item) : bAiItem(item);
    return i > 0 ? `<div style="height:7px"></div>${html}` : html;

  return `<div class="bp">

}

const COL_ACCENT=[['廣角','#B08A2E'],['광각','#B08A2E'],['이달의 논문','#C0392B'],['Display Tech','#1A56A0'],['연구실','#1A7A4A'],['인사말','#2C3E70'],['축사','#2C3E70'],['1분기','#5B6770'],['학과 현황','#5B6770'],['학과 주요 행사','#5B6770']];
const EDGE_COLS=['廣角','광각','이달의 논문','Display Tech','연구실'];  // 엣지 인덱스 적용 칼럼(인사말·축사·실적·현황/행사 제외)
function accentFor(t){if(!t)return null;for(const[k,c]of COL_ACCENT){if(t.indexOf(k)>=0)return c;}return null;}
function isEdgeCol(t){if(!t)return false;for(const k of EDGE_COLS){if(t.indexOf(k)>=0)return true;}return false;}
function tintColumns(root){
  root.querySelectorAll('.db').forEach(db=>{
    let accent=null,matched='',sib=db.nextElementSibling,hops=0;
    while(sib&&hops<3&&!accent){const t=(sib.textContent||'').trim();if(t.length<60){accent=accentFor(t);if(accent)matched=t;}sib=sib.nextElementSibling;hops++;}
    if(!accent)return;
    db.style.background=accent;
    const page=db.parentElement;if(!page)return;
    page.querySelectorAll('.label').forEach(l=>l.style.color=accent);
    page.querySelectorAll('span,div').forEach(s=>{if(s.style&&/rgb\(217,\s*48,\s*37\)/.test(s.style.color))s.style.color=accent;});
    page.querySelectorAll('.bpg').forEach(b=>{b.style.background=accent;});
    if(isEdgeCol(matched)){
      const box=db.closest('.page-left, .page-right');
      if(box&&!box.querySelector('.edge-idx')){
        const side=box.classList.contains('page-right')?'right':'left';
        const bar=document.createElement('div');bar.className='edge-idx';
        bar.style.cssText='position:absolute;top:0;'+side+':0;width:7px;height:72px;background:'+accent+';z-index:4;border-radius:0 0 3px 3px';
        box.appendChild(bar);
      }
    }
  });
}

/* ══ 제자리 확대(인플레이스 줌) — 팝업 없이 페이지 액자 안에서 확대 ══ */
function attachInplaceZoom(box){
  const img=box.querySelector('img'); if(!img) return;
  let scale=1, tx=0, ty=0, panning=false, sx=0, sy=0;
  const MAX=5;
  function clamp(){ const W=box.clientWidth,H=box.clientHeight;
    tx=Math.min(0,Math.max(-(scale-1)*W,tx)); ty=Math.min(0,Math.max(-(scale-1)*H,ty)); }
  function apply(){ clamp(); img.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
    box.classList.toggle('zoomed',scale>1.01); }
  function zoomAt(px,py,ns){ ns=Math.max(1,Math.min(ns,MAX));
    tx=px-(px-tx)*(ns/scale); ty=py-(py-ty)*(ns/scale); scale=ns; img.style.transition='none'; apply(); }
  function reset(){ img.style.transition='transform .2s ease-out'; scale=1; tx=0; ty=0; apply(); }
  // 데스크탑: 휠 줌 · 드래그 이동 · 더블클릭 토글
  box.addEventListener('wheel',e=>{ e.preventDefault(); const r=box.getBoundingClientRect();
    zoomAt(e.clientX-r.left,e.clientY-r.top,scale*(e.deltaY<0?1.2:0.83)); },{passive:false});
  box.addEventListener('mousedown',e=>{ if(scale<=1)return; panning=true; img.style.transition='none';
    sx=e.clientX-tx; sy=e.clientY-ty; e.preventDefault(); });
  window.addEventListener('mousemove',e=>{ if(!panning)return; tx=e.clientX-sx; ty=e.clientY-sy; apply(); });
  window.addEventListener('mouseup',()=>{ panning=false; });
  box.addEventListener('dblclick',e=>{ const r=box.getBoundingClientRect();
    if(scale>1) reset(); else zoomAt(e.clientX-r.left,e.clientY-r.top,2.4); });
  // 터치(터치스크린 노트북 등): 핀치 줌 · 1손가락 이동(확대 상태) · 더블탭
  let pinchD=0,pStart=1,pcx=0,pcy=0,lastT=null,lastTap=0;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  box.addEventListener('touchstart',e=>{
    if(e.touches.length===2){ const r=box.getBoundingClientRect(); pinchD=dist(e.touches); pStart=scale;
      pcx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left; pcy=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top; }
    else if(e.touches.length===1){ const now=Date.now();
      if(now-lastTap<300){ const r=box.getBoundingClientRect();
        if(scale>1) reset(); else zoomAt(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top,2.4); } lastTap=now;
      if(scale>1) lastT={x:e.touches[0].clientX-tx,y:e.touches[0].clientY-ty}; }
  },{passive:false});
  box.addEventListener('touchmove',e=>{
    if(e.touches.length===2){ e.preventDefault(); zoomAt(pcx,pcy,pStart*(dist(e.touches)/pinchD)); }
    else if(e.touches.length===1&&scale>1&&lastT){ e.preventDefault();
      tx=e.touches[0].clientX-lastT.x; ty=e.touches[0].clientY-lastT.y; apply(); }
  },{passive:false});
}

renderSpread(0);
</script>
</body>
