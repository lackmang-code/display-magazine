html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;color:#1a1a1a;-webkit-font-smoothing:antialiased;overflow:hidden;height:100dvh;display:flex;flex-direction:column;background:#e8e8e8}

.tog-on{display:inline-flex;align-items:center;gap:4px;background:#ffd700;border-radius:12px;padding:2px 3px 2px 8px;vertical-align:middle;text-shadow:none}

  display:none;position:fixed;inset:0;z-index:9999;
  background:#000;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;
}
#rotate-overlay .rot-icon{font-size:3.5rem;animation:rotpulse 1.8s ease-in-out infinite}
@keyframes rotpulse{
  0%,100%{transform:rotate(0deg);opacity:1}
  50%{transform:rotate(-90deg);opacity:.7}
}
#rotate-overlay .rot-msg{font-size:1.1rem;font-weight:700;color:#ffd700;letter-spacing:.5px;text-align:center;line-height:1.6}

  body:not(.fs) #rotate-overlay{display:flex!important}
}

body.fs #rotate-overlay.fs-show{display:flex!important}

.dt{height:1px;background:#e0e0e0;margin:12px 0}

.acc-hdr:active{background:#f0ece4}
.acc-hdr span:first-child{font-size:14px;font-weight:700;color:#111}
.acc-body{display:none;border:1px solid #e8e4de;border-top:none;border-radius:0 0 7px 7px;overflow:hidden;margin-bottom:12px}
.acc-body.open{display:block}
.acc-row{padding:7px 11px;border-bottom:1px solid #f5f3ef;background:#fff}
.acc-row:last-child{border-bottom:none}

.sum-card{flex:1;border-radius:7px;padding:9px;text-align:center}
.sum-num{font-size:18px;font-weight:700}
.sum-lbl{font-size:10px;margin-top:2px}
.pat-card{background:#f7f5f1;border:1px solid #e8e4de;border-radius:8px;padding:10px 12px;margin-bottom:7px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pat-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;margin-right:4px;margin-bottom:5px}

.phone-nav button:disabled{opacity:.25}
.phone-nav button:active{background:#333}
.pinfo{font-size:11px;color:#aaa;text-align:center;letter-spacing:.5px;line-height:1.3}

.phone-page{display:none;background:#fdf9f3;border-radius:12px;border:1px solid #ccc;box-shadow:0 2px 12px rgba(0,0,0,.1);width:100%;max-width:560px;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;scrollbar-width:none;-ms-overflow-style:none}

.phone-page.active{display:block}
.pp{padding:20px 18px 48px}
.phone-dots{display:flex;justify-content:center;align-items:center;gap:8px;height:36px;flex-shrink:0;background:#e8e8e8}
.phone-dot{width:8px;height:8px;border-radius:50%;background:#bbb;border:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .2s}
.phone-dot.active{background:#111;transform:scale(1.2)}
.p-portrait{width:53px}
.body{font-size:15px;line-height:1.6;color:#333;word-break:keep-all;text-align:justify}
.body p{margin-bottom:10px}
.body p:last-child{margin-bottom:0}
.note p{font-size:14.5px;font-style:italic;color:#555;line-height:1.55}

.grad-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}

.grad-grid-item:active{background:#f5f0e8}

.grad-grid-name{font-size:15px;font-weight:700;color:#111}
.grad-grid-sub{font-size:11px;color:#888;margin-top:4px;word-break:keep-all;line-height:1.45}
/* 모바일은 세로 스크롤 가능(overflow-y:auto)이라 2열 유지, 필요시 3열 조정 가능 */
.grad-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;align-items:center;justify-content:center;padding:14px}
.grad-overlay.open{display:flex}
.grad-overlay-page{position:relative;width:100%;max-width:560px;height:100%;max-height:92dvh;background:#fdf9f3;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.4);overflow-y:auto}

const INTROS = [{"id": "lab-byun-1", "label": "연구실 소개", "title": "변도영 교수 연구실<br>Multiphysics Nano-Fluidics Laboratory (MNFL)", "portrait": "prof_byun.png", "feature_image": "", "subtitle": "Multiphysics Nano-Fluidics Laboratory (MNFL)", "signer": "", "body_md": "성균관대학교 기계공학부 및 첨단디스플레이공학과 변도영 교수의 다중물리 나노유체 연구실(Multiphysics Nano-Fluidics Laboratory, MNFL)은 미세·나노스케일에서 나타나는 유체의 거동을 이해하고, 이를 첨단 제조·에너지·전자·디스플레이 기술에 적용하는 연구를 수행하고 있다. 초기에는 곤충 모사 비행 로봇, 미생물 기반 마이크로유체 칩, 미세관 내부의 나노입자 이상유동 등 유체역학 중심의 연구를 진행했다. 이후 전기수력학 프린팅, 전기방사 및 스프레이 코팅 기술을 기반으로 연구 범위를 넓혀 왔으며, 현재는 크게 네 가지 분야에 집중하고 있다.\n\n먼저 연구실의 핵심 분야는 고해상도·고정밀 3차원 프린팅 기술이다. 일반적인 잉크젯 프린팅은 노즐의 크기에 따라 출력 가능한 선폭이 제한되고, 사용할 수 있는 잉크의 점도 범위도 비교적 좁다. 반면 전기수력학 프린팅(Electrohydrodynamic jet printing, EHD printing)은 강한 전기장을 이용해 노즐 끝의 액체에 전기적 힘을 가함으로써 노즐보다 훨씬 작은 액적이나 미세 제트를 생성할 수 있다. 이를 활용하면 마이크로미터 크기의 선과 점을 원하는 위치에 정밀하게 형성할 수 있으며, 일반 잉크젯 공정에서 다루기 어려운 고점도 잉크에도 적용할 수 있다.\n\n변도영 교수 연구실에서는 금속과 고분자, 반도체 및 기능성 나노소재 등 다양한 잉크를 이용한 미세 패턴 제작과 공정 조건 최적화 연구를 수행하고 있다. 특히 액적을 필요한 순간에만 분사하는 드롭 온 디맨드(Drop-on-Demand, DOD) 방식을 통해 복잡한 형상과 3차원 미세구조를 구현하고 있다. 현재는 100펨토리터 수준의 초미세 액적과 500cP 이상의 고점도 잉크를 처리할 수 있는 128노즐 프린트 헤드 개발도 진행 중이다."}, {"id": "lab-byun-1-p2", "label": "연구실 소개", "title": "", "portrait": "", "feature_image": "prof_byun_lab.png", "feature_image_height": 220, "subtitle": "", "signer": "", "body_md": "최근에는 머신러닝을 활용해 비평면 표면에 분사되는 대전 액적의 위치와 인쇄 품질을 예측하고, 공정 정확도와 안정성을 향상시키는 연구에 주력하고 있다. 이러한 기술은 향후 대면적·다중노즐 기반의 지능형 정밀 제조 공정으로 발전할 수 있다.\n\n두 번째는 프린팅 기반 에너지 변환·저장 소자 연구이다. 전기자동차와 사물인터넷 기술 발전으로 배터리와 에너지 저장 소자의 중요성이 커지는 가운데, 기존 제조 방식은 복잡한 공정과 재료 손실이라는 한계가 있다. 프린팅 공정은 필요한 위치에 필요한 양만 선택적으로 적층할 수 있어 재료 사용량을 줄이고, 소자 구조를 목적에 맞게 자유롭게 설계할 수 있다는 장점이 있다.\n\n연구실에서는 전기수력학 프린팅과 전기방사 기술을 슈퍼커패시터, 리튬이온배터리 및 고체산화물 연료전지(Solid Oxide Fuel Cell, SOFC) 제작에 적용하고 있다. 예를 들어 전기수력학 프린팅으로 초고밀도 온칩 마이크로 슈퍼커패시터를 구현했으며, 최근에는 안정적인 MXene 잉크를 이용해 높은 정전용량을 갖는 마이크로 슈퍼커패시터를 제작했다. 또한 신축성 고분자 나노섬유 전해질을 적용한 리튬이온배터리와 내구성이 향상된 고체산화물 연료전지 연구도 수행하고 있다. 이는 프린팅 기술이 단순한 패턴 제작을 넘어 차세대 에너지 소자의 성능과 제조 효율을 동시에 높일 수 있음을 보여준다."}, {"id": "lab-byun-1-p2-p2", "label": "연구실 소개", "title": "", "portrait": "", "feature_image": "", "subtitle": "", "signer": "", "body_md": "세 번째는 인쇄전자(Printed electronics) 분야이다. 인쇄전자는 전도성·반도체성·절연성 잉크를 기판 위에 직접 인쇄하여 전극, 센서 및 각종 전자소자를 제작하는 기술이다. 기존의 반도체 공정에 비해 공정 단계가 단순하고 재료 낭비가 적으며, 유연하거나 굴곡진 기판에도 소자를 제작할 수 있다는 장점이 있다. 이에 따라 웨어러블 기기, 유연 디스플레이 등 다양한 분야에 활용될 수 있다.\n\n변도영 교수 연구실에서는 전기수력학 프린팅을 이용해 은 나노입자와 은 나노와이어 기반의 미세 전극, 투명 전극, 신축성 변형 센서 등을 제작해 왔다. 또한 반도체 패키징 과정에서 유리 기판을 관통하는 미세 구멍인 관통유리전극(Through-Glass Via, TGV)을 빈 공간 없이 금속으로 채우는 기술과, 전기장의 영향을 받는 언더필의 유동을 제어하는 연구도 수행하고 있다. 이와 함께 유연 기판 위에 마이크로렌즈 배열을 직접 인쇄하고, 투명 고분자 마이크로돔의 전반사를 이용해 고해상도 구조색을 구현하는 등 광학·디스플레이 소자로의 확장도 추진하고 있다.\n\n변도영 교수 연구실은 이러한 현재의 연구 분야를 과거부터 축적해 온 마이크로·나노유체역학과 다중물리 해석 기술을 기반으로 발전시키고 있다. 미세 영역의 유체는 표면장력, 전기력, 점성력 및 음향력이 복합적으로 작용하기 때문에 거시적인 유동과는 다른 특성을 나타낸다. 연구실은 전기장에 의한 액적과 액체 계면의 변화, 모세관 내부 유동, 표면탄성파(SAW)에 의한 액적 분사, 전기분무와 공기 유동을 결합한 균일 박막 코팅 등을 연구해 왔다.\n\n연구실의 기술은 차세대 디스플레이 분야에도 폭넓게 활용될 수 있다. 전기수력학 프린팅은 미세 전극과 발광 소재를 원하는 위치에 직접 형성할 수 있어 마이크로 LED의 전극 패턴 및 패드 제작, 퀀텀닷 색변환층, 페로브스카이트 기반 발광소자 등에 적용될 수 있다. 특히 연구실은 신축성 색변환 필름을 위한 코어-셸 구조의 페로브스카이트 나노섬유를 연구했으며, 미세 렌즈 배열과 구조색 소자는 별도의 안료 없이 빛의 반사와 굴절을 제어해 색을 구현할 수 있어 초박형 디스플레이, 광학 센서 및 AR·VR용 광학부품으로 발전할 가능성이 있다."}];

const COVER_STORY = {"title": "OLED 픽셀 하부에서 사진을 찍으면...", "image": "", "label": "첨디공의 廣角노트", "series": "📖 연재테마 ③ · 투과(透過) 관점 시리즈", "pages": ["지난 두 호에서 다룬 ALS와 Proximity는 \"빛이 통과하느냐\"의 문제였다. ALS는 빛의 양 하나만 재면 됐고, Proximity는 신호 하나만 왕복시키면 됐다. 이번엔 다르다. UDC는 그 빛으로 수백만 화소짜리 이미지를 그려내야 한다. 빛이 통과하는 것만으로는 부족하다. 통과한 빛으로 또렷한 얼굴을 맺어야 한다.\n\n<div class=\"dt\"></div>\n\n2020년 9월, ZTE가 Axon 20을 내놨다. 화면 어디에도 카메라 구멍이 없었다. 셀피를 찍을 땐 화면 한쪽에서 렌즈가 작동했지만, 겉으로 보이는 건 매끈한 디스플레이뿐이었다. 세계 최초로 상용화된 언더디스플레이 카메라(UDC)였다. 비결은 카메라가 있는 자리의 픽셀만 원래보다 성기게 배열한 것, 그게 전부였다.\n\n이 기술을 둘러싼 경쟁은 지금도 치열하다. 비전옥스가 먼저 저밀도·고밀도 이중 구조로 특허를 냈고, BOE는 이를 체스판 배열로 한 단계 정교화했다. 그 사이 삼성을 비롯한 다른 패널사들도 저마다 변형된 구조로 특허를 쌓아왔다. 화면 아래에 카메라 하나를 숨기겠다는 목표는 다들 같은데, 그 목표에 이르는 픽셀 배열 방식은 회사마다 조금씩 다르게 설계됐고, 그 미세한 차이가 곧 특허 분쟁의 경계선이 됐다. 2026년엔 BOE가 삼성을 상대로 자사 특허를 침해했다며 미국 법원에 소송을 걸기도 했다.\n\n<div style=\"display:flex; gap:10px; justify-content:center; align-items:flex-start; margin:10px auto 2px; max-width:520px;\"><div style=\"flex:1; min-width:0;\"><div class=\"figbox zoomable\" style=\"max-width:100%; height:207px; margin:0; overflow:hidden;\"><img src=\"assets/ZTE_구멍없음_비교.jpg\" alt=\"펀치홀 카메라폰(왼쪽)과 ZTE Axon 20(오른쪽) 비교 — 오른쪽은 구멍이 보이지 않음\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><div class=\"zoom-hint\">🔍 확대</div></div><p class=\"cap\" style=\"text-align:center;\">▲ 펀치홀폰(좌)·ZTE Axon 20(우) — 우측엔 구멍이 없다 (출처: GSMArena)</p></div><div style=\"flex:1; min-width:0;\"><div class=\"figbox zoomable\" style=\"max-width:100%; height:207px; margin:0; overflow:hidden;\"><img src=\"assets/ZTE_매크로_픽셀밀도차이.jpg\" alt=\"ZTE Axon 20 화면 매크로샷 — 카메라 영역(왼쪽, 저밀도)과 일반 화면(오른쪽, 고밀도) 픽셀 배열 차이\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><div class=\"zoom-hint\">🔍 확대</div></div><p class=\"cap\" style=\"text-align:center;\">▲ 매크로샷 — 좌(카메라 영역)가 우(일반 화면)보다 픽셀이 성기다 (출처: GSMArena)</p></div></div>", "<h3 style=\"font-size:1.1rem; color:#1A2A4A; margin-top:14px; margin-bottom:10px; border-bottom:2px solid #B08A2E; padding-bottom:3px; font-weight:700; margin-top:2px;\">1. 왜 화질이 나빠지는가</h3>\n\n카메라 위 화면 영역은 아무렇게나 성겨지지 않는다. 픽셀 사이사이에 규칙적인 패턴으로 투명한 틈이 난다. 문제는 여기서 시작된다. 빛은 파동이다. 규칙적으로 반복되는 좁은 틈을 통과한 파동은 그냥 직진하지 않는다. 사방으로 퍼지고 서로 간섭하며 무늬를 만든다. 회절이다. 촘촘한 방충망 너머로 가로등을 보면 빛이 번져 보이는 것과 같은 원리가, 화면 아래 카메라가 받는 모든 상에 그대로 낀다. 흐림(Blur), 플레어(Flare), 헤일로(Halo), 이 세 가지 형태로 나타난다. 흐림은 한 점에서 나온 빛이 또렷한 점 대신 넓게 번지면서 상 전체의 선명도가 떨어지는 현상이다. 플레어는 그 번진 빛이 격자의 결을 따라 별 모양 줄무늬로 뻗어나가는 것이고, 헤일로는 파장마다 꺾이는 각도가 달라 빛이 색깔별로 갈라지면서 밝은 광원 둘레에 무지개 테두리가 지는 현상이다.\n\n밀도를 낮출수록 빛은 더 많이 들어온다. 그런데 동시에, 규칙적으로 성겨진 그 배열 자체가 회절을 키운다. 더 뚫을수록 더 흐려지는 역설. 이게 이번 호가 다루는 근본적인 트레이드오프 이슈다. UDC에서 필연적으로 발생하는 화면 흐려짐 문제는 어떻게 해결할 수 있을까?\n\n<div class=\"figbox zoomable\" style=\"max-width:375px; margin:10px auto 0;\"><img src=\"assets/AI일러스트_UDC셀피시뮬레이션.png\" alt=\"UDC로 찍은 야간 셀피를 가정한 시뮬레이션 이미지 — 무지개색 헤일로와 별 모양 플레어, 전체적인 흐림이 함께 표시됨\" style=\"width:100%;height:auto;display:block\"><div class=\"zoom-hint\">🔍 확대</div></div>\n\n<p class=\"cap\" style=\"text-align:center;\">▲ 헤일로·플레어·흐림 세 가지가 한 장면에 어떻게 겹쳐 보이는지 가정해 만든 AI 시뮬레이션 이미지 — 가로등 둘레 무지개 테두리가 헤일로, 별 모양 줄무늬가 플레어, 배경 전체의 무른 초점이 흐림이다</p>", "<h3 style=\"font-size:1.1rem; color:#1A2A4A; margin-top:8px; margin-bottom:10px; border-bottom:2px solid #B08A2E; padding-bottom:3px; font-weight:700;\">2. S/W Solution (복원알고리즘)</h3>\n\n구조로 다 막지 못한 회절은 결국 어딘가에서 메워야 한다. 2020년 ECCV 챌린지 이후, 컴퓨터비전 학계는 매년 이 문제를 다루는 대회를 열었다. 카메라 앞에 실제 UDC 패널을 놓고 모니터를 촬영해 점퍼짐함수, 즉 하나의 점광원이 얼마나 퍼져 찍히는지를 실측한 뒤, 그 데이터로 흐려진 상을 거꾸로 복원했다. 2021년 발표된 논문은 실제 스마트폰 프로토타입에서 이 점퍼짐함수를 직접 측정해 회절 무늬만 골라 제거하는 신경망을 만들었다. 2023년 논문은 한발 더 나아가, 이 흐려짐을 단순한 블러가 아니라 빛이 매질 속에서 산란하는 현상으로 다시 모델링했다. 2026년 최신 연구는 신경망의 크기를 30% 줄이면서도 성능은 그대로 유지하는 데 성공했다.\n\n<div class=\"figbox\" style=\"max-width:600px; margin:10px auto 14px;\"><svg viewBox=\"0 0 720 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;display:block;background:#fdf9f3\"><line x1=\"50\" y1=\"65\" x2=\"670\" y2=\"65\" stroke=\"#B08A2E\" stroke-width=\"2\"/><circle cx=\"110\" cy=\"65\" r=\"6\" fill=\"#1A2A4A\"/><text x=\"110\" y=\"42\" font-size=\"19.6\" font-weight=\"700\" fill=\"#1A2A4A\" text-anchor=\"middle\">2020</text><text x=\"110\" y=\"110\" font-size=\"16.4\" fill=\"#333\" text-anchor=\"middle\">ECCV Challenge</text><text x=\"110\" y=\"148\" font-size=\"16.4\" fill=\"#333\" text-anchor=\"middle\">벤치마크 확정</text><circle cx=\"290\" cy=\"65\" r=\"6\" fill=\"#1A2A4A\"/><text x=\"290\" y=\"42\" font-size=\"19.6\" font-weight=\"700\" fill=\"#1A2A4A\" text-anchor=\"middle\">2021</text><text x=\"290\" y=\"110\" font-size=\"16.4\" fill=\"#333\" text-anchor=\"middle\">Zhou et al.</text><text x=\"290\" y=\"129\" font-size=\"16.4\" fill=\"#333\" text-anchor=\"middle\">DISCNet</text><text x=\"290\" y=\"148\" font-size=\"16.4\" fill=\"#333\" text-anchor=\"middle\">PSF 실측+딥러닝 복원</text><circle cx=\"470\" cy=\"65\" r=\"6\" fill=\"#1A2A4A\"/><text x=\"470\" y=\"42\" font-size=\"19.6\" font-weight=\"700\" fill=\"#1A2A4A\" text-anchor=\"middle\">2023</text><text x=\"470\" y=\"110\" font-size=\"16.4\" fill=\"#333\" text-anchor=\"middle\">Scattering Effect</text><text x=\"470\" y=\"148\" font-size=\"16.4\" fill=\"#333\" text-anchor=\"middle\">산란매질로 재해석</text><circle cx=\"630\" cy=\"65\" r=\"7\" fill=\"#d93025\"/><text x=\"630\" y=\"42\" font-size=\"19.6\" font-weight=\"700\" fill=\"#d93025\" text-anchor=\"middle\">2026</text><text x=\"630\" y=\"110\" font-size=\"16.4\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"700\">UCMNet</text><text x=\"630\" y=\"148\" font-size=\"16.4\" fill=\"#333\" text-anchor=\"middle\">경량화, 현재진행형</text><text x=\"360\" y=\"182\" font-size=\"18.0\" fill=\"#888\" text-anchor=\"middle\">매년 학회 챌린지가 열리는 정립된 연구분야</text></svg></div>\n\n같은 문제를 구글은 다르게 풀었다. 카메라 영역을 두 구획으로 나누고, 각 구획에 서로 다른 모양의 광차단 패턴을 심었다. 한쪽은 직사각형, 다른 쪽은 원형이다. 그리고 직사각형 패턴 아래엔 흑백 센서를, 원형 패턴 아래엔 컬러 센서를 두었다. 한쪽은 선명도에 유리하고, 다른 쪽은 색 재현에 유리한 이미지를 각각 얻은 뒤, 두 이미지를 인공지능으로 합친다. 오히려 왜곡을 의도적으로 설계해서 서로 다른 정보를 뽑아낸 다음, 계산으로 하나의 상을 짓는다.\n\n<div class=\"figbox\" style=\"max-width:560px; margin:10px auto 0;\"><svg viewBox=\"0 0 680 195\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;display:block;background:#fdf9f3\"><rect x=\"20\" y=\"90\" width=\"90\" height=\"40\" rx=\"6\" fill=\"#e8e0cf\" stroke=\"#B08A2E\"/><text x=\"65\" y=\"115\" font-size=\"17.0\" text-anchor=\"middle\" fill=\"#1A2A4A\">카메라 영역</text><line x1=\"110\" y1=\"100\" x2=\"180\" y2=\"55\" stroke=\"#1A2A4A\" stroke-width=\"1.6\" marker-end=\"url(#a7)\"/><line x1=\"110\" y1=\"120\" x2=\"180\" y2=\"140\" stroke=\"#1A2A4A\" stroke-width=\"1.6\" marker-end=\"url(#a7)\"/><rect x=\"185\" y=\"30\" width=\"34\" height=\"34\" fill=\"none\" stroke=\"#1A2A4A\" stroke-width=\"2\"/><text x=\"202\" y=\"80\" font-size=\"14.7\" text-anchor=\"middle\" fill=\"#333\">직사각형 패턴</text><circle cx=\"202\" cy=\"157\" r=\"18\" fill=\"none\" stroke=\"#d93025\" stroke-width=\"2\"/><text x=\"202\" y=\"187\" font-size=\"14.7\" text-anchor=\"middle\" fill=\"#333\">원형 패턴</text><line x1=\"230\" y1=\"47\" x2=\"290\" y2=\"47\" stroke=\"#1A2A4A\" stroke-width=\"1.6\" marker-end=\"url(#a7)\"/><rect x=\"295\" y=\"27\" width=\"90\" height=\"40\" rx=\"6\" fill=\"#1A2A4A\"/><text x=\"340\" y=\"51\" font-size=\"16.2\" text-anchor=\"middle\" fill=\"#fff\">단색 센서</text><line x1=\"230\" y1=\"157\" x2=\"290\" y2=\"157\" stroke=\"#d93025\" stroke-width=\"1.6\" marker-end=\"url(#a8)\"/><rect x=\"295\" y=\"137\" width=\"90\" height=\"40\" rx=\"6\" fill=\"#d93025\"/><text x=\"340\" y=\"161\" font-size=\"16.2\" text-anchor=\"middle\" fill=\"#fff\">컬러 센서</text><line x1=\"390\" y1=\"47\" x2=\"460\" y2=\"105\" stroke=\"#888\" stroke-width=\"1.6\" marker-end=\"url(#a9)\"/><line x1=\"390\" y1=\"157\" x2=\"460\" y2=\"125\" stroke=\"#888\" stroke-width=\"1.6\" marker-end=\"url(#a9)\"/><rect x=\"465\" y=\"90\" width=\"90\" height=\"45\" rx=\"6\" fill=\"#B08A2E\"/><text x=\"510\" y=\"110\" font-size=\"16.2\" text-anchor=\"middle\" fill=\"#fff\">머신러닝</text><text x=\"510\" y=\"124\" font-size=\"16.2\" text-anchor=\"middle\" fill=\"#fff\">융합</text><line x1=\"555\" y1=\"112\" x2=\"615\" y2=\"112\" stroke=\"#333\" stroke-width=\"1.8\" marker-end=\"url(#a9)\"/><rect x=\"620\" y=\"90\" width=\"55\" height=\"45\" rx=\"6\" fill=\"none\" stroke=\"#1A2A4A\" stroke-width=\"2\"/><text x=\"647\" y=\"117\" font-size=\"27.8\" text-anchor=\"middle\">🖼</text><defs><marker id=\"a7\" markerWidth=\"7\" markerHeight=\"7\" refX=\"3.5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L7,3.5 L0,7 Z\" fill=\"#1A2A4A\"/></marker><marker id=\"a8\" markerWidth=\"7\" markerHeight=\"7\" refX=\"3.5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L7,3.5 L0,7 Z\" fill=\"#d93025\"/></marker><marker id=\"a9\" markerWidth=\"7\" markerHeight=\"7\" refX=\"3.5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L7,3.5 L0,7 Z\" fill=\"#888\"/></marker></defs></svg></div>\n\n<p class=\"cap\" style=\"text-align:center;\">▲ 구글 특허(EP4218225A1) 구조 재구성 — 두 왜곡 패턴 → 두 센서 → ML 융합</p>", "<h3 style=\"font-size:1.1rem; color:#1A2A4A; margin-top:12px; margin-bottom:10px; border-bottom:2px solid #B08A2E; padding-bottom:3px; font-weight:700;\">3. H/W Solution (메타서피스)</h3>\n\n2025년에는 계산 자체가 필요 없는 길도 나왔다. 나노 단위로 설계된 광학 표면, 메타서피스다. 픽셀의 규칙적인 배열이 만드는 회절의 고차 모드를 광학적으로 억제해서, 신경망을 거치지 않고도 실시간으로 깨끗한 상을 얻는다. 사후에 보정하는 대신, 원인 자체를 광학으로 지워버리는 접근이다.\n\n<div class=\"figbox zoomable\" style=\"max-width:430px; margin:10px auto 0;\"><img src=\"assets/메타서피스_Fig8_복원비교.png\" alt=\"메타서피스 적용 전후 비교 및 MTF 성능 그래프\" style=\"width:100%;height:auto;display:block\"><div class=\"zoom-hint\">🔍 휠·더블클릭 확대</div></div>\n\n<p class=\"cap\" style=\"text-align:center;\">▲ (위) 파장별 변조전달함수(MTF) — 메타서피스 적용 시 이상적 곡선(Airy function)에 근접 / (아래) 원본·메타서피스 없이·메타서피스 적용 비교 — 신경망 없이도 선명도가 크게 회복된다 (출처: arXiv:2504.17368)</p>", "<h3 style=\"font-size:1.1rem; color:#1A2A4A; margin-top:12px; margin-bottom:10px; border-bottom:2px solid #B08A2E; padding-bottom:3px; font-weight:700;\">4. 또 다른 UDC의 이슈들</h3>\n\n<h4 style=\"font-size:1rem; color:#B08A2E; margin:8px 0 6px; font-weight:700;\">➀ 메타서피스는 아직 양산 검증 전이다</h4>\n\n가시광 전 대역(450~630nm)에서 동시에 회절을 억제하도록 나노구조를 설계하는 일과, 그 구조를 기존 OLED 패널 공정 위에 그대로 얹을 수 있느냐는 서로 다른 문제다. 논문 수준의 성능이 실제 양산 라인에서도 재현될지는 아직 검증되지 않았다.\n\n<div class=\"figbox\" style=\"max-width:460px; margin:10px auto 14px;\"><svg viewBox=\"0 0 560 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;display:block;background:#fdf9f3\"><g stroke=\"#1A2A4A\" stroke-width=\"3\"><line x1=\"120\" y1=\"40\" x2=\"120\" y2=\"70\"/><line x1=\"140\" y1=\"40\" x2=\"140\" y2=\"70\"/><line x1=\"160\" y1=\"40\" x2=\"160\" y2=\"70\"/><line x1=\"180\" y1=\"40\" x2=\"180\" y2=\"70\"/><line x1=\"200\" y1=\"40\" x2=\"200\" y2=\"70\"/></g><text x=\"160\" y=\"30\" font-size=\"13.7\" fill=\"#1A2A4A\" text-anchor=\"middle\" font-weight=\"700\">픽셀 (회절 발생원)</text><g stroke=\"#d93025\" stroke-width=\"1.4\" fill=\"none\" opacity=\"0.7\"><path d=\"M120,70 Q 160,100 100,130\"/><path d=\"M140,70 Q 160,100 140,130\"/><path d=\"M160,70 L160,130\"/><path d=\"M180,70 Q 160,100 180,130\"/><path d=\"M200,70 Q 160,100 220,130\"/></g><rect x=\"90\" y=\"130\" width=\"140\" height=\"18\" fill=\"#B08A2E\"/><g stroke=\"#fdf9f3\" stroke-width=\"2\"><line x1=\"105\" y1=\"130\" x2=\"105\" y2=\"148\"/><line x1=\"120\" y1=\"130\" x2=\"120\" y2=\"148\"/><line x1=\"135\" y1=\"130\" x2=\"135\" y2=\"148\"/><line x1=\"150\" y1=\"130\" x2=\"150\" y2=\"148\"/><line x1=\"165\" y1=\"130\" x2=\"165\" y2=\"148\"/><line x1=\"180\" y1=\"130\" x2=\"180\" y2=\"148\"/><line x1=\"195\" y1=\"130\" x2=\"195\" y2=\"148\"/><line x1=\"210\" y1=\"130\" x2=\"210\" y2=\"148\"/></g><text x=\"160\" y=\"168\" font-size=\"13.7\" fill=\"#B08A2E\" text-anchor=\"middle\" font-weight=\"700\">메타서피스(나노구조)</text><g stroke=\"#1A2A4A\" stroke-width=\"2\"><line x1=\"130\" y1=\"148\" x2=\"130\" y2=\"190\" marker-end=\"url(#a10)\"/><line x1=\"160\" y1=\"148\" x2=\"160\" y2=\"190\" marker-end=\"url(#a10)\"/><line x1=\"190\" y1=\"148\" x2=\"190\" y2=\"190\" marker-end=\"url(#a10)\"/></g><text x=\"160\" y=\"208\" font-size=\"13.7\" fill=\"#1A2A4A\" text-anchor=\"middle\">평행광 복원 — 딥러닝 없이 실시간</text><defs><marker id=\"a10\" markerWidth=\"7\" markerHeight=\"7\" refX=\"3.5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L7,3.5 L0,7 Z\" fill=\"#1A2A4A\"/></marker></defs><line x1=\"320\" y1=\"100\" x2=\"480\" y2=\"100\" stroke=\"#ccc\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><text x=\"400\" y=\"90\" font-size=\"13.1\" fill=\"#888\" text-anchor=\"middle\">사후 보정(계산) 대신</text><text x=\"400\" y=\"120\" font-size=\"13.1\" fill=\"#888\" text-anchor=\"middle\">원인 자체를 광학으로 제거</text></svg></div>\n\n<h4 style=\"font-size:1rem; color:#B08A2E; margin:14px 0 6px; font-weight:700;\">➁ 신경망 복원과 광학 억제, 경계를 어디서 나눌까</h4>\n\n계산으로 메우는 방식과 광학으로 억제하는 방식은 경쟁 관계가 아니라 조합 가능한 관계에 가깝다. 어디까지 패널 구조가 막고 어디서부터 신경망이 복원할지 — 그 역할 분담을 정하는 최적화 문제는 디스플레이 전공자가 도전해 볼만한 재미있는 연구테마다.\n\n<div class=\"closebox reveal\"><div style=\"font-size:13px;color:#ddd5c4;line-height:1.7;word-break:keep-all\">성균관대 첨단디스플레이공학과는 다양한 각도에서 이러한 이슈들을 함께 고민하고 독창적인 솔루션을 함께 개발할 좋은 파트너입니다.<br><span style=\"color:#ffd700;font-weight:800\">첨디공의 문은 언제나 열려 있습니다.</span></div><div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px\"><a href=\"mailto:nackmann@skku.edu\" style=\"display:inline-block;background:#ffd700;color:#1a1a1a;font-size:12px;font-weight:800;padding:9px 16px;border-radius:6px;text-decoration:none;white-space:nowrap;animation:ctaGlow 2.2s ease-in-out infinite\">산학협력 · 공동연구 문의 (✉ nackmann@skku.edu)</a><a href=\"mailto:nackmann@skku.edu\" style=\"flex-shrink:0;text-align:center;text-decoration:none\"><img src=\"assets/contact_qr.png\" alt=\"문의 QR\" style=\"width:52px;height:52px;background:#fff;padding:4px;border-radius:5px;display:block\"><div style=\"font-size:8px;color:#cfc7ba;margin-top:3px;white-space:nowrap\">스캔하면 메일 문의</div></a></div></div>"], "body": "지난 두 호에서 다룬 ALS와 Proximity는 \"빛이 통과하느냐\"의 문제였다. ALS는 빛의 양 하나만 재면 됐고, Proximity는 신호 하나만 왕복시키면 됐다. 이번엔 다르다. UDC는 그 빛으로 수백만 화소짜리 이미지를 그려내야 한다. 빛이 통과하는 것만으로는 부족하다. 통과한 빛으로 또렷한 얼굴을 맺어야 한다.\n\n<div class=\"dt\"></div>\n\n2020년 9월, ZTE가 Axon 20을 내놨다. 화면 어디에도 카메라 구멍이 없었다. 셀피를 찍을 땐 화면 한쪽에서 렌즈가 작동했지만, 겉으로 보이는 건 매끈한 디스플레이뿐이었다. 세계 최초로 상용화된 언더디스플레이 카메라(UDC)였다. 비결은 카메라가 있는 자리의 픽셀만 원래보다 성기게 배열한 것, 그게 전부였다.\n\n이 기술을 둘러싼 경쟁은 지금도 치열하다. 비전옥스가 먼저 저밀도·고밀도 이중 구조로 특허를 냈고, BOE는 이를 체스판 배열로 한 단계 정교화했다. 그 사이 삼성을 비롯한 다른 패널사들도 저마다 변형된 구조로 특허를 쌓아왔다. 화면 아래에 카메라 하나를 숨기겠다는 목표는 다들 같은데, 그 목표에 이르는 픽셀 배열 방식은 회사마다 조금씩 다르게 설계됐고, 그 미세한 차이가 곧 특허 분쟁의 경계선이 됐다. 2026년엔 BOE가 삼성을 상대로 자사 특허를 침해했다며 미국 법원에 소송을 걸기도 했다.\n\n<div style=\"display:flex; gap:10px; justify-content:center; align-items:flex-start; margin:10px auto 2px; max-width:520px;\"><div style=\"flex:1; min-width:0;\"><div class=\"figbox zoomable\" style=\"max-width:100%; height:207px; margin:0; overflow:hidden;\"><img src=\"assets/ZTE_구멍없음_비교.jpg\" alt=\"펀치홀 카메라폰(왼쪽)과 ZTE Axon 20(오른쪽) 비교 — 오른쪽은 구멍이 보이지 않음\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><div class=\"zoom-hint\">🔍 확대</div></div><p class=\"cap\" style=\"text-align:center;\">▲ 펀치홀폰(좌)·ZTE Axon 20(우) — 우측엔 구멍이 없다 (출처: GSMArena)</p></div><div style=\"flex:1; min-width:0;\"><div class=\"figbox zoomable\" style=\"max-width:100%; height:207px; margin:0; overflow:hidden;\"><img src=\"assets/ZTE_매크로_픽셀밀도차이.jpg\" alt=\"ZTE Axon 20 화면 매크로샷 — 카메라 영역(왼쪽, 저밀도)과 일반 화면(오른쪽, 고밀도) 픽셀 배열 차이\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><div class=\"zoom-hint\">🔍 확대</div></div><p class=\"cap\" style=\"text-align:center;\">▲ 매크로샷 — 좌(카메라 영역)가 우(일반 화면)보다 픽셀이 성기다 (출처: GSMArena)</p></div></div>\n\n<!-- page -->\n\n<h3 style=\"font-size:1.1rem; color:#1A2A4A; margin-top:14px; margin-bottom:10px; border-bottom:2px solid #B08A2E; padding-bottom:3px; font-weight:700; margin-top:2px;\">1. 왜 화질이 나빠지는가</h3>\n\n카메라 위 화면 영역은 아무렇게나 성겨지지 않는다. 픽셀 사이사이에 규칙적인 패턴으로 투명한 틈이 난다. 문제는 여기서 시작된다. 빛은 파동이다. 규칙적으로 반복되는 좁은 틈을 통과한 파동은 그냥 직진하지 않는다. 사방으로 퍼지고 서로 간섭하며 무늬를 만든다. 회절이다. 촘촘한 방충망 너머로 가로등을 보면 빛이 번져 보이는 것과 같은 원리가, 화면 아래 카메라가 받는 모든 상에 그대로 낀다. 흐림(Blur), 플레어(Flare), 헤일로(Halo), 이 세 가지 형태로 나타난다. 흐림은 한 점에서 나온 빛이 또렷한 점 대신 넓게 번지면서 상 전체의 선명도가 떨어지는 현상이다. 플레어는 그 번진 빛이 격자의 결을 따라 별 모양 줄무늬로 뻗어나가는 것이고, 헤일로는 파장마다 꺾이는 각도가 달라 빛이 색깔별로 갈라지면서 밝은 광원 둘레에 무지개 테두리가 지는 현상이다.\n\n밀도를 낮출수록 빛은 더 많이 들어온다. 그런데 동시에, 규칙적으로 성겨진 그 배열 자체가 회절을 키운다. 더 뚫을수록 더 흐려지는 역설. 이게 이번 호가 다루는 근본적인 트레이드오프 이슈다. UDC에서 필연적으로 발생하는 화면 흐려짐 문제는 어떻게 해결할 수 있을까?\n\n<div class=\"figbox zoomable\" style=\"max-width:375px; margin:10px auto 0;\"><img src=\"assets/AI일러스트_UDC셀피시뮬레이션.png\" alt=\"UDC로 찍은 야간 셀피를 가정한 시뮬레이션 이미지 — 무지개색 헤일로와 별 모양 플레어, 전체적인 흐림이 함께 표시됨\" style=\"width:100%;height:auto;display:block\"><div class=\"zoom-hint\">🔍 확대</div></div>\n\n<p class=\"cap\" style=\"text-align:center;\">▲ 헤일로·플레어·흐림 세 가지가 한 장면에 어떻게 겹쳐 보이는지 가정해 만든 AI 시뮬레이션 이미지 — 가로등 둘레 무지개 테두리가 헤일로, 별 모양 줄무늬가 플레어, 배경 전체의 무른 초점이 흐림이다</p>\n\n<!-- page -->\n\n<h3 style=\"font-size:1.1rem; color:#1A2A4A; margin-top:8px; margin-bottom:10px; border-bottom:2px solid #B08A2E; padding-bottom:3px; font-weight:700;\">2. S/W Solution (복원알고리즘)</h3>\n\n구조로 다 막지 못한 회절은 결국 어딘가에서 메워야 한다. 2020년 ECCV 챌린지 이후, 컴퓨터비전 학계는 매년 이 문제를 다루는 대회를 열었다. 카메라 앞에 실제 UDC 패널을 놓고 모니터를 촬영해 점퍼짐함수, 즉 하나의 점광원이 얼마나 퍼져 찍히는지를 실측한 뒤, 그 데이터로 흐려진 상을 거꾸로 복원했다. 2021년 발표된 논문은 실제 스마트폰 프로토타입에서 이 점퍼짐함수를 직접 측정해 회절 무늬만 골라 제거하는 신경망을 만들었다. 2023년 논문은 한발 더 나아가, 이 흐려짐을 단순한 블러가 아니라 빛이 매질 속에서 산란하는 현상으로 다시 모델링했다. 2026년 최신 연구는 신경망의 크기를 30% 줄이면서도 성능은 그대로 유지하는 데 성공했다.\n\n<div class=\"figbox\" style=\"max-width:600px; margin:10px auto 14px;\"><svg viewBox=\"0 0 720 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;display:block;background:#fdf9f3\"><line x1=\"50\" y1=\"65\" x2=\"670\" y2=\"65\" stroke=\"#B08A2E\" stroke-width=\"2\"/><circle cx=\"110\" cy=\"65\" r=\"6\" fill=\"#1A2A4A\"/><text x=\"110\" y=\"42\" font-size=\"19.6\" font-weight=\"700\" fill=\"#1A2A4A\" text-anchor=\"middle\">2020</text><text x=\"110\" y=\"110\" font-size=\"16.4\" fill=\"#333\" text-anchor=\"middle\">ECCV Challenge</text><text x=\"110\" y=\"148\" font-size=\"16.4\" fill=\"#333\" text-anchor=\"middle\">벤치마크 확정</text><circle cx=\"290\" cy=\"65\" r=\"6\" fill=\"#1A2A4A\"/><text x=\"290\" y=\"42\" font-size=\"19.6\" font-weight=\"700\" fill=\"#1A2A4A\" text-anchor=\"middle\">2021</text><text x=\"290\" y=\"110\" font-size=\"16.4\" fill=\"#333\" text-anchor=\"middle\">Zhou et al.</text><text x=\"290\" y=\"129\" font-size=\"16.4\" fill=\"#333\" text-anchor=\"middle\">DISCNet</text><text x=\"290\" y=\"148\" font-size=\"16.4\" fill=\"#333\" text-anchor=\"middle\">PSF 실측+딥러닝 복원</text><circle cx=\"470\" cy=\"65\" r=\"6\" fill=\"#1A2A4A\"/><text x=\"470\" y=\"42\" font-size=\"19.6\" font-weight=\"700\" fill=\"#1A2A4A\" text-anchor=\"middle\">2023</text><text x=\"470\" y=\"110\" font-size=\"16.4\" fill=\"#333\" text-anchor=\"middle\">Scattering Effect</text><text x=\"470\" y=\"148\" font-size=\"16.4\" fill=\"#333\" text-anchor=\"middle\">산란매질로 재해석</text><circle cx=\"630\" cy=\"65\" r=\"7\" fill=\"#d93025\"/><text x=\"630\" y=\"42\" font-size=\"19.6\" font-weight=\"700\" fill=\"#d93025\" text-anchor=\"middle\">2026</text><text x=\"630\" y=\"110\" font-size=\"16.4\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"700\">UCMNet</text><text x=\"630\" y=\"148\" font-size=\"16.4\" fill=\"#333\" text-anchor=\"middle\">경량화, 현재진행형</text><text x=\"360\" y=\"182\" font-size=\"18.0\" fill=\"#888\" text-anchor=\"middle\">매년 학회 챌린지가 열리는 정립된 연구분야</text></svg></div>\n\n같은 문제를 구글은 다르게 풀었다. 카메라 영역을 두 구획으로 나누고, 각 구획에 서로 다른 모양의 광차단 패턴을 심었다. 한쪽은 직사각형, 다른 쪽은 원형이다. 그리고 직사각형 패턴 아래엔 흑백 센서를, 원형 패턴 아래엔 컬러 센서를 두었다. 한쪽은 선명도에 유리하고, 다른 쪽은 색 재현에 유리한 이미지를 각각 얻은 뒤, 두 이미지를 인공지능으로 합친다. 오히려 왜곡을 의도적으로 설계해서 서로 다른 정보를 뽑아낸 다음, 계산으로 하나의 상을 짓는다.\n\n<div class=\"figbox\" style=\"max-width:560px; margin:10px auto 0;\"><svg viewBox=\"0 0 680 195\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;display:block;background:#fdf9f3\"><rect x=\"20\" y=\"90\" width=\"90\" height=\"40\" rx=\"6\" fill=\"#e8e0cf\" stroke=\"#B08A2E\"/><text x=\"65\" y=\"115\" font-size=\"17.0\" text-anchor=\"middle\" fill=\"#1A2A4A\">카메라 영역</text><line x1=\"110\" y1=\"100\" x2=\"180\" y2=\"55\" stroke=\"#1A2A4A\" stroke-width=\"1.6\" marker-end=\"url(#a7)\"/><line x1=\"110\" y1=\"120\" x2=\"180\" y2=\"140\" stroke=\"#1A2A4A\" stroke-width=\"1.6\" marker-end=\"url(#a7)\"/><rect x=\"185\" y=\"30\" width=\"34\" height=\"34\" fill=\"none\" stroke=\"#1A2A4A\" stroke-width=\"2\"/><text x=\"202\" y=\"80\" font-size=\"14.7\" text-anchor=\"middle\" fill=\"#333\">직사각형 패턴</text><circle cx=\"202\" cy=\"157\" r=\"18\" fill=\"none\" stroke=\"#d93025\" stroke-width=\"2\"/><text x=\"202\" y=\"187\" font-size=\"14.7\" text-anchor=\"middle\" fill=\"#333\">원형 패턴</text><line x1=\"230\" y1=\"47\" x2=\"290\" y2=\"47\" stroke=\"#1A2A4A\" stroke-width=\"1.6\" marker-end=\"url(#a7)\"/><rect x=\"295\" y=\"27\" width=\"90\" height=\"40\" rx=\"6\" fill=\"#1A2A4A\"/><text x=\"340\" y=\"51\" font-size=\"16.2\" text-anchor=\"middle\" fill=\"#fff\">단색 센서</text><line x1=\"230\" y1=\"157\" x2=\"290\" y2=\"157\" stroke=\"#d93025\" stroke-width=\"1.6\" marker-end=\"url(#a8)\"/><rect x=\"295\" y=\"137\" width=\"90\" height=\"40\" rx=\"6\" fill=\"#d93025\"/><text x=\"340\" y=\"161\" font-size=\"16.2\" text-anchor=\"middle\" fill=\"#fff\">컬러 센서</text><line x1=\"390\" y1=\"47\" x2=\"460\" y2=\"105\" stroke=\"#888\" stroke-width=\"1.6\" marker-end=\"url(#a9)\"/><line x1=\"390\" y1=\"157\" x2=\"460\" y2=\"125\" stroke=\"#888\" stroke-width=\"1.6\" marker-end=\"url(#a9)\"/><rect x=\"465\" y=\"90\" width=\"90\" height=\"45\" rx=\"6\" fill=\"#B08A2E\"/><text x=\"510\" y=\"110\" font-size=\"16.2\" text-anchor=\"middle\" fill=\"#fff\">머신러닝</text><text x=\"510\" y=\"124\" font-size=\"16.2\" text-anchor=\"middle\" fill=\"#fff\">융합</text><line x1=\"555\" y1=\"112\" x2=\"615\" y2=\"112\" stroke=\"#333\" stroke-width=\"1.8\" marker-end=\"url(#a9)\"/><rect x=\"620\" y=\"90\" width=\"55\" height=\"45\" rx=\"6\" fill=\"none\" stroke=\"#1A2A4A\" stroke-width=\"2\"/><text x=\"647\" y=\"117\" font-size=\"27.8\" text-anchor=\"middle\">🖼</text><defs><marker id=\"a7\" markerWidth=\"7\" markerHeight=\"7\" refX=\"3.5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L7,3.5 L0,7 Z\" fill=\"#1A2A4A\"/></marker><marker id=\"a8\" markerWidth=\"7\" markerHeight=\"7\" refX=\"3.5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L7,3.5 L0,7 Z\" fill=\"#d93025\"/></marker><marker id=\"a9\" markerWidth=\"7\" markerHeight=\"7\" refX=\"3.5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L7,3.5 L0,7 Z\" fill=\"#888\"/></marker></defs></svg></div>\n\n<p class=\"cap\" style=\"text-align:center;\">▲ 구글 특허(EP4218225A1) 구조 재구성 — 두 왜곡 패턴 → 두 센서 → ML 융합</p>\n\n<!-- page -->\n\n<h3 style=\"font-size:1.1rem; color:#1A2A4A; margin-top:12px; margin-bottom:10px; border-bottom:2px solid #B08A2E; padding-bottom:3px; font-weight:700;\">3. H/W Solution (메타서피스)</h3>\n\n2025년에는 계산 자체가 필요 없는 길도 나왔다. 나노 단위로 설계된 광학 표면, 메타서피스다. 픽셀의 규칙적인 배열이 만드는 회절의 고차 모드를 광학적으로 억제해서, 신경망을 거치지 않고도 실시간으로 깨끗한 상을 얻는다. 사후에 보정하는 대신, 원인 자체를 광학으로 지워버리는 접근이다.\n\n<div class=\"figbox zoomable\" style=\"max-width:430px; margin:10px auto 0;\"><img src=\"assets/메타서피스_Fig8_복원비교.png\" alt=\"메타서피스 적용 전후 비교 및 MTF 성능 그래프\" style=\"width:100%;height:auto;display:block\"><div class=\"zoom-hint\">🔍 휠·더블클릭 확대</div></div>\n\n<p class=\"cap\" style=\"text-align:center;\">▲ (위) 파장별 변조전달함수(MTF) — 메타서피스 적용 시 이상적 곡선(Airy function)에 근접 / (아래) 원본·메타서피스 없이·메타서피스 적용 비교 — 신경망 없이도 선명도가 크게 회복된다 (출처: arXiv:2504.17368)</p>\n\n<!-- page -->\n\n<h3 style=\"font-size:1.1rem; color:#1A2A4A; margin-top:12px; margin-bottom:10px; border-bottom:2px solid #B08A2E; padding-bottom:3px; font-weight:700;\">4. 또 다른 UDC의 이슈들</h3>\n\n<h4 style=\"font-size:1rem; color:#B08A2E; margin:8px 0 6px; font-weight:700;\">➀ 메타서피스는 아직 양산 검증 전이다</h4>\n\n가시광 전 대역(450~630nm)에서 동시에 회절을 억제하도록 나노구조를 설계하는 일과, 그 구조를 기존 OLED 패널 공정 위에 그대로 얹을 수 있느냐는 서로 다른 문제다. 논문 수준의 성능이 실제 양산 라인에서도 재현될지는 아직 검증되지 않았다.\n\n<div class=\"figbox\" style=\"max-width:460px; margin:10px auto 14px;\"><svg viewBox=\"0 0 560 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;display:block;background:#fdf9f3\"><g stroke=\"#1A2A4A\" stroke-width=\"3\"><line x1=\"120\" y1=\"40\" x2=\"120\" y2=\"70\"/><line x1=\"140\" y1=\"40\" x2=\"140\" y2=\"70\"/><line x1=\"160\" y1=\"40\" x2=\"160\" y2=\"70\"/><line x1=\"180\" y1=\"40\" x2=\"180\" y2=\"70\"/><line x1=\"200\" y1=\"40\" x2=\"200\" y2=\"70\"/></g><text x=\"160\" y=\"30\" font-size=\"13.7\" fill=\"#1A2A4A\" text-anchor=\"middle\" font-weight=\"700\">픽셀 (회절 발생원)</text><g stroke=\"#d93025\" stroke-width=\"1.4\" fill=\"none\" opacity=\"0.7\"><path d=\"M120,70 Q 160,100 100,130\"/><path d=\"M140,70 Q 160,100 140,130\"/><path d=\"M160,70 L160,130\"/><path d=\"M180,70 Q 160,100 180,130\"/><path d=\"M200,70 Q 160,100 220,130\"/></g><rect x=\"90\" y=\"130\" width=\"140\" height=\"18\" fill=\"#B08A2E\"/><g stroke=\"#fdf9f3\" stroke-width=\"2\"><line x1=\"105\" y1=\"130\" x2=\"105\" y2=\"148\"/><line x1=\"120\" y1=\"130\" x2=\"120\" y2=\"148\"/><line x1=\"135\" y1=\"130\" x2=\"135\" y2=\"148\"/><line x1=\"150\" y1=\"130\" x2=\"150\" y2=\"148\"/><line x1=\"165\" y1=\"130\" x2=\"165\" y2=\"148\"/><line x1=\"180\" y1=\"130\" x2=\"180\" y2=\"148\"/><line x1=\"195\" y1=\"130\" x2=\"195\" y2=\"148\"/><line x1=\"210\" y1=\"130\" x2=\"210\" y2=\"148\"/></g><text x=\"160\" y=\"168\" font-size=\"13.7\" fill=\"#B08A2E\" text-anchor=\"middle\" font-weight=\"700\">메타서피스(나노구조)</text><g stroke=\"#1A2A4A\" stroke-width=\"2\"><line x1=\"130\" y1=\"148\" x2=\"130\" y2=\"190\" marker-end=\"url(#a10)\"/><line x1=\"160\" y1=\"148\" x2=\"160\" y2=\"190\" marker-end=\"url(#a10)\"/><line x1=\"190\" y1=\"148\" x2=\"190\" y2=\"190\" marker-end=\"url(#a10)\"/></g><text x=\"160\" y=\"208\" font-size=\"13.7\" fill=\"#1A2A4A\" text-anchor=\"middle\">평행광 복원 — 딥러닝 없이 실시간</text><defs><marker id=\"a10\" markerWidth=\"7\" markerHeight=\"7\" refX=\"3.5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L7,3.5 L0,7 Z\" fill=\"#1A2A4A\"/></marker></defs><line x1=\"320\" y1=\"100\" x2=\"480\" y2=\"100\" stroke=\"#ccc\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><text x=\"400\" y=\"90\" font-size=\"13.1\" fill=\"#888\" text-anchor=\"middle\">사후 보정(계산) 대신</text><text x=\"400\" y=\"120\" font-size=\"13.1\" fill=\"#888\" text-anchor=\"middle\">원인 자체를 광학으로 제거</text></svg></div>\n\n<h4 style=\"font-size:1rem; color:#B08A2E; margin:14px 0 6px; font-weight:700;\">➁ 신경망 복원과 광학 억제, 경계를 어디서 나눌까</h4>\n\n계산으로 메우는 방식과 광학으로 억제하는 방식은 경쟁 관계가 아니라 조합 가능한 관계에 가깝다. 어디까지 패널 구조가 막고 어디서부터 신경망이 복원할지 — 그 역할 분담을 정하는 최적화 문제는 디스플레이 전공자가 도전해 볼만한 재미있는 연구테마다.\n\n<div class=\"closebox reveal\"><div style=\"font-size:13px;color:#ddd5c4;line-height:1.7;word-break:keep-all\">성균관대 첨단디스플레이공학과는 다양한 각도에서 이러한 이슈들을 함께 고민하고 독창적인 솔루션을 함께 개발할 좋은 파트너입니다.<br><span style=\"color:#ffd700;font-weight:800\">첨디공의 문은 언제나 열려 있습니다.</span></div><div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px\"><a href=\"mailto:nackmann@skku.edu\" style=\"display:inline-block;background:#ffd700;color:#1a1a1a;font-size:12px;font-weight:800;padding:9px 16px;border-radius:6px;text-decoration:none;white-space:nowrap;animation:ctaGlow 2.2s ease-in-out infinite\">산학협력 · 공동연구 문의 (✉ nackmann@skku.edu)</a><a href=\"mailto:nackmann@skku.edu\" style=\"flex-shrink:0;text-align:center;text-decoration:none\"><img src=\"assets/contact_qr.png\" alt=\"문의 QR\" style=\"width:52px;height:52px;background:#fff;padding:4px;border-radius:5px;display:block\"><div style=\"font-size:8px;color:#cfc7ba;margin-top:3px;white-space:nowrap\">스캔하면 메일 문의</div></a></div></div>"};
const PHOTOS = [];
const FEATURED_PAPER = {"title": "순수 청색의 마지막 퍼즐, 고분자 그물로 풀다", "subtitle": "고분자 네트워크 하나로 페로브스카이트 블루 LED의 네 가지 고질병을 한꺼번에 해결한 성균관대 연구", "label": "이달의 논문", "paper_info": {"title": "Polymer Network Modified Perovskite for High-Performance Pure Blue Light-Emitting Diodes", "authors": "Zhongkai Yu, Jiawei Hong, Jiaxin Song 외, 이보람*(교신·성균관대 첨단디스플레이공학과)", "journal": "Advanced Functional Materials (Wiley-VCH), 2026 · DOI 10.1002/adfm.74731", "url": "https://doi.org/10.1002/adfm.74731"}, "pages": ["<div class=\"meta-box\"><div><span class=\"mk\">논문</span><a href=\"https://doi.org/10.1002/adfm.74731\" target=\"_blank\" rel=\"noopener\" style=\"color:#1a56a0;text-decoration:underline\"><em>Polymer Network Modified Perovskite for High-Performance Pure Blue Light-Emitting Diodes</em></a></div><div><span class=\"mk\">저자</span>Zhongkai Yu, Jiawei Hong, Jiaxin Song 외, 이보람*(교신·성균관대 첨단디스플레이공학과)</div><div><span class=\"mk\">게재</span>Advanced Functional Materials (Wiley-VCH), 2026 · DOI 10.1002/adfm.74731</div></div>\n\n<div class=\"dt\" style=\"margin-top:14px\"></div>\n\n스마트폰 화면이든 거실의 TV든, 우리가 보는 모든 색은 빨강·초록·파랑 세 가지 빛의 조합으로 만들어진다. 이 중 빨강과 초록 페로브스카이트 LED는 이미 상용화 문턱까지 왔지만, 파랑만은 유독 제자리걸음이었다. 성균관대학교 이보람 교수 연구팀은 고분자 그물 하나로 이 청색의 고질병을 한꺼번에 풀어냈다. Advanced Functional Materials에 게재된 이 연구로, 페로브스카이트 완전색 디스플레이 상용화의 마지막 퍼즐이 맞춰졌다.\n\n<h3 class=\"feat-h\">왜 유독 청색만 어려운가</h3>\n\n빨강·초록 페로브스카이트는 이미 상당한 효율을 확보했지만, 파랑은 사정이 다르다. 순수한 청색을 내려면 밴드갭이 넓은 페로브스카이트가 필요한데, 이 조성은 유독 결함에 취약하다. 결정을 이루는 염소(Cl) 이온이 빠져나간 자리, 즉 염소 공공이 쉽게 생겨 빛 대신 열로 에너지를 흘려보낸다. 필름을 만드는 과정에서도 결정이 고르게 자라지 못해 표면 곳곳에 미세한 구멍이 뚫리고, 서로 다른 물질이 맞닿는 계면에는 격자 크기 차이로 인한 변형이 쌓인다. 소자에 전압을 걸면 할라이드 이온들이 자리를 이탈해 이리저리 떠돌아다니며 스펙트럼마저 흔들어 놓는다. 네 가지 문제가 서로 얽혀 있어, 하나를 고치면 다른 하나가 불거지는 식이었다.", "<h3 class=\"feat-h\">고분자 그물 하나로 네 가지를 동시에</h3>\n\n연구팀이 택한 해법은 재료를 하나 더 얹는 대신, 얇은 고분자 그물로 페로브스카이트 표면 전체를 감싸는 것이었다. 동일한 단위체(4-비닐페놀)가 사슬처럼 반복 연결된 고분자, 줄여서 PVPh라 부르는 이 물질은 표면과 두 지점에서 동시에 결합한다. 이 이중 결합이 할라이드가 빠져나가는 데 필요한 에너지를 4.387에서 4.776 eV로 끌어올려, 애초에 공공이 생기기 어렵게 만든다(DFT 계산으로 확인).\n\n각도를 바꾼 X선 회절 결과, 처리 전 소자는 보는 각도에 따라 피크 위치가 흔들렸지만 고분자 그물을 두른 소자는 어느 각도에서나 피크가 그대로였다. 딱딱한 페로브스카이트와 말랑한 소재 사이에 쌓이던 압축 응력을 그물이 완충재처럼 흡수했다는 뜻이다.\n\n<div class=\"figbox\" style=\"max-width:365px; height:357px; margin:0 auto;\"><img src=\"assets/Fig4abc_GIXRD_mechanism.png\" alt=\"\"></div><div class=\"cap\">논문 Figure 4: (a)대조군·(b)PVPh 처리 페로브스카이트 막의 GIXRD 패턴, (c)PVPh 격자 변형 완화 모식도. (b)는 각도가 바뀌어도 피크 이동이 거의 없어 격자 변형이 해소됐음을 보여준다 (출처: Yu et al., Adv. Funct. Mater. 2026, CC BY)</div>", "<div class=\"figbox\" style=\"height:260px\"><img src=\"assets/Fig3_SEM_AFM_morphology.png\" alt=\"\"></div><div class=\"cap\" style=\"margin-bottom:14px\">논문 Figure 3: 대조군(위)·PVPh 처리(아래) 페로브스카이트 막의 SEM(좌)·AFM(가운데·우) 이미지. PVPh 처리 시 더 조밀하고 균일한 결정립이 형성된다 (출처: Yu et al., Adv. Funct. Mater. 2026, CC BY)</div>\n\n효과는 눈으로도 확인됐다. 현미경으로 들여다본 막 표면은 자갈밭처럼 거칠던 것(8.94nm)이 고분자 그물을 두른 뒤 매끈한 대리석 바닥에 가깝게(5.99nm) 바뀌었다. 왼쪽 위(대조군)는 알갱이가 뒤섞여 들쭉날쭉하지만, 왼쪽 아래(PVPh 처리)는 알갱이 크기가 고르게 정돈돼 있다. 결정립이 고르면 전하가 새는 통로도 그만큼 줄어든다.\n\n마지막 문제는 이온의 방랑벽이었다. 순수 청색을 내려면 서로 다른 할라이드 이온을 섞어야 하는데, 전압이 걸리면 이온들이 전기장을 따라 제멋대로 움직이다 뭉쳐버린다(상 분리, Phase Separation). 뭉친 이온은 발광 파장을 붉은 쪽으로 늘어뜨려 색을 흐트러뜨린다. PVPh 그물망은 이온이 도망갈 통로 자체를 가둬 상 분리를 막는다. 소자를 오래 켜둔 채 관찰한 결과, 그물 없는 소자는 빛이 붉은 쪽으로 밀렸지만(적색 편이), 그물을 두른 소자는 467nm 그대로였다.\n\n네 가지 문제(결함, 거친 표면, 계면 긴장, 이온 이동)를 각각 다른 재료로 처방하는 대신, 고분자 하나가 표면에 앉는 방식만으로 네 개의 문제를 동시에 겨냥한 셈이다. 연구팀은 이 메커니즘을 DFT 계산으로 결함 형성 에너지를, GIXRD로 격자 변형 완화를, 실제 소자의 발광 안정성 측정으로 이온 억제 효과를 각각 따로 검증했다.", "<h3 class=\"feat-h\">무엇을 이뤘나</h3>\n\n결과는 수치로 뚜렷했다. 최적화된 소자는 외부양자효율(EQE) 9.82%를 기록했는데, 이는 3차원 구조 기반 순수 블루 페로브스카이트 LED로는 지금까지 보고된 것 중 가장 높은 값이다. 최대 휘도는 1544 cd/m²에 달했고, 발광 파장은 순수 블루에 해당하는 467nm를 유지했다. 이런 향상의 뿌리는 더 근본적인 수치에서도 드러난다. 흡수한 빛이 다시 빛으로 되돌아오는 비율(PLQY)은 26.6%에서 43.9%로, 빛이 잦아드는 데 걸리는 시간(PL 수명)은 3.52ns에서 12.52ns로 늘었다. 결함에 붙잡혀 열로 새던 에너지가 그만큼 줄었다는 뜻이다. 이 개선이 특히 의미 있는 건 소자 구조 때문이다. 절연성 리간드 때문에 전하 수송이 막히기 쉬운 2D 구조나 퀀텀닷 방식과 달리, 3D 페로브스카이트는 원래도 전하가 잘 흐른다. 걸림돌은 결함뿐이었다. 이번 연구는 그 구조적 장점은 그대로 두고 결함만 콕 집어 해결해, 고효율과 고휘도를 동시에 잡았다. 무엇보다 이 성능이 복잡한 신물질 합성이 아니라, 기존 용액 공정에 고분자 한 종류를 더하는 손쉬운 방식으로 달성됐다는 점이 중요하다.\n\n<div class=\"sum-cards\"><div class=\"sum-card\" style=\"background:#fef3f0;border:1px solid #fdd9ce\"><div class=\"sum-num\" style=\"color:#111\">9.82%</div><div class=\"sum-lbl\" style=\"color:#aaa\">외부양자효율(EQE) · 3D 순수블루 PeLED 역대 최고</div></div><div class=\"sum-card\" style=\"background:#e8f0fb;border:1px solid #b3ccf0\"><div class=\"sum-num\" style=\"color:#111\">1544 cd/m²</div><div class=\"sum-lbl\" style=\"color:#aaa\">최대 휘도</div></div><div class=\"sum-card\" style=\"background:#e6f4ea;border:1px solid #a8d8b8\"><div class=\"sum-num\" style=\"color:#111\">467 nm</div><div class=\"sum-lbl\" style=\"color:#aaa\">발광 파장 (순수 블루)</div></div></div>\n\n<h3 class=\"feat-h\">왜 중요한가</h3>\n\n완전색 디스플레이를 상용화하려면 빨강·초록·파랑 세 색 모두 안정적인 발광원이 필요하다. 이번 연구는 그중 가장 늦었던 파랑의 효율과 안정성을 동시에 끌어올려, 페로브스카이트 기반 풀컬러 디스플레이 상용화에 필요한 마지막 퍼즐 조각을 채웠다. 결함, 거친 표면, 계면 긴장, 이온 이동이라는 서로 다른 네 가지 약점을 재료 하나로 한꺼번에 잡았다는 점에서, 이번 성과는 실험실 한 편의 결과를 넘어 앞으로 나올 초고화질·저비용 디스플레이 시장의 방향을 가늠하는 이정표이기도 하다. 접근 방식 자체도 특정 신물질 합성이 아니라 범용 고분자를 활용한 표면 처리라서, 다른 조성의 광대역갭 페로브스카이트에도 적용을 확장할 수 있는 여지가 크다. 우리가 마주할 다음 세대 화면 속 청색이 더 깊고 오래갈 때, 그 뒤에는 이 가느다란 고분자 그물이 있을지 모른다.", "<h3 class=\"feat-h\">한눈 요약</h3>\n\n<table class=\"recap\"><tr><td class=\"rk\">한 줄 요약</td><td>PVPh 고분자 네트워크 하나로 결함·거친 표면·계면 긴장·이온 이동, 페로브스카이트 블루 LED의 4가지 고질병을 동시에 억제해 순수 블루 EQE 9.82%로 역대 최고 기록을 세웠다</td></tr><tr><td class=\"rk\">핵심 성과</td><td>EQE 9.82% · 최대 휘도 1544 cd/m² · 발광파장 467nm (3D 순수블루 PeLED 최고 기록)</td></tr><tr><td class=\"rk\">강점</td><td>신물질 합성 없이 기존 용액공정에 고분자 처리만 추가, 확장성 높음</td></tr><tr><td class=\"rk\">게재</td><td>Advanced Functional Materials (Wiley-VCH), 2026</td></tr></table>\n\n<h3 class=\"feat-h\" style=\"margin-top:14px\">핵심 용어</h3>\n\n<div class=\"term\"><span class=\"tk\" style=\"width:111px\">페로브스카이트 LED(PeLED)</span><span class=\"tv\">페로브스카이트 결정 소재를 발광층으로 쓰는 발광다이오드. 좁은 발광선폭과 높은 색순도로 차세대 디스플레이 소재로 주목받지만, 파랑은 유독 결함에 취약해 상용화가 늦었다.</span></div>\n\n<div class=\"term\"><span class=\"tk\" style=\"width:111px\">할라이드 공공(Halide Vacancy)</span><span class=\"tv\">결정 격자에서 염소·브로민·아이오딘 같은 할라이드 이온이 빠져나간 빈자리. 빛 대신 열로 에너지를 새게 하는 결함 트랩으로 작용한다.</span></div>\n\n<div class=\"term\"><span class=\"tk\" style=\"width:111px\">계면격자변형(Interfacial Lattice Strain)</span><span class=\"tv\" style=\"text-align:left\">맞닿은 두 물질의 격자 간격이 달라 경계면에 누적되는 뒤틀림. 결함을 유발하고 소자 수명을 갉아먹는다. GIXRD 측정 결과 PVPh 처리 소자는 이 변형이 해소된 것으로 확인됐다.</span></div>\n\n<div class=\"closebox reveal\"><div class=\"cq-c\">이 연구는 성균관대학교 첨단디스플레이공학과 <span class=\"g\">이보람 교수</span> 연구팀이 수행한 결과입니다.</div><div class=\"cq-h\">첨단디스플레이공학과가 함께 연구할 대학원생을 기다립니다.</div><div class=\"cta-row\"><a class=\"cta-btn\" href=\"https://ded.skku.edu/ded/grad_intro.do\" target=\"_blank\" rel=\"noopener\">첨단디스플레이공학과<br>대학원 둘러보기 →</a><a class=\"cta-qr\" href=\"https://ded.skku.edu/ded/grad_intro.do\" target=\"_blank\" rel=\"noopener\" title=\"홈페이지 QR\"><img src=\"assets/qr.png\" alt=\"QR\"></a></div></div>"], "body": "<div class=\"meta-box\"><div><span class=\"mk\">논문</span><a href=\"https://doi.org/10.1002/adfm.74731\" target=\"_blank\" rel=\"noopener\" style=\"color:#1a56a0;text-decoration:underline\"><em>Polymer Network Modified Perovskite for High-Performance Pure Blue Light-Emitting Diodes</em></a></div><div><span class=\"mk\">저자</span>Zhongkai Yu, Jiawei Hong, Jiaxin Song 외, 이보람*(교신·성균관대 첨단디스플레이공학과)</div><div><span class=\"mk\">게재</span>Advanced Functional Materials (Wiley-VCH), 2026 · DOI 10.1002/adfm.74731</div></div>\n\n<div class=\"dt\" style=\"margin-top:14px\"></div>\n\n스마트폰 화면이든 거실의 TV든, 우리가 보는 모든 색은 빨강·초록·파랑 세 가지 빛의 조합으로 만들어진다. 이 중 빨강과 초록 페로브스카이트 LED는 이미 상용화 문턱까지 왔지만, 파랑만은 유독 제자리걸음이었다. 성균관대학교 이보람 교수 연구팀은 고분자 그물 하나로 이 청색의 고질병을 한꺼번에 풀어냈다. Advanced Functional Materials에 게재된 이 연구로, 페로브스카이트 완전색 디스플레이 상용화의 마지막 퍼즐이 맞춰졌다.\n\n<h3 class=\"feat-h\">왜 유독 청색만 어려운가</h3>\n\n빨강·초록 페로브스카이트는 이미 상당한 효율을 확보했지만, 파랑은 사정이 다르다. 순수한 청색을 내려면 밴드갭이 넓은 페로브스카이트가 필요한데, 이 조성은 유독 결함에 취약하다. 결정을 이루는 염소(Cl) 이온이 빠져나간 자리, 즉 염소 공공이 쉽게 생겨 빛 대신 열로 에너지를 흘려보낸다. 필름을 만드는 과정에서도 결정이 고르게 자라지 못해 표면 곳곳에 미세한 구멍이 뚫리고, 서로 다른 물질이 맞닿는 계면에는 격자 크기 차이로 인한 변형이 쌓인다. 소자에 전압을 걸면 할라이드 이온들이 자리를 이탈해 이리저리 떠돌아다니며 스펙트럼마저 흔들어 놓는다. 네 가지 문제가 서로 얽혀 있어, 하나를 고치면 다른 하나가 불거지는 식이었다.\n\n<!-- page -->\n\n<h3 class=\"feat-h\">고분자 그물 하나로 네 가지를 동시에</h3>\n\n연구팀이 택한 해법은 재료를 하나 더 얹는 대신, 얇은 고분자 그물로 페로브스카이트 표면 전체를 감싸는 것이었다. 동일한 단위체(4-비닐페놀)가 사슬처럼 반복 연결된 고분자, 줄여서 PVPh라 부르는 이 물질은 표면과 두 지점에서 동시에 결합한다. 이 이중 결합이 할라이드가 빠져나가는 데 필요한 에너지를 4.387에서 4.776 eV로 끌어올려, 애초에 공공이 생기기 어렵게 만든다(DFT 계산으로 확인).\n\n각도를 바꾼 X선 회절 결과, 처리 전 소자는 보는 각도에 따라 피크 위치가 흔들렸지만 고분자 그물을 두른 소자는 어느 각도에서나 피크가 그대로였다. 딱딱한 페로브스카이트와 말랑한 소재 사이에 쌓이던 압축 응력을 그물이 완충재처럼 흡수했다는 뜻이다.\n\n<div class=\"figbox\" style=\"max-width:365px; height:357px; margin:0 auto;\"><img src=\"assets/Fig4abc_GIXRD_mechanism.png\" alt=\"\"></div><div class=\"cap\">논문 Figure 4: (a)대조군·(b)PVPh 처리 페로브스카이트 막의 GIXRD 패턴, (c)PVPh 격자 변형 완화 모식도. (b)는 각도가 바뀌어도 피크 이동이 거의 없어 격자 변형이 해소됐음을 보여준다 (출처: Yu et al., Adv. Funct. Mater. 2026, CC BY)</div>\n\n<!-- page -->\n\n<div class=\"figbox\" style=\"height:260px\"><img src=\"assets/Fig3_SEM_AFM_morphology.png\" alt=\"\"></div><div class=\"cap\" style=\"margin-bottom:14px\">논문 Figure 3: 대조군(위)·PVPh 처리(아래) 페로브스카이트 막의 SEM(좌)·AFM(가운데·우) 이미지. PVPh 처리 시 더 조밀하고 균일한 결정립이 형성된다 (출처: Yu et al., Adv. Funct. Mater. 2026, CC BY)</div>\n\n효과는 눈으로도 확인됐다. 현미경으로 들여다본 막 표면은 자갈밭처럼 거칠던 것(8.94nm)이 고분자 그물을 두른 뒤 매끈한 대리석 바닥에 가깝게(5.99nm) 바뀌었다. 왼쪽 위(대조군)는 알갱이가 뒤섞여 들쭉날쭉하지만, 왼쪽 아래(PVPh 처리)는 알갱이 크기가 고르게 정돈돼 있다. 결정립이 고르면 전하가 새는 통로도 그만큼 줄어든다.\n\n마지막 문제는 이온의 방랑벽이었다. 순수 청색을 내려면 서로 다른 할라이드 이온을 섞어야 하는데, 전압이 걸리면 이온들이 전기장을 따라 제멋대로 움직이다 뭉쳐버린다(상 분리, Phase Separation). 뭉친 이온은 발광 파장을 붉은 쪽으로 늘어뜨려 색을 흐트러뜨린다. PVPh 그물망은 이온이 도망갈 통로 자체를 가둬 상 분리를 막는다. 소자를 오래 켜둔 채 관찰한 결과, 그물 없는 소자는 빛이 붉은 쪽으로 밀렸지만(적색 편이), 그물을 두른 소자는 467nm 그대로였다.\n\n네 가지 문제(결함, 거친 표면, 계면 긴장, 이온 이동)를 각각 다른 재료로 처방하는 대신, 고분자 하나가 표면에 앉는 방식만으로 네 개의 문제를 동시에 겨냥한 셈이다. 연구팀은 이 메커니즘을 DFT 계산으로 결함 형성 에너지를, GIXRD로 격자 변형 완화를, 실제 소자의 발광 안정성 측정으로 이온 억제 효과를 각각 따로 검증했다.\n\n<!-- page -->\n\n<h3 class=\"feat-h\">무엇을 이뤘나</h3>\n\n결과는 수치로 뚜렷했다. 최적화된 소자는 외부양자효율(EQE) 9.82%를 기록했는데, 이는 3차원 구조 기반 순수 블루 페로브스카이트 LED로는 지금까지 보고된 것 중 가장 높은 값이다. 최대 휘도는 1544 cd/m²에 달했고, 발광 파장은 순수 블루에 해당하는 467nm를 유지했다. 이런 향상의 뿌리는 더 근본적인 수치에서도 드러난다. 흡수한 빛이 다시 빛으로 되돌아오는 비율(PLQY)은 26.6%에서 43.9%로, 빛이 잦아드는 데 걸리는 시간(PL 수명)은 3.52ns에서 12.52ns로 늘었다. 결함에 붙잡혀 열로 새던 에너지가 그만큼 줄었다는 뜻이다. 이 개선이 특히 의미 있는 건 소자 구조 때문이다. 절연성 리간드 때문에 전하 수송이 막히기 쉬운 2D 구조나 퀀텀닷 방식과 달리, 3D 페로브스카이트는 원래도 전하가 잘 흐른다. 걸림돌은 결함뿐이었다. 이번 연구는 그 구조적 장점은 그대로 두고 결함만 콕 집어 해결해, 고효율과 고휘도를 동시에 잡았다. 무엇보다 이 성능이 복잡한 신물질 합성이 아니라, 기존 용액 공정에 고분자 한 종류를 더하는 손쉬운 방식으로 달성됐다는 점이 중요하다.\n\n<div class=\"sum-cards\"><div class=\"sum-card\" style=\"background:#fef3f0;border:1px solid #fdd9ce\"><div class=\"sum-num\" style=\"color:#111\">9.82%</div><div class=\"sum-lbl\" style=\"color:#aaa\">외부양자효율(EQE) · 3D 순수블루 PeLED 역대 최고</div></div><div class=\"sum-card\" style=\"background:#e8f0fb;border:1px solid #b3ccf0\"><div class=\"sum-num\" style=\"color:#111\">1544 cd/m²</div><div class=\"sum-lbl\" style=\"color:#aaa\">최대 휘도</div></div><div class=\"sum-card\" style=\"background:#e6f4ea;border:1px solid #a8d8b8\"><div class=\"sum-num\" style=\"color:#111\">467 nm</div><div class=\"sum-lbl\" style=\"color:#aaa\">발광 파장 (순수 블루)</div></div></div>\n\n<h3 class=\"feat-h\">왜 중요한가</h3>\n\n완전색 디스플레이를 상용화하려면 빨강·초록·파랑 세 색 모두 안정적인 발광원이 필요하다. 이번 연구는 그중 가장 늦었던 파랑의 효율과 안정성을 동시에 끌어올려, 페로브스카이트 기반 풀컬러 디스플레이 상용화에 필요한 마지막 퍼즐 조각을 채웠다. 결함, 거친 표면, 계면 긴장, 이온 이동이라는 서로 다른 네 가지 약점을 재료 하나로 한꺼번에 잡았다는 점에서, 이번 성과는 실험실 한 편의 결과를 넘어 앞으로 나올 초고화질·저비용 디스플레이 시장의 방향을 가늠하는 이정표이기도 하다. 접근 방식 자체도 특정 신물질 합성이 아니라 범용 고분자를 활용한 표면 처리라서, 다른 조성의 광대역갭 페로브스카이트에도 적용을 확장할 수 있는 여지가 크다. 우리가 마주할 다음 세대 화면 속 청색이 더 깊고 오래갈 때, 그 뒤에는 이 가느다란 고분자 그물이 있을지 모른다.\n\n<!-- page -->\n\n<h3 class=\"feat-h\">한눈 요약</h3>\n\n<table class=\"recap\"><tr><td class=\"rk\">한 줄 요약</td><td>PVPh 고분자 네트워크 하나로 결함·거친 표면·계면 긴장·이온 이동, 페로브스카이트 블루 LED의 4가지 고질병을 동시에 억제해 순수 블루 EQE 9.82%로 역대 최고 기록을 세웠다</td></tr><tr><td class=\"rk\">핵심 성과</td><td>EQE 9.82% · 최대 휘도 1544 cd/m² · 발광파장 467nm (3D 순수블루 PeLED 최고 기록)</td></tr><tr><td class=\"rk\">강점</td><td>신물질 합성 없이 기존 용액공정에 고분자 처리만 추가, 확장성 높음</td></tr><tr><td class=\"rk\">게재</td><td>Advanced Functional Materials (Wiley-VCH), 2026</td></tr></table>\n\n<h3 class=\"feat-h\" style=\"margin-top:14px\">핵심 용어</h3>\n\n<div class=\"term\"><span class=\"tk\" style=\"width:111px\">페로브스카이트 LED(PeLED)</span><span class=\"tv\">페로브스카이트 결정 소재를 발광층으로 쓰는 발광다이오드. 좁은 발광선폭과 높은 색순도로 차세대 디스플레이 소재로 주목받지만, 파랑은 유독 결함에 취약해 상용화가 늦었다.</span></div>\n\n<div class=\"term\"><span class=\"tk\" style=\"width:111px\">할라이드 공공(Halide Vacancy)</span><span class=\"tv\">결정 격자에서 염소·브로민·아이오딘 같은 할라이드 이온이 빠져나간 빈자리. 빛 대신 열로 에너지를 새게 하는 결함 트랩으로 작용한다.</span></div>\n\n<div class=\"term\"><span class=\"tk\" style=\"width:111px\">계면격자변형(Interfacial Lattice Strain)</span><span class=\"tv\" style=\"text-align:left\">맞닿은 두 물질의 격자 간격이 달라 경계면에 누적되는 뒤틀림. 결함을 유발하고 소자 수명을 갉아먹는다. GIXRD 측정 결과 PVPh 처리 소자는 이 변형이 해소된 것으로 확인됐다.</span></div>\n\n<div class=\"closebox reveal\"><div class=\"cq-c\">이 연구는 성균관대학교 첨단디스플레이공학과 <span class=\"g\">이보람 교수</span> 연구팀이 수행한 결과입니다.</div><div class=\"cq-h\">첨단디스플레이공학과가 함께 연구할 대학원생을 기다립니다.</div><div class=\"cta-row\"><a class=\"cta-btn\" href=\"https://ded.skku.edu/ded/grad_intro.do\" target=\"_blank\" rel=\"noopener\">첨단디스플레이공학과<br>대학원 둘러보기 →</a><a class=\"cta-qr\" href=\"https://ded.skku.edu/ded/grad_intro.do\" target=\"_blank\" rel=\"noopener\" title=\"홈페이지 QR\"><img src=\"assets/qr.png\" alt=\"QR\"></a></div></div>"};
const AI_TECH = {"label": "AI가 주목한 Display Tech", "title": "HUD(Head Up Display)의 재발견", "subtitle": "", "intro": "속도계 위에 뜨는 숫자 하나였던 기술이, 이제 자동차 앞유리 전체를 무대로 쓰고 있다. 화면을 넓히는 방식, 도로 위에 그래픽을 얹는 방식, 광학계 자체를 지우는 방식까지 서로 다른 세 갈래로 진화 중이다. 이번 호에서는 AI가 지금 가장 주목하는 HUD 기술 4가지를 직접 골라봤다. 왜 골랐는지, AI의 시선으로 설명한다.", "hero_image": "ai_tech/bmw_panoramic_hud.jpg", "items": [{"num": "01", "title": "화면이 아니라 공간을 넓히다: 파노라믹 HUD", "text": "속도 하나 띄우던 좁은 화면이 윈드실드 하단 전체 폭으로 늘어났다. 운전자 앞뿐 아니라 조수석까지 날씨·배터리·음악을 한 번에 보여준다. 이걸 1픽으로 고른 이유는 지금 가장 확실히 도로 위를 달리는 기술이라서다. BMW Panoramic Vision은 2025년 Neue Klasse부터 양산 중이다. AR-HUD와 헷갈리기 쉬운데 다르다. AR-HUD는 도로 위 사물에 그래픽을 정합시키지만, 이건 정합 없이 화면만 넓힌다.", "image": "ai_tech/bmw_panoramic_hud.jpg", "image_max_height": 380, "compare_title": "실제 탑재 현황", "compare_text": "BMW Neue Klasse 전 모델에 2025년 말부터 순차 적용, 2026년형 X5·7시리즈까지 확대. 윈드실드 하단 전체 폭에 고휘도·고대비 투사 방식."}, {"num": "02", "title": "도로 위에 그래픽을 얹다: AR-HUD", "text": "저 앞 차량까지 20.7m, 100m 앞 제한속도 100. 실제 도로 위 사물에 정확히 겹쳐지는 그래픽이다. AR-HUD 자체는 새롭지 않다. 이걸 픽한 이유는 AI 인식 기술과 결합되는 방향이 흥미로워서다. StradVision 같은 회사는 원래 자율주행용 객체인식 AI를 만들던 곳인데, 그 인식 결과(앞차와의 거리, 차선, 위험물)를 그대로 HUD 그래픽으로 뿌린다. 화면 기술이 아니라 인식 기술이 HUD의 품질을 결정하는 시대로 넘어가고 있다는 뜻이다. 보행자·자전거·정지차량을 다르게 표시하는 것도 이 인식 정확도에 달렸다. 광학 회사 아닌 인식 AI 회사가 HUD 시장에 뛰어드는 이유다.", "image": "ai_tech/stradvision_arhud_full.webp", "image_max_height": 380, "compare_title": "핵심 차이", "compare_text": "1번(파노라믹)이 정보의 양을 넓힌다면, AR-HUD는 정보의 위치를 실제 사물과 정확히 일치시킨다. 카메라·레이더 인식 정확도가 곧 HUD 품질이다. 이 정합을 위해 AR-HUD는 가상 영상이 맺히는 거리를 7~15m 이상 멀게 잡는다. 실제 사물과 초점이 자연스럽게 겹치도록 하기 위해서다. 반면 파노라믹 HUD는 이런 정합이 필요 없어 광학 구조가 단순하고, 대신 화면 자체를 넓혀 정보량으로 승부한다. AR-HUD는 '정확한 위치'에, 파노라믹은 '넓은 면적'에 거는 셈이다.", "compare_caption": "출처: StradVision 공식 자료"}, {"num": "03", "title": "광학계를 지우다: 홀로그래픽 HUD", "text": "프로젝터도, 거울도, 두꺼운 광학계도 없다. 사람 머리카락보다 얇은 필름 한 장이 자동차 앞유리 전체를 화면으로 바꾼다. 현대모비스가 ZEISS, tesa, Saint-Gobain Sekurit과 손잡고 만드는 홀로그래픽 윈드실드 디스플레이(HWD) 이야기다. 앞의 두 기술이 '어떻게 더 잘 보여줄까'를 고민할 때, 이건 '광학계 자체를 없애면 어떨까'라는 질문에서 출발했다. 0.1mm 미만의 HOE 필름이 회절 원리로 빛을 꺾어 보내, 운전석과 조수석에 다른 화면을 동시에 띄우는 프라이버시 디스플레이까지 가능하다. 2026년 2월 4개사 얼라이언스를 결성하며 2029년 양산을 공식 목표로 세웠고, CES 2026 혁신상까지 받았다. 아직 컨셉이 아니라, 이미 공급망이 만들어지고 있는 미래다.", "image": "ai_tech/mobis_hwd.jpg", "image_max_height": 380, "compare_title": "왜 지금인가", "compare_text": "2024년 현대모비스와 ZEISS 단독 협약 당시 목표는 2027년이었다. 2026년 2월 tesa, Saint-Gobain Sekurit이 합류하며 목표가 2029년으로 조정됐다. 파트너가 늘어난 만큼 목표 시점이 늦춰진 건, 컨셉 단계에서 실제 양산 공급망 단계로 넘어갔다는 신호이기도 하다.", "compare_caption": "출처: 현대모비스 뉴스룸, ZEISS·tesa·Saint-Gobain Sekurit·현대모비스 QuadAlliance 공동 보도자료(2026-02-03), CES 2026 Innovation Award"}, {"num": "04", "type": "proposal", "title": "AI의 제안: HUD 화면에서 지능형 인터페이스로", "proposal_title": "AI의 제안, HUD가 스스로 판단하는 눈이 된다면", "proposal_text": "지금까지 살펴본 세 기술은 전부 '어떻게 더 잘 보여줄까'를 고민했다. 다음 질문은 다르다. '무엇을, 언제, 어디에 보여줄까'를 누가 결정하느냐다. 카메라, 레이더, 시선추적 데이터를 AI가 실시간으로 해석해서, 운전자에게 지금 필요한 정보만 골라 공간에 배치하는 인터페이스, AI Spatial HMI 이야기다.", "mechanism_text": "공상이 아니다. 2025년 11월 발표된 논문 'Visionary Co-Driver'는 영상처리와 대형언어모델(LLM)을 결합해 충돌 위험은 아니지만 주의가 필요한 도로 위 상황을 실시간으로 판단하고, 운전자의 시선 방향에 맞춰 적응형 HUD 경고를 띄우는 구조를 제안했다. 41명의 실제 운전자 실험에서 위험 인지 능력이 향상됐다는 결과까지 확인됐다.", "mechanism_image": "ai_tech/ai_spatial_hmi_concept.jpg", "mechanism_caption": "* 이 페이지의 이미지는 AI가 생성한 개념 렌더링이며, 실제 제품이나 서비스가 아닙니다. 출처: Visionary Co-Driver 논문(arXiv 2511.14233, IEEE Xplore, 2025-11-18)", "closing_text": "화면을 넓히고, 그래픽을 정합시키고, 광학계를 지우는 세 갈래가 동시에 진행 중이다. 이번 호에서 AI가 픽한 기술들은 결국 하나의 방향을 가리킨다. HUD는 더 이상 화면을 어떻게 보여줄까 고민하는 장치가 아니라, 무엇을 보여줄지 스스로 판단하는 인터페이스로 옮겨가고 있다. Head-Up Display라는 이름조차, 곧 어색해질지 모른다."}], "page_groups": [[0], [1], [2], [3]]};

const GRADUATES = [{"label": "배출인력 소개", "portrait": "graduates/kim_th.jpg", "title": "김태현", "subtitle": "졸업예정 · QLED 표면·계면 제어 연구", "advisor": "송장근 교수", "lab_url": "https://swb.skku.edu/display/index.do", "body_md": "QLED 성능을 좌우하는 핵심은 '표면·계면 제어'라는 확신으로 재료 분석부터 소자 성능 향상까지 연구를 이어왔다. ZnMgO 전자수송층에 극성 용매를 처리해 표면 결함을 줄이는 패시베이션 조건을 탐색했고, 용매 선택과 처리 조건에 따라 표면 화학과 소자 특성이 동시에 달라지는 지점에 주목했다. CdSe 양자점에서는 리간드 교환으로 전하 주입을 방해하는 유기물을 줄여 계면 트랩을 최소화했고, 양자점·전하수송층 계면에서의 전하 이동과 발광 효율을 함께 개선하는 것을 목표로 삼았다. 양자점 합성부터 박막 형성, 소자 제작·평가까지 전 과정을 직접 다루며 재료와 공정, 소자를 함께 이해하는 역량을 키웠다.", "education": [{"level": "고등학교", "school": "분당대진고", "period": "2013~2016", "major": "이과"}, {"level": "대학교", "school": "경희대학교", "period": "2017~2023", "major": "정보전자신소재공학과"}, {"level": "대학원(석)", "school": "성균관대학교", "period": "2024.09~2026.08", "major": "첨단디스플레이공학"}], "achievements": ["2025 SID 포스터 발표", "2025 IMID 포스터 발표"], "interests": ["Quantum Dot LED", "Quantum Dot Synthesis"], "certs": ["OPIc IH"]}, {"label": "배출인력 소개", "portrait": "graduates/park_sa.png", "title": "박설아", "subtitle": "졸업예정 · 산화물 TFT 신뢰성", "advisor": "김용상 교수", "lab_url": "https://swb.skku.edu/NEMS/index.do", "body_md": "김용상 교수님 연구실에서 산화물(IGZO) 기반 박막 트랜지스터(TFT) 연구를 수행해왔다. 용액 공정으로 IGZO TFT를 제작할 때 Precursor 변경을 통한 Fluorine 도핑으로 이동도를 높이는 연구와, Sputtering 기반 IGZO TFT의 Passivation 공정에 쓰이는 가교제를 active layer에 단독 적용했을 때의 소자 특성 변화를 다뤘고, 이 연구로 IMID 학회에서 Best Poster Award를 수상했다. RF Magnetron Sputtering과 용액 공정을 비롯한 박막 증착·포토리소그래피·식각·전기적 특성 평가 등 공정을 직접 수행하고 팀원들과 함께 최적화 과정을 진행했으며, SEM·XPS·XRD·AFM으로 소자 구조와 화학적 변화를 해석하며 소자 특성 분석과 데이터 처리 역량을 키웠다. 주어진 연구에 끈기 있게 몰입해 결과를 논리적으로 해석하고 발전 방향을 제시하는 자세로, 산화물 반도체와 차세대 디스플레이 소자 개발 분야의 전문 연구자로 성장하는 것이 목표다.", "education": [{"level": "대학교", "school": "인하대학교", "period": "2019.03~2024.02", "major": "화학공학과"}, {"level": "대학원(석)", "school": "성균관대학교", "period": "2024.09~2026.08", "major": "첨단디스플레이공학"}], "achievements": ["Improvement of Mobility and Stability of Solution-Processed IGZO TFTs by Using Fluoride Precursor — IMiD 2025, Best Poste function mdToParas(md){
  return md.split(/\n\s*\n/).map(p=>{
    const t=p.trim();
    if(!t) return '';
    const html=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
    return /^</.test(t) ? html : `<p>${html}</p>`;
  }).join('');
}

function buildAccHTML(grouped,isConf){
  let html='';
  Object.keys(grouped).sort().forEach(key=>{
    const items=grouped[key];
    const id='ac'+Math.random().toString(36).slice(2,8);
    html+=`<div><div class="acc-hdr" onclick="toggleAcc('${id}')">
      <span>${key}</span>
      <span style="display:flex;align-items:center;gap:8px">
        <span style="font-size:14px;font-weight:700;color:#111">${items.length}건</span>
        <span id="arr_${id}" style="font-size:10px;color:#aaa;transition:transform .2s">▼</span>
      </span>
    </div><div class="acc-body" id="${id}">`;
    items.forEach(item=>{
      const meta=isConf?`발표자: ${item.presenter} · ${item.conf} · ${item.date}`:`${item.journal} · ${item.issue} · ${item.date}`;
      const badge=isConf
        ?`<span style="font-size:8px;padding:1px 5px;background:#e6f4ea;color:#1a7a3a;border-radius:3px;border:1px solid #a8d8b8;flex-shrink:0;margin-top:2px">발표</span>`
        :`<span style="font-size:8px;padding:1px 5px;background:#e8f0fb;color:#1a56a0;border-radius:3px;border:1px solid #b3ccf0;flex-shrink:0;margin-top:2px">SCIE</span>`;
      const titleEl=isConf
        ?`<span style="font-size:10px;font-weight:600;color:#333;line-height:1.4;word-break:break-word">${item.title}</span>`
        :`<a href="https://scholar.google.com/scholar?q=${encodeURIComponent(item.title)}" target="_blank" style="font-size:10px;font-weight:600;color:#1a56a0;text-decoration:none;line-height:1.4;word-break:break-word">${item.title}</a>`;
      html+=`<div class="acc-row"><div style="display:flex;gap:4px;align-items:flex-start;margin-bottom:2px">${badge}${titleEl}</div><div style="font-size:9px;color:#888;padding-left:25px;line-height:1.4">${meta}</div></div>`;
    });
    html+=`</div></div>`;
  });
  return html;
}

// 모바일은 북의 페이지 분할(intro.pages)을 따르지 않고 body_md 전체를 한 장에 렌더링한다
// (<!-- page --> 마커가 남아있어도 HTML 주석이라 화면엔 안 보임).
function phoneIntroPage(intro){
  const headerHtml = (intro.portrait || intro.title || intro.subtitle) ? `<div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:14px">
      ${intro.portrait ? `<img src="${ASSETS}${intro.portrait}" alt="${intro.title}" class="img-portrait p-portrait" onerror="this.style.display='none'">` : ''}
      <div class="note" style="flex:1">${intro.title ? `<h3>${intro.title}</h3>` : ''}${intro.subtitle ? `<div class="dt" style="margin:8px 0"></div><p>${intro.subtitle.replace(/\n/g,'<br>')}</p>` : ''}</div>
    </div>` : '';
  // 크롭 없이 원본 비율 그대로(height:auto) — 예전엔 고정 높이+object-fit:cover로 위아래가 잘렸음
  const featureImgHtml = intro.feature_image ? `<div style="width:100%;border-radius:8px;overflow:hidden;margin-bottom:14px;box-shadow:0 4px 12px rgba(0,0,0,.15)">
      <img src="${ASSETS}${intro.feature_image}" alt="${intro.title||'연구실'}" style="width:100%;height:auto;display:block" onerror="this.parentElement.style.display='none'">
    </div>` : '';
  const bottomPhotos = [intro.bottom_image, intro.bottom_image2].filter(Boolean);
  const bottomImgHtml = bottomPhotos.length ? `<div class="dt"></div><div style="display:flex;gap:8px;margin-top:10px">
      ${bottomPhotos.map(src => `<div style="flex:1;height:${intro.bottom_image_height_mobile||intro.bottom_image_height||110}px;border-radius:8px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.15)">
        <img src="${ASSETS}${src}" alt="${intro.title||'연구실'}" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.parentElement.style.display='none'">
      </div>`).join('')}
    </div>` : '';
  // book에서 사진이 중간 페이지에 있던 경우(body_md_before/after로 분리됨) 모바일에서도 같은
  // 위치(본문 중간)에 사진이 오도록 한다. 사진이 첫 페이지에 있던 경우는 기존처럼 헤더 바로 아래.
  const hasSplitBody = intro.body_md_before !== undefined;
  const bodyBlockHtml = hasSplitBody
    ? `<div class="body">${mdToParas(intro.body_md_before)}</div>${featureImgHtml}<div class="body">${mdToParas(intro.body_md_after)}</div>`
    : `${featureImgHtml}<div class="body">${mdToParas(intro.body_md)}</div>`;
  return `<div class="pp">
    <div class="db"></div>
    ${headerHtml}
    <div class="dt"></div>
    ${bodyBlockHtml}
    ${bottomImgHtml}
    ${intro.signer ? `<div class="dt"></div><div style="text-align:right;font-size:13px;color:#aaa">${intro.signer}</div>` : ''}
  </div>`;
}

// 교수님소개는 신방식(intro.pages, <!-- page --> 마커)과 구방식(lab-x-1 → lab-x-1-p2 → ...
// 배열 항목을 여러 개로 쪼개는 방식)이 섞여 있을 수 있다. 모바일은 어느 쪽이든 실제 교수
// 1인당 정확히 1장으로 합친다 — book/print의 페이지 분할 여부와 무관하게(위 4개 칼럼과 동일 원칙).
function groupProfIntros(){
  const profIntros = INTROS.filter(i => i.id !== 'head' && i.id !== 'dean');
  const groups = [], byBase = {};
  profIntros.forEach(intro => {
    const baseId = intro.id.replace(/(-p\d+)+$/, '');
    if (!byBase[baseId]) { byBase[baseId] = { base: intro, parts: [] }; groups.push(byBase[baseId]); }
    byBase[baseId].parts.push(intro);
  });
  return groups.map(g => {
    const bodyParts = g.parts.map(p => p.pages ? p.pages.join('\n\n') : (p.body_md || ''));
    // 사진 등 시각 요소는 첫 조각에만 있다고 가정하면 안 된다 — 이어지는 조각(-p2 등)에 하단사진이
    // 붙어있는 경우가 실제로 있었다(2026-09 전종욱 교수 자료). 전 조각을 훑어 처음 발견되는 값을 쓴다.
    const merged = Object.assign({}, g.base);
    const visualFields = ['feature_image', 'feature_image_height', 'feature_image_fit', 'bottom_image', 'bottom_image2', 'bottom_image_height', 'bottom_image_height_mobile', 'signer'];
    let featureImgPartIdx = -1;
    visualFields.forEach(key => {
      if (!merged[key]) {
        const foundIdx = g.parts.findIndex(p => p[key]);
        if (foundIdx >= 0) {
          merged[key] = g.parts[foundIdx][key];
          if (key === 'feature_image') featureImgPartIdx = foundIdx;
        }
      }
    });
    if (featureImgPartIdx > 0) {
      // book에서 사진이 중간(2번째 이후) 조각에 있었다면 모바일도 본문을 그 앞뒤로 나눠
      // 같은 위치(중간)에 사진이 오도록 한다 — 모든 텍스트를 이어붙이고 사진만 맨 위로
      // 몰아버리면 book/phone 배치가 어긋난다([[feedback_phone_html_page_array_coupling]] 계열 문제).
      merged.body_md_before = bodyParts.slice(0, featureImgPartIdx).join('\n\n');
      merged.body_md_after = bodyParts.slice(featureImgPartIdx).join('\n\n');
    } else {
      merged.body_md = bodyParts.join('\n\n');
    }
    return merged;
  });
}

    pagesHTML.push(`<div class="pp" style="padding-bottom:12px">

      </div>`:''}
      <div>
        <div style="height:2px;width:100%;background:linear-gradient(90deg,#ffd700,transparent);margin-bottom:16px"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <span style="font-size:13px;color:#ffd700;font-weight:600">${META.issue_number}</span>
          <span style="font-size:13px;color:#ccc">${META.date_label}</span>
          <span style="font-size:13px;color:#ccc">${META.back_cover_city}</span>
        </div>
        ${META.publish_date?`<div style="font-size:11px;color:#999;margin-top:10px">발행일 | ${META.publish_date}</div>`:''}
      </div>
    </div>`
  );
  // 사진 HTML을 뒤표지 앞에 삽입 (phonePages 순서와 일치)
  if(PHOTOS.length){
    pagesHTML.splice(pagesHTML.length-1, 0, ...PHOTOS.map(ph=>phoneFullPhoto(ph)));
  }

  // 웹용 webp 우선 로드 — HTML 문자열 단계에서 src를 webp로 바꾸고 원본은 data-fallback에 보존
  // (원본+webp 이중 요청 방지, webp 없으면 error 이벤트로 원본 폴백)
  phonePages.forEach((pg,i)=>{
    const div=document.createElement('div');
    div.className='phone-page'+(i===0?' active':'');
    div.id=pg.id;
    div.innerHTML=pagesHTML[i].replace(/(<img[^>]*\ssrc=")([^"]+?)\.(png|jpe?g)(")/gi,
      (m,pre,path,ext,post)=>`${pre}${path}.webp${post} data-fallback="${path}.${ext}"`);
    wrap.appendChild(div);
  });
  wrap.addEventListener('error', e=>{
    const t=e.target;
    if(t.tagName==='IMG' && t.dataset.fallback && t.src.indexOf('.webp')>-1){ t.src=t.dataset.fallback; }

/* ══ 칼럼별 시각 구분 — 라벨·상단바 칼럼 고유색 틴팅 ══ */
const COL_ACCENT=[['廣角','#B08A2E'],['광각','#B08A2E'],['이달의 논문','#C0392B'],['Display Tech','#1A56A0'],['연구실','#1A7A4A'],['인사말','#2C3E70'],['축사','#2C3E70'],['1분기','#5B6770'],['학과 현황','#5B6770'],['학과 주요 행사','#5B6770']];
const EDGE_COLS=['廣角','광각','이달의 논문','Display Tech','연구실'];  // 엣지 인덱스 적용 칼럼(인사말·축사·실적·현황/행사 제외)
function accentFor(t){if(!t)return null;for(const[k,c]of COL_ACCENT){if(t.indexOf(k)>=0)return c;}return null;}
function isEdgeCol(t){if(!t)return false;for(const k of EDGE_COLS){if(t.indexOf(k)>=0)return true;}return false;}
function tintColumns(root){
  root.querySelectorAll('.db').forEach(db=>{
    let accent=null,matched='',sib=db.nextElementSibling,hops=0;
    while(sib&&hops<3&&!accent){const t=(sib.textContent||'').trim();if(t.length<60){accent=accentFor(t);if(accent)matched=t;}sib=sib.nextElementSibling;hops++;}
    if(!accent)return;
    db.style.background=accent;
    const page=db.parentElement;if(!page)return;
    page.querySelectorAll('span,div').forEach(s=>{if(s.style&&/rgb\(217,\s*48,\s*37\)/.test(s.style.color))s.style.color=accent;});
    if(isEdgeCol(matched)){
      const box=db.closest('.phone-page');
      if(box&&!box.querySelector('.edge-idx')){
        const bar=document.createElement('div');bar.className='edge-idx';
        bar.style.cssText='position:absolute;top:0;left:0;width:6px;height:64px;background:'+accent+';border-radius:12px 0 3px 0;z-index:4';
        box.appendChild(bar);
      }
    }
  });
}

let cur=0;
const dotsEl=document.getElementById('phone-dots');

function initDots(){
  phonePages.forEach((_,i)=>{
    const d=document.createElement('button');
    d.className='phone-dot'+(i===0?' active':'');
    d.onclick=()=>phoneJump(i);
    dotsEl.appendChild(d);
  });
}

function phoneJump(i){
  document.getElementById(phonePages[cur].id).classList.remove('active');
  document.querySelectorAll('.phone-dot')[cur].classList.remove('active');
  cur=i;
  const el=document.getElementById(phonePages[cur].id);
  el.classList.add('active');el.scrollTop=0;
  document.querySelectorAll('.phone-dot')[cur].classList.add('active');
  document.getElementById('pinfo').textContent=phonePages[cur].label;
  document.getElementById('p-btn-prev').disabled=cur===0;
  document.getElementById('p-btn-next').disabled=cur===phonePages.length-1;
  dotsEl.style.visibility=(cur===0||cur===phonePages.length-1)?'hidden':'visible';
}
function phoneGo(d){phoneJump(Math.min(Math.max(cur+d,0),phonePages.length-1));}

// 전체화면에서 세로 강제 락. portrait 실패 시 portrait-primary 폴백(기기별 값 차이 대비).
function lockPortrait(){
  try{
    if(screen.orientation&&screen.orientation.lock){
      screen.orientation.lock('portrait').catch(function(){
        try{ screen.orientation.lock('portrait-primary').catch(function(){}); }catch(e){}
      });
    }
  }catch(e){}
}
function toggleFS(){
  const b=document.getElementById('p-btn-fs');
  const ov=document.getElementById('rotate-overlay');
  if(!document.fullscreenElement&&!document.webkitFullscreenElement){
    // 이 기기는 전체화면에서 방향을 못 읽으므로(강제 가로회전), 진입 직전 일반모드 판단을 스냅샷(폴백)
    if(ov) ov.classList.toggle('fs-show', window.matchMedia('(orientation:landscape)').matches);
    document.body.classList.add('fs');
    const el=document.documentElement;
    const req=el.requestFullscreen||el.webkitRequestFullscreen;
    const p=req.call(el);
    // 전체화면 진입 후 세로로 잠금(지원 기기=가로로 눕지 않고 세로 유지). promise 타이밍·미지원 대비 재시도 + portrait-primary 폴백.
    if(p&&p.then) p.then(lockPortrait).catch(function(){});
    setTimeout(lockPortrait,150); setTimeout(lockPortrait,500);
    b.textContent='종료';
  }else{
    try{ if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
    if(document.exitFullscreen)document.exitFullscreen();
    else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
    b.textContent='전체화면';
  }
}
function onFsChange(){
  const fs=document.fullscreenElement||document.webkitFullscreenElement;
  const b=document.getElementById('p-btn-fs'); if(b)b.textContent=fs?'종료':'전체화면';
  if(fs){ lockPortrait(); }   // 전체화면 진입 확정 시점에 한 번 더 세로 락(가장 신뢰도 높은 타이밍)
  if(!fs){ document.body.classList.remove('fs'); const ov=document.getElementById('rotate-overlay'); if(ov)ov.classList.remove('fs-show'); }
}
document.addEventListener('fullscreenchange',onFsChange);
document.addEventListener('webkitfullscreenchange',onFsChange);

function toggleAcc(id){
  const b=document.getElementById(id),arr=document.getElementById('arr_'+id);
  if(!b)return;
  const open=b.classList.toggle('open');
  if(arr)arr.style.transform=open?'rotate(180deg)':'';
  const hdr=b.previousElementSibling;
  if(hdr)hdr.style.borderRadius=open?'7px 7px 0 0':'7px';
}

function initReveal(){
  const els=document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return;}
  const io=new IntersectionObserver((ents)=>{ents.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}});},{threshold:0.18});
  els.forEach(e=>io.observe(e));
}
buildPhonePages();
document.querySelectorAll('.zoomable').forEach(attachInplaceZoom);
initDots();
initReveal();
phoneJump(0);

/* ══ 제자리 확대(인플레이스 줌) — 팝업 없이 액자 안에서 확대. 더블탭·핀치 ══ */
function attachInplaceZoom(box){
  const img=box.querySelector('img'); if(!img) return;
  let scale=1, tx=0, ty=0, panning=false, sx=0, sy=0;
  const MAX=5;
  function clamp(){ const W=box.clientWidth,H=box.clientHeight;
    tx=Math.min(0,Math.max(-(scale-1)*W,tx)); ty=Math.min(0,Math.max(-(scale-1)*H,ty)); }
  function apply(){ clamp(); img.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
    box.classList.toggle('zoomed',scale>1.01); }
  function zoomAt(px,py,ns){ ns=Math.max(1,Math.min(ns,MAX));
    tx=px-(px-tx)*(ns/scale); ty=py-(py-ty)*(ns/scale); scale=ns; img.style.transition='none'; apply(); }
  function reset(){ img.style.transition='transform .2s ease-out'; scale=1; tx=0; ty=0; apply(); }
  // 데스크탑(터치스크린 노트북 등): 휠 줌 · 드래그 이동 · 더블클릭 토글
  box.addEventListener('wheel',e=>{ e.preventDefault(); const r=box.getBoundingClientRect();
    zoomAt(e.clientX-r.left,e.clientY-r.top,scale*(e.deltaY<0?1.2:0.83)); },{passive:false});
  box.addEventListener('mousedown',e=>{ if(scale<=1)return; panning=true; img.style.transition='none';
    sx=e.clientX-tx; sy=e.clientY-ty; e.preventDefault(); });
  window.addEventListener('mousemove',e=>{ if(!panning)return; tx=e.clientX-sx; ty=e.clientY-sy; apply(); });
  window.addEventListener('mouseup',()=>{ panning=false; });
  box.addEventListener('dblclick',e=>{ const r=box.getBoundingClientRect();
    if(scale>1) reset(); else zoomAt(e.clientX-r.left,e.clientY-r.top,2.4); });
  // 모바일: 핀치 줌 · 확대상태 1손가락 이동 · 더블탭 토글
  let pinchD=0,pStart=1,pcx=0,pcy=0,lastT=null,lastTap=0;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  box.addEventListener('touchstart',e=>{
    if(e.touches.length===2){ const r=box.getBoundingClientRect(); pinchD=dist(e.touches); pStart=scale;
      pcx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left; pcy=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top; }
    else if(e.touches.length===1){ const now=Date.now();
      if(now-lastTap<300){ const r=box.getBoundingClientRect();
        if(scale>1) reset(); else zoomAt(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top,2.4); } lastTap=now;
      if(scale>1) lastT={x:e.touches[0].clientX-tx,y:e.touches[0].clientY-ty}; }
  },{passive:false});
  box.addEventListener('touchmove',e=>{
    if(e.touches.length===2){ e.preventDefault(); zoomAt(pcx,pcy,pStart*(dist(e.touches)/pinchD)); }
    else if(e.touches.length===1&&scale>1&&lastT){ e.preventDefault();
      tx=e.touches[0].clientX-lastT.x; ty=e.touches[0].clientY-lastT.y; apply(); }
  },{passive:false});
}

// ══ 터치 스와이프로 페이지 넘김 ══
(function(){
  let startX=0, startY=0, startTime=0;
  const wrap = document.getElementById('phone-wrap');

  wrap.addEventListener('touchstart', e=>{
    const t = e.changedTouches[0];
    startX = t.clientX;
    startY = t.clientY;
    startTime = Date.now();
  }, {passive:true});

  wrap.addEventListener('touchend', e=>{
    // 핀치 줌 중 또는 그림 제자리확대(zoomed) 중에는 페이지 넘김 차단 (사진 확대 보기 우선)
    if(window.visualViewport && window.visualViewport.scale > 1.01) return;
    if(document.querySelector('.zoomable.zoomed')) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    const dt = Date.now() - startTime;
    // 가로 이동이 세로보다 크고, 가로 50px↑ 이동, 0.6초 안에 끝나면 스와이프로 간주
    if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50 && dt < 600){
      if(dx < 0) phoneGo(1);   // 왼쪽으로 밀기 → 다음 페이지
      else       phoneGo(-1);   // 오른쪽으로 밀기 → 이전 페이지
    }
  }, {passive:true});
})();
</script>
