    "portrait": "graduates/chae_sh.png",
    "title": "채수현",
    "subtitle": "졸업예정 · 이트륨 도핑 IGZO TFT",
    "advisor": "김용상 교수",
    "body_md": "차세대 디스플레이 백플레인의 공정 경제성과 소자 신뢰성 확보를 위해 산화물 반도체 기술을 연구했다. 극소량 도핑이 가능한 용액 공정으로 희토류 원소 이트륨을 IGZO 채널에 도핑해 IGZO TFT의 불안정성 문제 해결을 시도했다. 이트륨의 강력한 산소 결합 친화력으로 트랩 밀도를 억제해, Positive Bias Stress 환경에서 성능 변화 폭을 무도핑 대비 71% 줄이고 스위칭 효율(SS)을 32% 개선했으며, 소자 구동 형태를 Enhancement Mode로 전환시켰다. 이 연구는 소자의 장기 내구성과 구동 효율 측면에서 긍정적인 결과를 가져왔고, 디스플레이 제품의 수명과 장기 신뢰성 문제를 해결할 새로운 방법을 제시했다. 재료 합성부터 박막 증착, 소자 제작, 전기적 신뢰성 분석까지 전 과정을 주도적으로 수행하며 TFT 공정 최적화와 신뢰성 평가 역량을 갖췄다. 이 결과는 차세대 AMOLED·Micro-LED 기술의 상용화에 필요한 장기 신뢰성과 대면적 양산 경제성 문제에 실질적인 해결책을 제시할 수 있을 것으로 기대되며, 앞으로도 첨단소재와 공정기술을 선도하는 연구를 지속해 산업 현장에 빠르게 적용되도록 기여하고 싶다.",
    "education": [
      { "level": "고등학교", "school": "문경여자고등학교", "period": "2016.03~2019.02", "major": "-" },
      { "level": "대학교", "school": "한림대학교", "period": "2019.02~2024.02", "major": "반도체 전공" },
      { "level": "대학원(석)", "school": "성균관대학교", "period": "2024.09~2026.08", "major": "첨단디스플레이공학" }
    ],
    "achievements": [
      "Analysis of Y Doping Induced Positive VTH Shift in Solution-Processed IGZO TFTs — IMiD 2025",
      "Yttrium 도핑 농도에 따른 용액 공정 기반 IGZO:Y TFT의 신뢰성 분석 — 대한전기학회 하계학술대회"
    ],
    "interests": ["Oxide TFT", "Semiconductor Process"]
  }
];

function mdToParas(md){
  return (md||'').split(/\n\s*\n/).map(p=>{
    const t=p.trim();
    if(!t) return '';
    const html=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
    return /^</.test(t) ? html : `<p>${html}</p>`;
  }).join('');
}

function bGradPage(g, pageNum){
  const pillBlue = 'display:inline-block;background:#f0f4ff;color:#1A56A0;border:1px solid #c5d7f7;padding:2px 8px;border-radius:20px;font-size:10px;white-space:nowrap;margin:1px 3px 1px 0';
  const pillGray = 'display:inline-block;background:#f7f5f1;color:#555;border:1px solid #e8e4de;padding:2px 8px;border-radius:20px;font-size:10px;white-space:nowrap;margin:1px 3px 1px 0';

  const missing = 'color:#aaa;font-style:italic';
  const advisorLine = g.advisor
    ? `<div style="font-size:12.5px;color:#555;margin-top:4px">지도교수: ${g.advisor}</div>`
    : `<div style="font-size:12.5px;margin-top:4px;${missing}">지도교수: (입력 필요)</div>`;
  const intPills = (g.interests && g.interests.length) ? g.interests.map(i=>`<span style="${pillBlue}">${i}</span>`).join('') : '';
  const contactLine = (label, value, isLink) => value
    ? `<div style="font-size:11.5px;color:#555;margin-top:3px">${label}: ${isLink ? `<a href="${value}" style="color:#1A56A0;text-decoration:underline">${value}</a>` : value}</div>`
    : `<div style="font-size:11.5px;margin-top:3px;${missing}">${label}: (입력 필요)</div>`;

  const headerHtml = `<div style="display:flex;gap:18px;align-items:flex-start;margin-bottom:12px">
      ${g.portrait ? `<img src="${ASSETS}${g.portrait}" alt="${g.title}" style="width:124px;height:154px;object-fit:cover;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.15);flex-shrink:0" onerror="this.style.display='none'">` : ''}
      <div class="note" style="flex:1">
        <h2>${g.title}</h2>
        ${g.subtitle ? `<p style="font-size:13.5px;font-style:italic;color:#555;line-height:1.5;word-break:keep-all;margin-top:6px">${g.subtitle}</p>` : ''}
        ${advisorLine}
        ${intPills ? `<div style="margin-top:6px">${intPills}</div>` : ''}
        ${contactLine('이메일', g.email, false)}
        ${contactLine('휴대폰', g.phone, false)}
        ${contactLine('연구실', g.lab_url, true)}
      </div>
    </div>`;

  const specTh = 'padding:5px 8px;border:1px solid #e0d8cc;font-weight:700;color:#555;background:#f7f4ef;text-align:left;font-size:10.5px;white-space:nowrap;vertical-align:top';
  const specTd = 'padding:5px 8px;border:1px solid #e0d8cc;line-height:1.55;font-size:10.5px;text-align:left;vertical-align:top;word-break:keep-all';

  const eduContent = (g.education && g.education.length) ? g.education.map(e=>`${e.level} · ${e.school} (${e.period})${(e.major && e.major!=='-') ? ' · '+e.major : ''}`).join('<br>') : '—';
  const achTotal = g.achievements_total || (g.achievements ? g.achievements.length : 0);
  const achLabel = achTotal > (g.achievements||[]).length ? `주요 연구 성과 <span style="color:#aaa;font-weight:400">(${(g.achievements||[]).length}/${achTotal}건)</span>` : `주요 연구 성과 <span style="color:#aaa;font-weight:400">(${achTotal}건)</span>`;
  const achContent = (g.achievements && g.achievements.length) ? g.achievements.map(a=>`<span style="color:#d93025">·</span> ${a}`).join('<br>') : '—';
  const certContent = (g.certs && g.certs.length) ? g.certs.map(c=>`<span style="${pillGray}">${c}</span>`).join('') : '—';

  const specRows = [
    ['학력', eduContent],
    [achLabel, achContent],
    ['자격증·어학', certContent],
  ];
  const specTable = `<table style="width:100%;border-collapse:collapse;table-layout:fixed;margin-top:4px">
    <colgroup><col style="width:24%"><col style="width:76%"></colgroup>
    <tbody>${specRows.map(([label,content])=>`<tr><th style="${specTh}">${label}</th><td style="${specTd}">${content}</td></tr>`).join('')}</tbody>
  </table>`;

  return `<div class="bp" id="bp">
    <div class="db"></div><span class="label">${g.label}</span>
    ${headerHtml}
    <div class="dt"></div>
    ${specTable}
    <div class="body-txt" style="margin-top:10px">${mdToParas(g.body_md)}</div>
    <div class="bpg">${String(pageNum).padStart(2,'0')}</div>
  </div>`;
}

let idx = 0;
function render(){
  document.getElementById('page').innerHTML = bGradPage(GRADUATES[idx], idx+1);
  document.getElementById('counter').textContent = (idx+1) + ' / ' + GRADUATES.length + '  ' + GRADUATES[idx].title;
  document.getElementById('s-prev').disabled = idx===0;
  document.getElementById('s-next').disabled = idx===GRADUATES.length-1;
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active', i===idx));
}
function go(d){ idx = Math.max(0, Math.min(GRADUATES.length-1, idx+d)); render(); }
function goTo(i){ idx = i; render(); }

function buildDots(){
  const dots = document.getElementById('dots');
  dots.innerHTML = GRADUATES.map((g,i)=>`<button class="dot" title="${g.title}" onclick="goTo(${i})"></button>`).join('');
}

function fitScale(){
  const stage = document.getElementById('stage');
  const scaler = document.getElementById('scaler');
  const s = Math.min(1, (stage.clientWidth - 20) / 550, (stage.clientHeight - 12) / 770);
  scaler.style.transform = `scale(${s})`;
  scaler.style.transformOrigin = 'center center';
}
window.addEventListener('resize', fitScale);

let touchX = null;
document.getElementById('stage').addEventListener('touchstart', e=>{ touchX = e.touches[0].clientX; }, {passive:true});
document.getElementById('stage').addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx) > 40){ dx < 0 ? go(1) : go(-1); }
  touchX = null;
}, {passive:true});

buildDots();
render();
fitScale();
</script>
</body>
</html>
